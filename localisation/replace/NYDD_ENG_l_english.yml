NYDD_ENG_army_title: "All Is Ready"
NYDD_ENG_army_desc: "The time has come. The era of us bending to compromise and paying taxes to French lords is over. Countrymen, we are not servants of France, nor fish on the chopping block for the Vikings. Englishmen, forward, forward, forward! Go fight for the future of our nation!"
NYDD_ENG_spy_FRA_title: "No Time to Lose"
NYDD_ENG_spy_FRA_desc: "The French are deep in civil strife, too busy to attend to themselves. We need only send our best diplomats to infiltrate Wessex."
NYDD_ENG_wessex_title: "Broken Dream"
NYDD_ENG_wessex_desc: "Once, the invincible William the Conqueror led a great army in invasion, occupying Wessex and other English provinces, and arbitrarily transformed them into the Anglois region, hoping one day to turn English land into a Norman homeland. Now, their dream will shatter under our battles, flowing into the sea with the wind."

NYDD_ENG_army_ttyes: "£yes£If we complete this mission without the modifier '§YFive Provinces Militia Reform§!', §Jextend§! the modifier '§YFive Provinces Provincial Army§!' by §G10§! years.\n"
NYDD_ENG_army_ttno: "£no£If we complete this mission without the modifier '§YFive Provinces Militia Reform§!', §Jextend§! the modifier '§YFive Provinces Provincial Army§!' by §G10§! years.\n"
NYDD_ENG_army_modifier: "English Provincial Army"
desc_NYDD_ENG_army_modifier: "Provincial armies raised by the cities, a bit stronger than ordinary temporarily conscripted militia."
NYDD_ENG_wessex_ttyes: "£yes£If we §Msupported§! the §YCornish Uprising§! and honored the alliance: "
NYDD_ENG_wessex_ttno: "£no£If we §Msupported§! the §YCornish Uprising§! and honored the alliance: "
NYDD_ENG_wessex_modifier: "Line Infiltration"
desc_NYDD_ENG_wessex_modifier: "This province has been infiltrated by the enemy."

NYDD_ENG_five_province_union_title: "Five Provinces Union"
NYDD_ENG_five_province_union_desc: "The Five Provinces Union was born from the Magna Carta signed with the French king a century ago, which stipulated the autonomy of the five provinces. Now, we have achieved de facto independence, and the French can no longer tax us. To this end, we may reorganize the Five Provinces Union and prepare to reclaim England."
NYDD_ENG_netherland_friend_title: "Low Countries Friendship"
NYDD_ENG_netherland_friend_desc: "The Low Countries fought alongside us against France in the past; surely we will be good friends in the future too, right?"
NYDD_ENG_reclaim_mainland_title: "Reclaim the Heartland"
NYDD_ENG_reclaim_mainland_desc: "The Midlands are occupied by the evil Vikings; they are the heartland of our Kingdom of England, and we must reclaim them."
NYDD_ENG_northumbria_title: "Strike the Serpent's Nest"
NYDD_ENG_northumbria_desc: "The Vikings refuse to leave; we must help them depart."
NYDD_ENG_lazarus_title: "Lazarus"
NYDD_ENG_lazarus_desc: "Lazarus means rebirth. England is reborn from the ruins left by French and Viking bandits; she will rise, she will liberate all."

NYDD_ENG_five_province_union_tt: "To face the coming storm, we must attempt to centralize the Five Provinces Union.\n"
NYDD_ENG_netherland_friend_modifier: "Low Countries Trade"
desc_NYDD_ENG_netherland_friend_modifier: "Thanks to our new agreements with our Low Countries allies, our trade is booming."
NYDD_ENG_netherland_friend_ttt: "nations with capitals in the §YLow Countries§! are §Yallied§! with us or have improved relations by §G50§!"
NYDD_ENG_netherland_friend_tt: "Each qualifying nation or our trade league member grants us §G25§!£icon_gold£ and §G500§!£icon_manpower£.\n"
NYDD_ENG_reclaim_mainland_tt: "Provinces meeting the conditions but §Rnot§! belonging to [Root.GetName] or its subjects gain: "
NYDD_ENG_reclaim_mainland_tt2: "Provinces meeting the conditions and §Mdirectly owned§! gain: "
NYDD_ENG_reclaim_mainland_modifier: "Reclaiming Lost Land"
desc_NYDD_ENG_reclaim_mainland_modifier: "The local people welcome our arrival and see us as liberators."
NYDD_ENG_reclaim_mainland_modifier2: "Integration Work"
desc_NYDD_ENG_reclaim_mainland_modifier2: "The local people actively embrace our integration work."
NYDD_ENG_lazarus_ttt: "Has completed the event '§YDebate on the Form of State§!'\n§g(Triggers after forming England)§!"

NYDD_ENG_new_ally_title: "New Ally"
NYDD_ENG_new_ally_desc: "The Welsh are struggling alone in the war against the Vikings. Let us send them some aid, hoping they can survive this winter."
NYDD_ENG_spy_DLW_title: "Secret Observation"
NYDD_ENG_spy_DLW_desc: "Our spies in the Danelaw bring good news—it turns out there are still many kind-hearted people secretly loyal to English orthodoxy in the Danelaw. With a little aid from us, they can be of use to us."
NYDD_ENG_wales_title: "Know the Times" # Those Who Know the Times
NYDD_ENG_wales_desc: "Although the Welsh once served the Vikings, ultimately they too are among the oppressed. We should unite all forces that can be united, as long as they know the times."

NYDD_ENG_new_ally_tt: "We will provide weapons to our dear §YWelsh§! partners to help them resist Norse rule. If we §Mdeclare war§! on @DLW§Y[DLW.GetName]§! while they are still a subject, they will §Ydeclare independence§!.\n\nThis will also grant us §G10§! favors and trust between us.\n"
NYDD_ENG_new_ally_modifier: "English Goodwill Aid"
desc_NYDD_ENG_new_ally_modifier: "Why does it feel like these are all old weapons."
NYDD_ENG_wales_ttt: "Is the nation we aided in the mission '§YNew Ally§!'"
NYDD_ENG_wales_tt: "We will §Mvassalize§! the nation we aided in the mission '§YNew Ally§!'."
NYDD_ENG_spy_DLW_modifier: "Covert Sabotage"
desc_NYDD_ENG_spy_DLW_modifier: "There's a mole!"

