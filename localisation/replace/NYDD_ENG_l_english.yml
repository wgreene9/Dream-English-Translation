NYDD_ENG_ireland_title: "Irish Charter"
NYDD_ENG_ireland_desc: "Ireland is a primitive wilderness. We have applied to His Holiness the Pope, granted us a charter to conquer Irish land."
NYDD_ENG_mountain_king_title: "King of the Hills"
NYDD_ENG_mountain_king_desc: "The Irish all superstition about the legend of the Hill of Tara. Legend says only a king crowned on this hill is worthy of being King of the Irish. Since we're here, let's make a brief stop here too."
NYDD_ENG_unite_kingdom_title: "[NYDD_ENG_unite_kingdom_title]"
NYDD_ENG_unite_kingdom_desc: "[NYDD_ENG_unite_kingdom_desc]"
NYDD_ENG_ship_in_sea_title: "Stout Ships in the Channel" # Stout Ships Enter the Channel
NYDD_ENG_ship_in_sea_desc: "Once, Vikings continuously came to Britain in longships from Scandinavia to burn, kill, and plunder. Now, we sail Britain's stout ships and powerful guns to the Danish Strait, to reward them fiercely."

NYDD_ENG_unite_kingdom_title1: "British Hegemony"
NYDD_ENG_unite_kingdom_desc1: "Rule, Britannia!"
NYDD_ENG_unite_kingdom_title2: "United Crown"
NYDD_ENG_unite_kingdom_desc2: "Unite, Britannia!"

NYDD_ENG_ireland_tt: "Unlocks casus belli '§YIrish Conquest§!' against §YIrish§! nations, with §G50.0%§! aggressive expansion modifier and §G75.0%§! war score modifier.\n\nUnder this casus belli, when occupying §YIrish§! provinces with §Yclaims§!, gain their §Gterritorial cores§!; when occupying §YIrish§! provinces §Owithout claims§!, gain §Jpermanent claims§!.\n"
NYDD_ENG_ireland_tt2: "Some Irish nobles have secretly approached us, hoping to discuss '§Ycooperation§!' with us.\n"
NYDD_ENG_mountain_king_ttt: "Please complete the current event '§YElegy of Ireland§!' choice"
NYDD_ENG_mountain_king_tt: "Qualifying §YInsular Catholic§! provinces under our rule will convert to §YRoman Catholic§!.\n"
NYDD_ENG_mountain_king_modifier: "Purge the Insularists"
desc_NYDD_ENG_mountain_king_modifier: "These Insular Catholics far from the continent are too heretical; we must re-spread the true faith to them."
NYDD_ENG_mountain_king_tt2: "All our §Ytributaries§! in §YIreland§! will merge into a unified @IRE§YIrish§! vassal.\n"
NYDD_ENG_mountain_king_modifier2: "Hammer of Storms"
desc_NYDD_ENG_mountain_king_modifier2: "Our powerful army is terrifying after defeating the Irish."
NYDD_ENG_unite_kingdom_tt1: "Our §Rhegemony§! over Britain is indisputable; we have once again proven that others cannot be trusted. Britain will move toward §Mre§!§Tbirth§! under our English leadership.\n"
NYDD_ENG_unite_kingdom_tt2: "Our §Junity§! in Britain is beyond reproach; others have proven to us that they too can become part of this family. Britain will move toward §Mre§!§Tbirth§! in the hymn of unity.\n"
NYDD_ENG_ship_in_sea_TRADE: "Crossing the Channel"
NYDD_ENG_ship_in_sea_ttyes: "£yes£If we chose the §YKnýtlinga§! dynasty and own all §YJutland§! and §YDanish§! culture provinces: " # Cnutling
NYDD_ENG_ship_in_sea_ttno: "£no£If we chose the §YKnýtlinga§! dynasty and own all §YJutland§! and §YDanish§! culture provinces: " # Cnutling
NYDD_ENG_ship_in_sea_tt: "§YJutland§! culture provinces convert to §YDanish§! culture.\n"
NYDD_ENG_ship_in_sea_modifier: "Channel Companions"
desc_NYDD_ENG_ship_in_sea_modifier: "English ships accompany me."

cb_ENG_conquer_ireland_DD_wg: "Irish Charter"
cb_ENG_conquer_ireland_DD_wg_desc: "War goal is to occupy target provinces."
cb_ENG_conquer_ireland_DD: "Irish Charter"
cb_ENG_conquer_ireland_DD_desc: "Our claim to Ireland has been legitimized by the Pope; now we need only conquer."

NYDD_ENG_north_fa_title: "The Northern Expedition" # Continue the Northern Expedition
NYDD_ENG_north_fa_desc: "Northern Expedition! Northern Expedition! Drive all the Vikings out!"
NYDD_ENG_stop_strom_title: "The Storm Subsides"
NYDD_ENG_stop_strom_desc: "The storm that disturbed Britain for a century has finally subsided with the destruction of the last Viking nation. This is truly a good day worth celebrating."
NYDD_ENG_rule_britain_title: "Rule Britain"
NYDD_ENG_rule_britain_desc: "The nations of Britain have all submitted to our rule; our rule is surely bright and wise."
NYDD_ENG_bloody_crusader_title: "Blood-Stained Expedition"
NYDD_ENG_bloody_crusader_desc: "The Vikings bloodied Britain in the past; we will launch a mighty expedition for this, painting Scandinavia with blood as well."
NYDD_ENG_flood_in_night_title: "Tide Floods the Good Night"
NYDD_ENG_flood_in_night_desc: "The waves beat, sending the tide into the good night, washing away the blood and tears shed by the Vikings."
NYDD_ENG_conquer_northsea_title: "Submission of the North Sea"
NYDD_ENG_conquer_northsea_desc: "Listen, even the waves of the North Sea submit to our rule."

NYDD_ENG_north_fa_modifier: "Northern Expedition"
desc_NYDD_ENG_north_fa_modifier: "Drive every last Viking from our land!"
NYDD_ENG_north_fa_modifier2: "Northern Expedition Resolve"
desc_NYDD_ENG_north_fa_modifier2: "No one's resolve to expel the Vikings is fiercer than ours."
NYDD_ENG_north_fa_tt1: "Modifier '§YNorthern Expedition§!' is replaced with '§YNorthern Expedition Resolve§!', duration §Jextended by 10§! years and additional effects:\nMorale Damage: §G+10.0%§!\n"
NYDD_ENG_north_fa_tt2: "On the eve of our Northern Expedition war, a group of Scots approached us.\n"
NYDD_ENG_north_fa_tt3: "On the eve of our Northern Expedition war, a group of Vikings approached us.\n"
NYDD_ENG_north_fa_tt4: "On the eve of our Northern Expedition war, a group of French-speaking English approached us.\n"
NYDD_ENG_rule_britain_ttt: "All subjects with capitals in §YBritain§! have liberty desire less than §G25.0%§!"
NYDD_ENG_rule_britain_tt3: "Since we unified Britain, the remaining Vikings have become a problem. Should we let them stay?"

NYDD_ENG_stop_strom_tt: "§YRemoves§! the modifier '§YViking Settlement§!' from all provinces under our rule without losing development, and additionally gain §G2§! base tax.\n"
NYDD_ENG_stop_strom_modifier: "Storm King"
desc_NYDD_ENG_stop_strom_modifier: "Wild winds and giant waves, obey my command!"
NYDD_ENG_rule_britain_modifier: "King of Britain"
desc_NYDD_ENG_rule_britain_modifier: "We have successfully unified Britain; now we must look outward."
NYDD_ENG_rule_britain_modifier2: "King of Britain"
desc_NYDD_ENG_rule_britain_modifier2: "Britain is our destiny, but our destiny is far from limited to this."
NYDD_ENG_rule_britain_tt2: "Modifier '§YKing of Britain§!' additional effects:\nProvince War Score Cost: §G-5.0%§!\n"
NYDD_ENG_bloody_crusader_modifier2: "Expedition Prelude"
desc_NYDD_ENG_bloody_crusader_modifier2: "This is only the beginning."
NYDD_ENG_bloody_crusader_modifier: "Chasing Waves"
desc_NYDD_ENG_bloody_crusader_modifier: "Do not fear, English lads."
NYDD_ENG_bloody_crusader_ttyes: "£yes£If our §Ynavy size§! is greater than all nations with capitals in §YScandinavia§!: "
NYDD_ENG_bloody_crusader_ttno: "£no£If our §Ynavy size§! is greater than all nations with capitals in §YScandinavia§!: "
NYDD_ENG_bloody_crusader_modifier3: "Viking Shipyard"
desc_NYDD_ENG_bloody_crusader_modifier3: "Some Viking descendants are also excellent shipwrights; they will serve us, building great ships."
NYDD_ENG_conquer_northsea_tt: "Unlocks naval doctrine '§YNorth Sea Combined Fleet§!', granting:\nAdmiral Maneuver: §G+1.00§!\nFleet Movement Speed: §G+1.00§!\nOwn Coast Naval Battle Bonus: §G+1.00§!\n"
DD_northsea_doctrine: "North Sea Combined Fleet"
DD_northsea_doctrine_desc: "The newborn North Sea Empire combines the naval strengths of England, Norway, and Denmark, forging an all-around combined fleet."
NYDD_ENG_conquer_northsea_tt2: "The Scandinavian campaign has come to an end; now it is time to decide the fate of these Vikings who once invaded Britain.\n"

NYDD_ENG_brittany_ally_title: "Unimagined Alliance"
NYDD_ENG_brittany_ally_desc: "We never thought we'd have anything to do with Brittany, but since we have a common enemy, of course we can cooperate."
NYDD_ENG_brave_heart_title: "Braveheart"
NYDD_ENG_brave_heart_desc: "People often say the Scots have a brave heart. Let's see how brave."
NYDD_ENG_together_toward_victory_title: "Hand in Hand"
NYDD_ENG_together_toward_victory_desc: "The Low Countries were our allies in the past; surely they will remain so in the future, right?"
NYDD_ENG_salvation_title: "Path of Salvation"
NYDD_ENG_salvation_desc: "This is our path of salvation."
NYDD_ENG_come_alive_title: "Rise from Ruin"
NYDD_ENG_come_alive_desc: "We have faced sunset three times, but we have persevered through all. You must first be destroyed to be reborn."
NYDD_ENG_never_ending_title: "Hope and Glory"
NYDD_ENG_never_ending_desc: "This is the land of hope and glory, our land."
NYDD_ENG_salvation_tt: "§YRepublican§! subjects §Gremove§! §Rsubject penalties§!.\n"

NYDD_ENG_brittany_ally_tt: "In the next war against @FRA§YFrance§!, @BRI§Y[BRI.GetName]§! will §Mfight alongside§! us.\n"
NYDD_ENG_brittany_ally_modifier: "Convert Little Britain"
desc_NYDD_ENG_brittany_ally_modifier: "Awaken, do you remember me?"
NYDD_ENG_brave_heart_tt_medici: "§MThrough meticulous and precise banking tricks, the Scots have accumulated countless debts to us. Things have come to this; they can only merge their nation with us to offset the debt. Alas, what can we do about it.§!\n"
NYDD_ENG_brave_heart_tt2: "§RThe Scots, realizing they were deceived, desperately launched a counterattack.§!\n\n§YBut it was too late; we had already reached an agreement with cooperative Scots.§!\n"
NYDD_ENG_brave_heart_tt3: "§YAlban§! culture will convert to §YScottish§! culture of the §YBritish§! culture group.\n"
NYDD_ENG_brave_heart_tt4: "When we expelled the Vikings and quelled the Scottish rebellion, a group of Scots approached us.\n"
NYDD_ENG_brave_heart_ttt: "@LOI§Y[LOI.GetName]§! has fewer than §Y3§! provinces in the §YBritish§! region"
NYDD_ENG_brave_heart_ttt2: "Please complete the current event '§YCollaboration from Within§!' choice"
NYDD_ENG_brave_heart_modifier: "Game of the Brave"
desc_NYDD_ENG_brave_heart_modifier: "Even with countless courage, it ultimately cannot withstand the tide of the times."
NYDD_ENG_brave_heart_modifier2: "Desperate Struggle"
desc_NYDD_ENG_brave_heart_modifier2: "Only to pay for our mistakes."
NYDD_ENG_brave_heart_modifier3: "Burying the Past"
desc_NYDD_ENG_brave_heart_modifier3: "They already had their chance."
NYDD_ENG_brave_heart_modifier4: "Scots in the Army"
desc_NYDD_ENG_brave_heart_modifier4: "Let us welcome this new friend."
NYDD_ENG_together_toward_victory_tt: "If we complete the mission via §Rinsulting a nation§!, we gain a casus belli '§YClaim Throne§!' against them for §G40§! years.\n"
NYDD_ENG_together_toward_victory_tt2: "As we solidify our rule in the Low Countries, it is time to rebuild our administrative circle there.\n"
NYDD_ENG_together_toward_victory_tt3: "If we complete the mission via §Rinsulting a nation§!, we gain a casus belli '§YVassalize Nation§!' against them for §G40§! years.\n"
NYDD_ENG_together_toward_victory_modifier: "England's Stout Ships and Powerful Guns"
desc_NYDD_ENG_together_toward_victory_modifier: "Cannons, so satisfying."
NYDD_ENG_together_toward_victory_modifier2: "East India Merchant Ships"
desc_NYDD_ENG_together_toward_victory_modifier2: "East India's wealth is truly endless."
NYDD_ENG_together_toward_victory_TRADE: "Monopolize the Channel"
NYDD_ENG_together_toward_victory_modifier3: "Monopolize the Channel"
desc_NYDD_ENG_together_toward_victory_modifier3: "No more Low Countries competing with us in this channel. How regrettable."
NYDD_ENG_together_toward_victory_modifier4: "Monopolize the Channel"
desc_NYDD_ENG_together_toward_victory_modifier4: "Through the shrewd calculations of the Medici masters, we have effectively increased the channel's profit points by §G24.7%§!.\n"
NYDD_ENG_together_toward_victory_modifier5: "Memories of the Commissioner District"
desc_NYDD_ENG_together_toward_victory_modifier5: "Days gone by…"
NYDD_ENG_together_toward_victory_tt_medici: "Modifier '§YMonopolize the Channel§!' additional effects:\nTrade Steering: §G+25.0%§!\nTrade Efficiency: §G+15.0%§!\n"
NYDD_ENG_salvation_modifier: "Only the Lord"
desc_NYDD_ENG_salvation_modifier: "You shall have no other gods before me."
NYDD_ENG_come_alive_modifier: "Rise from Ruin"
desc_NYDD_ENG_come_alive_modifier: "The old has passed, the new has come."
NYDD_ENG_come_alive_tt: "Modifier '§YJourney of Rebirth§!' is replaced with '§YSong of Britain§!', with additions:\nColonists: §G+1.00§!\nDevelopment Cost Modifier: §G-5.0%§!\n"
NYDD_ENG_come_alive_modifier2: "Song of Britain"
desc_NYDD_ENG_come_alive_modifier2: "Britain is born to rule the world."
NYDD_ENG_never_ending_tt: "Our motherland, full of hope and freedom. The future is surely bright."

DD_ENG_set_british_subject: "Establish Member State"
DD_ENG_set_british_subject_title: "Establish Member State"
DD_ENG_set_british_subject_desc: "We will spend §R50§!£dip£ to establish [From.GetName] as a British Union member state.\n"
DD_ENG_set_british_subject_tooltip: "[From.GetName] has proven their loyalty; it is time to let them join the British Union family.\n"
DD_ENG_set_british_subject_ttt: "Has available British Union member limit"

NYDD_ENG_prepare_fleet_title: "Prepare Invasion Fleet"
NYDD_ENG_prepare_fleet_desc: "If we want to invade France across the Channel, we must have a fleet capable of supporting an invasion force. Start building ships!"
NYDD_ENG_tear_for_tear_title: "Tear for Tear"
NYDD_ENG_tear_for_tear_desc: "The French once said it was the ocean that defeated them. Now, it is time to make them weep."
NYDD_ENG_normandy_title: "Norman Homeland"
NYDD_ENG_normandy_desc: "Familiar place, familiar people, just a different army, a different us."
NYDD_ENG_new_king_title: "Unexpected New King"
NYDD_ENG_new_king_desc: "The arrogant French have been defeated; we will become their new king, ruling their people."
NYDD_ENG_rule_south_title: "Command the North" # Royal Authority Commands the North
NYDD_ENG_rule_south_desc: "Northern France has lost order in the war; we must use our administrative power to help the locals rebuild order."
NYDD_ENG_end_of_france_title: "[NYDD_ENG_end_of_france_title]"
NYDD_ENG_end_of_france_desc: "[NYDD_ENG_end_of_france_desc]"
NYDD_ENG_end_of_france_title1: "Rebirth of the Fleur-de-Lis"
NYDD_ENG_end_of_france_title2: "Curtain Call of la Fleur-de-Lis" # Curtain Call of the Fleur-de-Lis
NYDD_ENG_end_of_france_desc1: "We too come from the ancient Angevin family, and naturally have the right to rule this ancient kingdom. Don't worry, everything will be as before."
NYDD_ENG_end_of_france_desc2: "It is over. The era belonging to France and the Angevin family is over. We now hold the key to the future."



NYDD_ENG_prepare_fleet_modifier: "Invasion Fleet"
desc_NYDD_ENG_prepare_fleet_modifier: "Frenchies, here we come!"
NYDD_ENG_tear_for_tear_modifier: "Blood for Blood"
desc_NYDD_ENG_tear_for_tear_modifier: "Is this the enemy's blood, or mine? I can no longer tell."
NYDD_ENG_tear_for_tear_modifier2: "Inherent"
desc_NYDD_ENG_tear_for_tear_modifier2: "Reclaim what is rightfully ours."
NYDD_ENG_tear_for_tear_tt: "While this modifier exists, occupying §Rhostile§! provinces in the §YFrench§! region grants their owner §R+0.5§! war exhaustion.\n"
NYDD_ENG_tear_for_tear_tt2: "While this modifier exists, occupying §Rhostile§! provinces in the §YFrench§! region grants us §G+500§!£icon_manpower£§g(Once per province)§!.\n"
NYDD_ENG_tear_for_tear_tt3: "In this war against §Y[183.Owner.GetName]§!, missions '§YUnexpected New King§!' and '§YNorman Homeland§!' will change §Yconditions§! and §Jrewards§!. §g(If we end any major war, this effect ends.)§!\n"
NYDD_ENG_normandy_modifier: "Welcoming the King's Army?"
desc_NYDD_ENG_normandy_modifier: "The locals seem quite indifferent, just like little Pa."
NYDD_ENG_normandy_modifier2: "Rule of Chaos"
desc_NYDD_ENG_normandy_modifier2: "We create chaos locally, keeping the French too busy."
NYDD_ENG_normandy_modifier3: "Normandy Governance"
desc_NYDD_ENG_normandy_modifier3: "We recently conquered these provinces; we must integrate them into our administrative system."
NYDD_ENG_normandy_modifier4: "Angevin Civil War"
desc_NYDD_ENG_normandy_modifier4: "This province is troubled by the civil war between two Angevin kings, wavering."
NYDD_ENG_normandy_tt: "@[eng_french_emeny_target.GetTag]§Y[eng_french_emeny_target.GetName]§! and its subjects' §Yfortress§! provinces gain: "
NYDD_ENG_new_king_tt2: "With our total victory in France, the war is over. Next, how shall we deal with the former king?\n"
NYDD_ENG_new_king_tt: "Provinces in the §YFrench§! region we control belonging to @[eng_french_emeny_target.GetTag]§Y[eng_french_emeny_target.GetName]§! and its subjects gain: "
NYDD_ENG_new_king_modifier: "French Integration in Progress"
desc_NYDD_ENG_new_king_modifier: "French people, when will you submit to us."
NYDD_ENG_new_king_modifier2: "French Integration Work"
desc_NYDD_ENG_new_king_modifier2: "Our newly conquered French regions need extensive administrative integration."
NYDD_ENG_new_king_tt3: "After §Y25§! years, we will gain: "
NYDD_ENG_new_king_modifier3: "French Administrative Integration"
desc_NYDD_ENG_new_king_modifier3: "This province is deeply integrated into our administrative system."
NYDD_ENG_new_king_modifier4: "Revenge Finally Taken"
desc_NYDD_ENG_new_king_modifier4: "Repay resentment with resentment; may hatred be dissolved."
NYDD_ENG_rule_south_tt: "When §Mdeveloping§! provinces in the §YFrench§! region, §G10.0%§! chance to gain extra development.\n"
NYDD_ENG_rule_south_tt2: "§Y10§! qualifying provinces under our rule §Yupgrade§! §YCourt§! buildings.\n"
NYDD_ENG_rule_south_ttyes: "£yes£If we completed the mission '§YUnimagined Alliance§!' via §Mdiplomacy§!, are allied with @BRI§Y[BRI.GetName]§! or are its overlord, or @BRI§Y[BRI.GetName]§! has fewer than §Y10§! provinces: "
NYDD_ENG_rule_south_ttno: "£no£If we completed the mission '§YUnimagined Alliance§!' via §Mdiplomacy§!, are allied with @BRI§Y[BRI.GetName]§! or are its overlord, or @BRI§Y[BRI.GetName]§! has fewer than §Y10§! provinces: "
NYDD_ENG_rule_south_modifier: "Great Development"
desc_NYDD_ENG_rule_south_modifier: "By concentrating resources on development, we will solidify royal authority."
NYDD_ENG_end_of_france_tt: "The story of France has come to an end; next is our path.\n"

NYDD_ENG_calai_title: "Continental Bridgehead"
NYDD_ENG_calai_desc: "Consolidating §Y[87.GetName]§! not only effectively supports our subsequent military operations there, but also gives our continental trade a transit station."
NYDD_ENG_rebel_subject_title: "[NYDD_ENG_rebel_subject_title]"
NYDD_ENG_rebel_subject_desc: "[NYDD_ENG_rebel_subject_desc]"
NYDD_ENG_rebel_subject_title1: "Tame the Appanages"
NYDD_ENG_rebel_subject_title2: "Instigate the Appanages"
NYDD_ENG_rebel_subject_desc1: "The appanages are still reveling in the joy of independence; we should strike while their foundations are unstable."
NYDD_ENG_rebel_subject_desc2: "The appanages of France are not all loyal to France. We need only promise some petty profits and empty checks, and they will happily defect to us."
NYDD_ENG_desevre_reward_title: "Due Reward"
NYDD_ENG_desevre_reward_desc: "After completing the war against France, it is time to reward the nobles of the French region according to merit. Those nobles who obeyed and helped us will receive rewards and promotions, while those who swore loyalty to the former king unto death will be exiled."
NYDD_ENG_divide_south_title: "[NYDD_ENG_divide_south_title]"
NYDD_ENG_divide_south_desc: "[NYDD_ENG_divide_south_desc]"
NYDD_ENG_divide_south_title1: "North and South Reunited"
NYDD_ENG_divide_south_title2: "North and South Divided" # North and South Divided Again
NYDD_ENG_divide_south_desc1: "The significance of southern France to us needs no elaboration. She not only symbolizes the trauma of imperial invasion, but is also an inalienable part of the Kingdom of France. We must assert our legitimate claim to this and drive imperial forces out of France."
NYDD_ENG_divide_south_desc2: "The threat of France to us needs no elaboration. To prevent possible future repeats, we must divide France into two kingdoms, preventing them from gathering strength against us."

NYDD_ENG_calai_modifier: "Calais Bridgehead"
desc_NYDD_ENG_calai_modifier: "Calais is our vital bridgehead on the continent; its defense must be strengthened."
NYDD_ENG_calai_modifier2: "Emergency Defense"
desc_NYDD_ENG_calai_modifier2: "A recent series of military activities has proven the necessity of strengthening Calais's defense."
NYDD_ENG_calai_modifier3: "Well Prepared"
desc_NYDD_ENG_calai_modifier3: "Thanks to our prior supply preparations, this province now has ample supply support."
NYDD_ENG_calai_tt: "When §Moccupying§! provinces in the §YPicardy§! or §YFlanders§! region, grant that province: "
NYDD_ENG_rebel_subject_ttt: "appanages have §G75§! opinion of §Y[Root.GetName]§!, or have improved at least §G50§! relations, or are being supported for independence by §Y[Root.GetName]§!"
NYDD_ENG_rebel_subject_tt: "After we declare war on @FRA§YFrance§!, appanages with liberty desire greater than §Y50.0%§! will become our §Yappanages§!.\n\nUnlocks diplomatic §YCovert Action§! '§YInstigate Appanages§!', can spend §Y20§! spy network to give an appanage §R+25.0%§! liberty desire.\n"
NYDD_ENG_rebel_subject_tt2: "All our subjects in the §YFrench§! region gain §G-25.0%§! liberty desire; if they are §Yvassals§!, they convert to §Yappanage§! subjects.\n\nWhen we have §Y2§! subjects in the §YFrench§! region, §Y[Root.GetNobleName]§! privilege '§YPowerful Duchy§!' will grant:\nDiplomatic Relations: §G+1.00§!\nDiplomatic Reputation: §G+1.00§!\n\nWhen we §Mdirectly own§! §Y40§! provinces in the §YFrench§! region, §Y[Root.GetNobleName]§! privilege '§YPowerful Duchy§!' will grant:\nNational Manpower Modifier: §G+10.0%§!\nLand Force Limit: §G+10.0%§!\n"
NYDD_ENG_rebel_subject_tt3: "§YAppanage Defection§! required liberty desire reduced to §Y33.0%§!.\nAppanages with liberty desire below §Y33.0%§! are prohibited from declaring war.\n"
NYDD_ENG_rebel_subject_tt4: "The above §Y[Root.GetNobleName]§! privilege '§YPowerful Duchy§!' additional bonus requirements are §Ghalved§!.\n"
NYDD_ENG_desevre_reward_tt: "All §YAppanage§! subjects convert to §YIncorporated Vassals§!.\n"
NYDD_ENG_desevre_reward_modifier: "Reining in Subjects"
desc_NYDD_ENG_desevre_reward_modifier: "Let them fear; only require them to pay tribute."
NYDD_ENG_desevre_reward_modifier2: "Social Skills"
desc_NYDD_ENG_desevre_reward_modifier2: "Compared to us Medici, you are still too green."

DD_ENG_spy_in_france:0 "Instigate Appanages"
DD_ENG_spy_in_france_title:0 "Instigate Appanages"
DD_ENG_spy_in_france_desc:0 "Shall we instigate §Y[From.GetName]§! to fight for their independence? Although we don't seem to gain anything from it, this will cost us §R20§! spy network in §Y[From.Overlord.GetName]§!.\n"
DD_ENG_spy_in_france_tooltip:0 "Some rumors, some covert support, and they will be thrilled.\n "
DD_ENG_spy_in_france_alert_tooltip:0 "Some rumors, some covert support, and they will be thrilled.\n "


DD_ENG_7a_tt: "§YThe Angevin family, though seemingly a bold choice, actually not only wins us the support of our French subjects, but also a claim to the throne of the Kingdom of France. This distant Angevin relative is a descendant of Henry of Valois, exiled by Richard II during the French civil war, known as Henry of Bolingbroke after fleeing to England.§!\n"
DD_ENG_7b_tt: "§MThe Knýtlinga, namely the founders of the former North Sea Empire, direct bloodline of Cnut the Great. After their defeat in the North Sea Empire succession, they settled in the Danelaw, now half English nobles. If a Cnutling is elected king, we gain the support of Danish descendants and a claim to the North Sea.§!\n"
DD_ENG_7c_tt: "§TWessex is the royal house of the old Kingdom of England, descendants of Alfred the Great, the first dynasty of the Kingdom of England. If the Wessex family is elected to the throne, we gain the most fervent support of the English people and unquestionable legitimacy.§!\n"
DD_ENG_7d_tt: "§JThe Medici family, um, we really don't know the reason for electing them king. Yes, although they are all-powerful, omnipotent, and rich enough to rival nations, as Kings of England…? Well, your will.§!\n"
DD_ENG_7e_tt: "§OHohenstaufen, an ancient and glorious family, masters of the Empire and the unshakable Iron Century. If a Hohenstaufen becomes king, then we will have vast claims to become rulers of Europa.§!\n"

DD_ENG_medici_path_due_to: "We chose the §Yde' Medici§! dynasty."
DD_ENG_it_will_union_yes: "§GThis will push the people of Britain toward unity.§!\n"
DD_ENG_it_will_union_no: "§OThis will push the people of Britain toward separation.§!\n"
DIPLO_OPPINION_LOI: "[From.GetName]'s opinion of [LOI.GetName]"