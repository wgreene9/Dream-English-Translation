l_english:

unite_english_culture_title: "@ENG Unite English Culture"
unite_english_culture_desc: "Following the Norman Conquest and Viking invasions, the people of England were deeply divided. Now, under our rule, they are finally united once more."
DD_YWK_nation_title: "@YWK Formalize the Danelaw"
DD_YWK_nation_desc: "Since the establishment of the Danelaw, the English have constantly caused trouble for us. Now this should all come to an end. With the last English rebellion crushed, it is time for us to move towards the future of the Danelaw."
DANEZLAND_NAME: "Daneland"
DANEZLAND_NAME_ADJ: "Danelandic"

DD_ENG_1_t: "Path to Atonement"
DD_ENG_1_d: "The wild storms are the wrath of God, and the long imprisonment is the penance of sinners. The French conquest shattered our illusion of prosperity, and the Norse invasions brought us a warning from the Lord. Terrible disasters could not break us; the people of England lay dormant in the ruins of our homeland, repenting for our past indulgence, waiting for the day to reclaim our freedom. Finally, a glimmer of hope has appeared on the long path of atonement. Amidst the chaos in France, we seized the opportunity for independence. After another French invasion ended in failure, we used the trade we seized from the Hanseatic League to build our proud navy, to prevent any future French invasions.\n\nMeanwhile, our nearby allies in the Low Countries continuously provided us with abundant resources and trade. The recent turmoil in the North Sea Empire is now widely known, and perhaps soon the situation in England will change dramatically. A monumental transformation awaits us. The hope of reclaiming our homeland no longer seems like a distant dream. Our secret aid has been swiftly sent to the Danelaw to support local resistance forces. If the winds of change blow, we hope they will prove useful. The sins of the past brought calamity, and years of patience have been spent plotting our restoration."
DD_ENG_1a: "Our journey of atonement is finally nearing its end."
DD_ENG_1a_tt: ""
DD_ENG_1a_modifier: "Five Provinces Militia Reform"
desc_DD_ENG_1a_modifier: "The Five Provinces Union once had only militia, but the former Lord Mayor of London resolved to order the establishment of a standing army, planned separately by each city. It is now nearing completion."

DD_ENG_2_t: "The Reunification of England"
DD_ENG_2_d: "'Through suffering, great achievements are made.'\n\nThe Norse invaders from the north swept across the British Isles like a massive tsunami, bringing countless disasters and chaos to the English. Meanwhile, the French from the south seized the lands of the former Kingdom of Wessex, leaving only a few cities in the east struggling to maintain their independence.\n\nBut no ocean is unconquerable, and no storm is insurmountable. Even the roughest seas will one day be conquered by fearless sailors. The dark clouds over Britain will eventually disperse, and the dawn of freedom will once again shine over the land of England. The collapse of the North Sea Empire has proven this; their centuries of sins will be washed away by the turbulent times. The French, too, face the glorious judgment of the Holy Roman Empire.\n\nThe millions of people in England have never succumbed to the 'poison' of time. Since the fall, countless visionaries have raised the banner of freedom. Now, we are finally reborn. From Northumbria to Wessex, the traces of the Norse and the French have vanished. We, the rightful rulers of the evergreen land of Britain, can once again proudly declare that England is united! Our centuries of resistance and ultimate victory serve as a warning to any who dare to covet England: 'You may conquer England, bind her, tear her apart, burn her to ashes, and scatter her remains into the sea…'"
DD_ENG_2a: "'…but she will be reborn, she will rise, and she will liberate all.'"

DD_ENG_3_t: "The End of the Danelaw"
DD_ENG_3_d: "'Trapped in time, trapped in ourselves.'\n\nWe were once the bravest Norse warriors, sons of Odin. We traveled far and wide to conquer the lands of England. For centuries, we fought against endless rebellions; we were the conquerors of this unruly land. Yet all of this came to an end with the silence of the North Sea Empire. In the fog of England's confusion, a lost generation in the Danelaw struggled to find a way forward.\n\n'End the hatred, stop the hostility!' some cried. Standing alone in a foreign land, we, like the homeless English, are part of the Danelaw. After radicals were purged, rebels crushed, and dissenters pacified, we declared equal status for the English. They could participate more broadly in public affairs without fear of Norse oversight or discrimination. Although some old Norse loyalists claimed we were betraying our ancestors, for the Danelaw, this was a necessary step.\n\nFrom now on, we are no longer mortal enemies, not enslaved, not oppressed…"
DD_ENG_3a: "…for we are one people of one nation, indivisible and inseparable."

DD_ENG_4_t: "The Rebirth of the Danelaw"
DD_ENG_4_d: "'Trapped in time, trapped in ourselves.'\n\nWe were once the bravest Norse warriors, sons of Odin. We traveled far and wide to conquer the lands of England. For centuries, we fought against endless rebellions; we were the conquerors of this unruly land. Yet all of this came to an end with the silence of the North Sea Empire. In the fog of England's confusion, a lost generation in the Danelaw struggled to find a way forward.\n\n'Refuse to yield, crush the traitors!' some cried. Standing alone in a foreign land, we are not like the homeless English; we are the rulers, the conquerors, and they are the ungrateful weaklings! To solidify our rule, we have tried compromise and reconciliation, but they have repeatedly shaken our foundations, opposed our rule, and crossed our boundaries. The past is gone. We will restore ancient punishments, recruit collaborators, and deter those who dare to raise the banner of rebellion. Although some may think this is too extreme, it is a necessary measure in these critical times."
DD_ENG_4a: "In these difficult times, we have only the Lord and ourselves to rely on."
DD_ENG_5_t: "Ebb Tide"
DD_ENG_5_d: "Williams climbed the tall lighthouse, awaiting nightfall on his shores. The golden-red dusk cast its glow upon the shimmering sea, spreading a crimson net across the waters that, with each pulsing tide, carried yesterday's coastline into the deep - toward the rose-tinted, unreachable other side of the ocean. One by one, the ropes binding the ships snapped, and the great vessels were pushed afar by Britain's waves.\n\nThey were Viking ships - Williams recognized their banners. Their massive white sails swelled taut with the evening winds, following the blood-red sea road left by the dying sun as they sailed toward the horizon. The rose-hued clouds gradually deepened to indigo under the moon's touch, until a crystalline white moon emerged from the misty veils. Williams lit the lighthouse beacon, its brilliant flames bidding farewell to the Viking fleet until they dissolved into the seam where sky met sea. Yesterday their rule had seemed eternal; today it was as if they had never come."
DD_ENG_5a: "The waves crashed, slowly eroding what was once thought to be an unchanging coast."
DD_ENG_5a_tt: "§YBritain§! region provinces belonging to the §YNorse§! culture group will revert to their original culture.\n"

DD_ENG_6_t: "Debate on the Form of State"
DD_ENG_6_d: "Under God's witness, we have finally won the victory that belongs to the fallen. The French and the Norse have finally been driven out of lands that were not theirs, and England has finally awakened from slavery and death. We have successfully unified the lands of the former England, yet the loose city-league governing structure of the Five Provinces Union is clearly unsuitable for administering the whole of England.\n\nThe cities of England organized their respective city councils and established the Great Parliament of England representing the entire nation, with representatives sent from each province to discuss and decide whether England's future should be to invite a king with a legitimate claim to the throne, or to establish a standardized republican system as the cornerstone of our nation. Ultimately, the Great Parliament decided…"
DD_ENG_6a: "England must have a legitimate king!"
DD_ENG_6b: "England will be reunited through a federal republic!"
DD_ENG_6c: "England will follow the faith through a monastic theocracy!"
DD_ENG_7_t: "Our King"
DD_ENG_7_d: "Ultimately, the Great Parliament of England passed the monarchy with a narrow margin, deciding to invite a king back to rule England, of course with the assistance of Parliament. Accordingly, a series of names of throne claimants were presented to Parliament as candidates. Parliament was asked to consider the legitimacy of their claims to the English throne based on politics, history, bloodline, and a series of complex factors, and to select from among them an English king approved by Parliament. In the end, Parliament decided to choose…"
DD_ENG_7a: "An ignored distant Angevin relative."
DD_ENG_7b: "A battle-tested descendant of Cnut."
DD_ENG_7c: "A Wessex descendant far from home."
DD_ENG_7d: "A Medici scion just passing by."
DD_ENG_7e: "An ambitious Hohenstaufen prince."
DD_ENG_8_t: "The Plantagenet Dynasty"
DD_ENG_8_d: "Unexpectedly, the new English Parliament ultimately chose their old monarchal family, an Angevin stranded in England, as king. He is the grandson of Henry of Valois, whose grandfather was the cousin of Richard II and grandson of Edward III. After being stripped of his title during the civil war, Henry fled to Lincolnshire in England, and after acquiring Bolingbroke Castle was renamed Henry of Bolingbroke.\n\nConsidering the complex historical relationship between Anjou, France, and England in the past, this may be a very bold choice. But regardless, a king from France not only possesses unquestionable legitimacy, but also represents our strong claim to the throne across the Channel.\n\nThe new king grew up in the Anglia region from a young age, received an English-style education and culture, and is very close to his people and kingdom. To minimize the resentment of the English people, the king has decided to change his family name from Anjou to Plantagenet—named after the broom flower the king often wears in his hat. Despite changing the family name, this does not mean we are abandoning our claim to Angevin territory. On the contrary, the new king will work hand in hand with Parliament to seek justice for the French invasion."
DD_ENG_8a: "Invaders, we have returned."
DD_ENG_8a_tt: "We will raise a new §YThree Lions Banner§! to represent our claim!\n"
DD_ENG_8a_tt2: "£icon_ideas£The §Y7th§! national idea is replaced with '§YThe Plantagenets Return§!', with effects:\nArmy Morale: §G+10.0%§!\n"
DD_ENG_8a_modifier: "Resentment"
desc_DD_ENG_8a_modifier: "The people of England still don't quite like a king who was once their enemy."

DD_ENG_9_t: "Helmsman of the Republic"
DD_ENG_9_d4: "With the establishment and stabilization of England, the provisional government has completed its mission, and it is time to elect a formal government belonging to England. The Grand President has ordered the dissolution of the government and the election of a new federal government and President of England. Now, we have many candidates—the dutiful incumbent Provisional President Humphrey, Duke of Buckingham, descendants of provincial dignitaries, and the northern war hero General Lucas Villiers.\n\nThe Duke of Buckingham is the father of our federation; he once served as Consul of London and led us toward revival. Sir Humphrey's great-grandfather was Edward III, King of the Angevin Dynasty, but he is a proud Englishman who helped our devastated nation weather the storm hand in hand, and was granted the title Duke of Buckingham by Parliament. General Villiers was born in Leicester, and in his early years traveled to Greece with other adventurers from the Danelaw, serving in the renowned Varangian Royal Guard. After retiring and returning to England, Villiers was disappointed by the Viking government's rule and devoted himself to our cause. Of course, other noble factions should not be underestimated; they have all served dutifully in the former English government for many years.\n\nNow, republican England is looking forward to a new helmsman to lead us forward. Shall we continue Sir Humphrey's term and fulfill his grand promises? Or choose our war hero, General Villiers? Of course, other nobles are also raring to go. Ultimately, the Great Parliament decided to choose…"
DD_ENG_9_d3: "With the establishment and stabilization of England, the provisional government has completed its mission, and it is time to elect a formal government belonging to England. The Grand President has ordered the dissolution of the government and the election of a new federal government and President of England. Now, we have many candidates—the dutiful incumbent Provisional President Humphrey, Duke of Buckingham, descendants of provincial dignitaries.\n\nThe Duke of Buckingham is the father of our federation; he once served as Consul of London and led us toward revival. Sir Humphrey's great-grandfather was Edward III, King of the Angevin Dynasty, but he is a proud Englishman who helped our devastated nation weather the storm hand in hand, and was granted the title Duke of Buckingham by Parliament. Of course, other noble factions should not be underestimated; they have all served dutifully in the former English government for many years.\n\nNow, republican England is looking forward to a new helmsman to lead us forward. Shall we continue Sir Humphrey's term and fulfill his grand promises? Of course, other nobles are also raring to go. Ultimately, the Great Parliament decided to choose…"
DD_ENG_9_d2: "With the establishment and stabilization of England, the provisional government has completed its mission, and it is time to elect a formal government belonging to England. The Grand President has ordered the dissolution of the government and the election of a new federal government and President of England. Now, we have many candidates—the dutiful incumbent Provisional President, the brilliant new Duke of Buckingham, descendants of provincial dignitaries, and the northern war hero General Lucas Villiers.\n\nThe Duke of Buckingham is the father of our federation—the descendant of the former Consul of London, Earl Humphrey Stafford. Sir Humphrey's great-grandfather was Edward III, King of the Angevin Dynasty, but he is a proud Englishman who helped our devastated nation weather the storm hand in hand, and was granted the title Duke of Buckingham by Parliament. General Villiers was born in Leicester, and in his early years traveled to Greece with other adventurers from the Danelaw, serving in the renowned Varangian Royal Guard. After retiring and returning to England, Villiers was disappointed by the Viking government's rule and devoted himself to our cause. Of course, other noble factions should not be underestimated; they have all served dutifully in the former English government for many years.\n\nNow, republican England is looking forward to a new helmsman to lead us forward. Shall we continue the Provisional President's term and fulfill his grand promises? Or trust the descendant of Sir Humphrey, the noble and excellent Duke of Buckingham? Or our war hero, General Villiers? Of course, other nobles are also raring to go. Ultimately, the Great Parliament decided to choose…"
DD_ENG_9_d: "With the establishment and stabilization of England, the provisional government has completed its mission, and it is time to elect a formal government belonging to England. The Grand President has ordered the dissolution of the government and the election of a new federal government and President of England. Now, we have many candidates—the dutiful incumbent Provisional President, the brilliant new Duke of Buckingham, descendants of provincial dignitaries.\n\nThe Duke of Buckingham is the father of our federation—the descendant of the former Consul of London, Earl Humphrey Stafford. Sir Humphrey's great-grandfather was Edward III, King of the Angevin Dynasty, but he is a proud Englishman who helped our devastated nation weather the storm hand in hand, and was granted the title Duke of Buckingham by Parliament. Other noble factions should not be underestimated; they have all served dutifully in the former English government for many years.\n\nNow, republican England is looking forward to a new helmsman to lead us forward. Shall we continue the Provisional President's term and fulfill his grand promises? Or trust the descendant of Sir Humphrey, the noble and excellent Duke of Buckingham? Of course, other nobles are also raring to go. Ultimately, the Great Parliament decided to choose…"
DD_ENG_9a: "[Root.Monarch.GetName] returns once more!"
DD_ENG_9b: "The Duke of Buckingham takes the lead."
DD_ENG_9c: "The Earl of Glamorgan comes from behind."
DD_ENG_9d: "The Earl of Hastings is beaming with joy."
DD_ENG_9e: "Little John inherits his father's legacy."
DD_ENG_9f: "The Duke of Stirling leverages his connections."
DD_ENG_9g: "General Lucas is the people's choice."
DD_ENG_10_t: "The Future of the Five Provinces Union"
DD_ENG_10_d: "Thanks to the Magna Carta signed years ago, we survived the French tide as the last five cities of England. Although nominally the English cities remain loyal subjects of the French king, due to the century of chaos, Paris has all but lost the reins around our necks. The tide of destruction has receded, and the English have regained their footing.\n\nInitially, the Five Provinces Union was merely a defensive alliance, but over time, London, with its superior geographical position, quickly became the leader of this alliance and developed this autonomous city league into a loose English collective—now, we are the last Englishmen. Across the Channel, the demons of Paris are once again mired in the quagmire, unable to attend to themselves, while another fragmented nation is awakening from its grave. Representatives of the five cities have gathered in London, hoping that [Root.Monarch.GetName] can chart a plan for the future."
DD_ENG_10a: "Begin attempting to integrate the five provinces."
DD_ENG_10b: "Maintaining the status quo is sufficient."
DD_ENG_10a_tt: "These §Yintegrated subjects§! will not occupy diplomatic relations, and annexation cost is §G-25.0%§!, but each costs us §R-25§! governing capacity.\n"
DD_ENG_10b_modifier: "Maintain Status Quo"
desc_DD_ENG_10b_modifier: "Out of prudence, the Five Provinces Union will maintain the status quo."
DD_ENG_11_t: "The English Send Weapons"
DD_ENG_11_d: "The English heard that we are also oppressed by the Norse, and decided to secretly aid us with a batch of weapons."
DD_ENG_11a: "Quietly accept the weapons and don't make a sound."
DD_ENG_12_t: "Anglo-Welsh Friendship"
DD_ENG_12_d: "Having previously sent us weapons, the English are pushing their luck, suggesting we cleverly become their subject to avoid invasion."
DD_ENG_12a: "What more is there to say? I will swear allegiance to you!"
DD_ENG_12b: "You London beggars, come to Wales to beg!"
DD_ENG_13_t: "The Fate of the Anglois Region"
DD_ENG_13_d: "The Anglois region, known in Britain as the land of Wessex, is a deformed cultural region originating from French invasion. It was born from England's defeat in the Norman Conquest. After falling under the rule of English governors from France and the Angevin family, the English of Wessex were forced or willingly assimilated into a new cultural collective—Anglois.\n\nA century later, the Anglois people have become an internationalized group using Parisian French. The French across the Channel are culturally very close to the Anglois people, but politically quite different—for instance, they do not trust or owe loyalty to Angevin rule. Under the long French rule, some Anglois people use French as their first language, and their customs and accents are now quite different from ours.\n\nNow, although we have reclaimed this lost land, we cannot force the Anglois people to accept English rule in a short time. They prefer to see themselves as an autonomous people, and are indifferent to our claim of returning to England in terms of group identity. In some areas, these locals even openly oppose and are hostile to English policies. How should we deal with them?"
DD_ENG_13a: "Wallowed in depravity, traitors!"
DD_ENG_13b: "They are merely another flock of lost sheep."
DD_ENG_13a_modifier: "Setting Things Right"
desc_DD_ENG_13a_modifier: "It is time to purge the evil French culture from our English soil. Understandably, the locals accustomed to French will not be too happy.\n\n§YThis modifier will be removed when the province culture changes.§!\n"
DD_ENG_13a_tt: "§YThis modifier will be removed when the province culture changes.§!\n"
DD_ENG_13b_modifier: "Tolerating the French Region"
desc_DD_ENG_13b_modifier: "As long as we remain tolerant, these Anglois people seem harmless enough."
DD_ENG_14_t: "Cornish Uprising"
DD_ENG_14_d: "Cornwall, or the French-ruled Anglois region, has been the granary of Anjou since the Angevin family served as governors of England, suffering layer upon layer of exploitation by French nobles. Local mines are completely controlled by the French, yet taxes have never decreased, and resistance in Cornwall has never ceased.\n\nNow, several Cornish nobles have secretly approached us, hoping we can support our compatriots' righteous cause against France. Some say such resistance is merely a moth to a flame, but perhaps as long as they can attract the French's attention, it is enough for us."
DD_ENG_14a: "A moth to a flame still has value."
DD_ENG_14a_tt: "After some time, the §YCornish§! will launch an uprising.\n\nIf §Y[233.GetName]§! and §Y[4373.GetName]§! are successfully occupied by rebels, then @CRN§Y[CRN.GetName]§! will launch a §MWar of Independence§! and request an alliance with us.\n"
DD_ENG_14b: "They can be more useful elsewhere."
DD_ENG_15_t: "The Cornish Alliance"
DD_ENG_15_d: "Unexpectedly, the Cornish uprising we previously supported actually ignited a spark under French rule. Now, all of Cornwall has risen in revolt, risking everything to push the French into the sea. Now, Cornwall has written to us for aid, demanding we fulfill our promise and join the war against France per the secret alliance obligations previously signed."
DD_ENG_15a: "We go without hesitation!"
DD_ENG_15b: "Let them fend for themselves."
DD_ENG_15b_modifier: "Betraying an Alliance"
desc_DD_ENG_15b_modifier: "We broke our former promise."
DD_ENG_16_t: "Lucas Villiers"
DD_ENG_16_d: "As the fifth son of the old Viscount Villiers, Lucas Villiers, born in Leicester, was destined for a childhood without luxury, not to mention that the Villiers family was a fallen English noble family living under Danelaw rule. Lucas was unruly from a young age, passionate about horseback riding, jousting, and adventure. Although he received no specialized military education, he trained year-round with the family's English knights, and at fifteen met a Varangian Guard officer who had come to Britain to recruit soldiers, and immediately went to Greece to join the Guard.\n\nThroughout his youth, military life was almost everything to Villiers. Through extraordinary valor and talent, he rose from soldier to Guard commander. But Lucas and his English compatriots had had enough of a wandering life, and they eventually left the Guard and returned to Britain. Viking rule stirred these Englishmen's national sentiment, ultimately leading them to decide to join the southern unification cause. Lucas formed a northern English guerrilla force in Leicester, raiding and destroying small Danelaw armies and military installations, eventually leading his troops south to join the Five Provinces Union."
DD_ENG_16a: "A legend of the North."
DD_ENG_17_t: "A Necessary Evil"
DD_ENG_17_d: "Lucas had dreamed countless times of retaking York, but never imagined that in reality it would be so utterly different. Streets hung with Viking war banners, taverns selling honey wine from the distant north, and even the workshops at the docks held serpent-headed ships about to launch. York's streets were filled with the sea breeze of invaders, polluted by a strange accent mixing Norse and English into something savage and desolate. This was no longer the Yorkshire he knew.\n\nLucas angrily cut down the flagpole, tearing the Viking war banner to shreds. People screamed in terror, scattering and fleeing, watching him with fear. Familiar words mixed with the damp sea breeze seeped into Lucas's ears—'madman,' 'invader,' 'foreigner.' Lucas looked around at this unfamiliar city and its inhabitants, feeling lost and helpless. He was not a compatriot, warrior, liberator, not a hero surrounded by flowers and cheers—he was their enemy, an Englishman."
DD_ENG_17a: "…This is a necessary trial on the journey of rebirth."
DD_ENG_17a_modifier: "Ending Viking Rule"
desc_DD_ENG_17a_modifier: "Viking rule is over."
DD_ENG_17a_modifier2: "Cutting Off the Serpent's Head"
desc_DD_ENG_17a_modifier2: "Farewell, Viking longships."
DD_ENG_18_t: "Journey of Rebirth"
DD_ENG_18_d: "Even the longest rain sees sunlight tomorrow. The shadows over Britain have departed. Since the Norse invasion that destroyed Britain, we, the English, have finally seen the dawn. Enslaved, abandoned, divided, like duckweed in the rain, the English were forced to abandon their nation, enduring in forgetting, regret, and humiliation until this long-dead nation rose again from its burial ground.\n\nThe path of atonement has reached its end, but the journey of rebirth has only just begun. Those who covet England have never disappeared; they scheme, they lurk, waiting for the next opportunity—but we will no longer be slaughtered at will. The journey of rebirth is a trial and a test; we will break through all obstacles and reach the New Jerusalem. The reborn England will build a beautiful homeland belonging to the English, an unyielding nation. Warn the people—the past is no more!"
DD_ENG_18a: "We turned back from sin, freed ourselves, not to escape the world, but to find our former selves." # We turned back from sin, freed ourselves from chains, not to escape the difficult world, but to find our former selves.
DD_ENG_18a_tt: "§MOur deeds made us who we are, and shaped our path.§!\n"
DD_ENG_18a_modifier: "Path of Rebirth"
desc_DD_ENG_18a_modifier: "May you find your path."
NYDD_ENG_hre_empoper_tt: "Modifier '§YJourney of Rebirth§!' is replaced with '§YSong of the Germans§!', with additions:\nImperial Authority Modifier: §G+0.1§!\nRoman Catholic Princes Imperial Reform Support: §G+25.0§!\n"
DD_ENG_19_t: "The Medici of England"
DD_ENG_19_d: "Tosca adjusted his collar one last time, gazing at himself in the mirror. The smooth surface reflected an impeccable young man, an elegant Italian noble, a typical Renaissance-era monarch. He smiled, and the king in the mirror smiled; he was serious, and the king in the mirror was serious. Lorenzo faced this mirror, alone preparing everything a King of England needed.\n\nHe didn't know what was wrong with the absurd English Parliament, nor what whimsical ideas had filled these Englishmen's heads, that they would elect a Medici from faraway Tuscany as the new King of England. But he didn't care. He didn't care what the scheming English thought, didn't care how the ill-intentioned Parliament would obstruct him, didn't care what the nobles with hidden malice planned—since he had been summoned to England, he would become their king as he wished."
DD_ENG_19a: "'Make haste slowly, take by craft.'"
DD_ENG_19a_tt: "£icon_ideas£The §Y7th§! national idea is replaced with '§YIn the Name of the Medici§!', with effects:\nInflation Reduction: §G-0.25§!\nCannot Reduce Inflation\n"
DD_ENG_19a_modifier: "Bizarre and Hilarious"
desc_DD_ENG_19a_modifier: "People are talking, unclear why Parliament chose a Medici scion as king—did they receive 500,000 ducats from the Italians?"
DD_ENG_20_t: "The Next Cnutling"
DD_ENG_20_d: "Cnut sat in the magnificent carriage, slowly approaching the coronation church amid a solemn yet joyful festive atmosphere. The young king curiously observed everything before him—stern guards, the vast crowds of English, the magnificent church, and the ministers and parliamentarians on either side who showed no favor. This ancient nation was welcoming an ancient foreign king, once again placing a descendant of Cnut the Great on the English throne.\n\nSince losing the struggle for the North Sea Empire's throne, who knows how many centuries have passed. In this long time, this branch of Cnut the Great's line had drifted far from their original homeland culture during their flight to England. The Cnutling family had assimilated into the nation that had bowed to them four hundred years ago, but never imagined that one day they would return to the stage as Kings of England—the last Cnutling to be king was the sickly Harthacnut. The bewildered Cnut, like a true Englishman, curiously surveyed his kingdom, ready to lead an ambitious England."
DD_ENG_20a: "England welcomes the next Cnutling."
DD_ENG_20a_tt: "£icon_ideas£The §Y7th§! national idea is replaced with '§YThe Next Cnutling§!', with effects:\nShip Durability: §G+10.0%§!\n"

DD_ENG_21_t: "God Save the King"
DD_ENG_21_d: "Edward, wearing the Crown of St. Edward, gazed toward the edge of the coronation hall. The assembled ministers in ceremonial dress bowed to England's new king, paying homage to a Wessex who had retaken the English throne. This crown of England's last saint, the last legitimate English king, witnessed the history of this kingdom and nation, witnessed an exile and tragedy. A century later, on English soil there is no French usurper, no Norse invader—only Wessex endures.\n\nNow, the sacred bloodline of Alfred the Great has finally become the ruler of this land once more. Edward looked down at the mediocre ministers below the throne, ambition burning in his heart. This kingdom belonging to the Wessex family, this land belonging to the Wessex family, now attends his accession and rule, and he stands here like the great Alfred the Great, as a restorer of the nation. The proud monarch raised his scepter high, that shining gem glittering—he heard his master of ceremonies leading the ministers in shouting: "
DD_ENG_21a: "'God Save the King!'"
DD_ENG_21a_tt: "£icon_ideas£The §Y7th§! national idea is replaced with '§YRestorer of Wessex§!', with effects:\nCore Creation Cost: §G-10.0%§!\n"
DD_ENG_22_t: "Potato Tycoon"
DD_ENG_22_d: "Our navigators brought back some strange things from the New World, a mysterious tuber product introduced from the New World. But because of its ugly appearance, deep eyes, suspected toxicity, and being viewed by the Church as a 'heretical crop,' no one dared to eat it, let alone plant it. In the spirit of dedication to science, we still introduced some potatoes—of course, experimenting in Ireland, initially grown as a medicinal plant. If all goes well, perhaps it can be promoted nationwide as a true food crop."
DD_ENG_22a: "I need to set up potato farms in Ireland."
DD_ENG_22a_tt: "§YIrish§! provinces under our rule gain: "
DD_ENG_22a_modifier: "Potato Tycoon"
desc_DD_ENG_22a_modifier: "This province has well-functioning potato farms, producing large quantities of edible potatoes."
DD_ENG_23_t: "Potato Spread"
DD_ENG_23_d: "Initially, potatoes were only trial-planted on a few farms in Ireland, but Ireland's climate is ideal for potato growth, and farmers were stunned by its incredible yield, so it quickly spread across the island. After witnessing the high yields of potatoes in Ireland, many in other parts of Britain looked on with envy and demanded to switch to potatoes as well. And Irish farmers were required to eat only the potatoes they grew, not other crops."
DD_ENG_23a: "Plant, plant it everywhere."
DD_ENG_23b: "This sort of thing is fine in small doses."
DD_ENG_24_t: "Collaboration from Within"
DD_ENG_24_d: "News of our military buildup to march north and expel the Vikings reached Scotland, and a local organization resisting Viking rule immediately contacted us. They hinted that if we launched an attack, they could collaborate from within to help destroy Viking defenses, even find a small path to let us into the city. But obviously nothing is without cost—they actually demanded the establishment of an independent Scottish state after the war, rather than becoming part of our sphere."
DD_ENG_24a1: "How much can you pay?"
DD_ENG_24a: "One more friend, one more strength."
DD_ENG_24b: "With or without them, England is destined to rule Britain."
DD_ENG_24c: "Pretend to agree to their request, then refuse their independence afterward."
DD_ENG_24a1_tt: "§YThis is not about nations, but a business. As long as the price is right, we are at your service anytime.§!\n"
DD_ENG_24a_tt3: "§YBritain belongs to all its citizens on the island (except the Vikings). We should unite all possible forces to forge a united kingdom.§!\n"
DD_ENG_24b_tt: "§MThis is our English manifest destiny, with no connection to the Scots. They too should be ruled by us!§!\n"
DD_ENG_24c_tt: "§OThis concerns affairs of state; it is understandable. People will understand us.§!\n"
DD_ENG_24a_tt: "When we declare war on @LOI§Y[LOI.GetName]§!, a random non-capital province will immediately be §Moccupied§! by us.§g(Triggers only once)§!\n"
DD_ENG_24a_tt2: "If possible, when war score against @LOI§Y[LOI.GetName]§! reaches §G+50.0%§!, §Y[SCO.GetName]§! will launch an uprising and §Mally§! with us.\n"
DD_ENG_24c_tt2: "If possible, when war score against @LOI§Y[LOI.GetName]§! reaches §G+50.0%§!, §Y[SCO.GetName]§! will launch an uprising and become our §Rdisloyal§! §Ysubject§!.\n"
DD_ENG_24b_modifier: "Valiant and Fearless"
desc_DD_ENG_24b_modifier: "Cut through the sky!"
DD_ENG_24d: "No rush, we'll discuss it later."
DD_ENG_24d_tt: "After completing the mission '§YBraveheart§!', we can still decide §YScotland's fate§!. However, by then the §Msituation§! §Tmay§! be §Odifferent§!.\n"

DD_ENG_25_t: "Scottish Uprising"
DD_ENG_25_d: "The Scottish wilds were never silent. Growling beasts, cynical troublemakers, the savage and unruly Scots never learned what it means to know their place. But now, this savage highland is eerily silent, as if a demon lurks in this chilling stillness.\n\n…Indeed. Just this morning, blazing wildfires rose in Scotland, followed by the same horn calls as Wallace's uprising a century ago. They came out from the wilds, from the fields, from the workshops and cities, taking up arms against us. The treacherous Scots have defected to England and are openly opposing our rule!"
DD_ENG_25a: "Crush them!"
DD_ENG_liberate_us_op: "Liberate Us"
DD_ENG_26_t: "Elegy of Ireland"
DD_ENG_26_d: "Although the Irish nominally acknowledge the Vikings as their 'High King,' many still grumble and resent it, preferring the High King to be an Irishman. Thus some Irish nobles have extended olive branches to us, hinting that if we provide protection and promise not to interfere with their privileges in Ireland, they can acknowledge our suzerainty and liberate them from Viking tyranny."
DD_ENG_26a: "This is a good opportunity to replace the Vikings and control Ireland."
DD_ENG_26b: "I do not accept the submission of turncoats."
DD_ENG_26a_tt: "§TSince expelling the Vikings is our common goal, there is no reason not to cooperate.§!\n"
DD_ENG_26b_tt: "§RThey betrayed the previous High King today; they will betray us tomorrow.§!\n"
DD_ENG_26a_tt2: "Unlocks diplomatic §YSpy Action§! '§YSecret Correspondence§!', allowing us to spend §R10§! spy network to contest @LOI§Y[LOI.GetName]§!'s §Ytributaries§! in §YIreland§!.\n"
DD_ENG_26a_op: "Secret Correspondence"
DD_ENG_26a1: "How much do they want? I'll buy it."
DD_ENG_26a1_tt1: "§YMoney, money, money, it's all business. As long as we pay a higher price, these profit-seeking Irish will happily turn to us. No need for intrigue.§!\n"
DD_ENG_26a1_tt2: "Each known §YIrish§! nation will cost us §R50§!£icon_gold£ to become our §Ytributary§!.\n"
DD_ENG_26a_tt3: "The mission '§YKing of the Hills§!' can be completed by §Ytributaries§!.\n"
DD_ENG_26b_modifier: "Maverick"
desc_DD_ENG_26b_modifier: "We English are strong; we don't need others' help."
DD_ENG_26c: "No rush, we'll discuss it later."
DD_ENG_26c_tt: "After completing the mission '§YKing of the Hills§!', we can still decide §YIreland's fate§!. However, by then the §Msituation§! §Tmay§! be §Odifferent§!.\n"

DD_ENG_spy_in_ireland:0 "Secret Correspondence"
DD_ENG_spy_in_ireland_title:0 "Secret Correspondence"
DD_ENG_spy_in_ireland_desc:0 "Do you wish to encourage §Y[From.GetName]§! to become your §Ytributary§!? This will cost us §R25§!£dip£ and all spy network in §Y[From.GetName]§!, and their overlord will be very displeased.\n"
DD_ENG_spy_in_ireland_tooltip:0 "Suggest they betray the Vikings and pledge loyalty to us."
DD_ENG_spy_in_ireland_alert_tooltip:0 "Suggest they betray the Vikings and pledge loyalty to us."

DD_ENG_27_t: "[From.GetName] Defects to the English"
DD_ENG_27_d: "[From.GetName] betrayed us and defected to the English."
DD_ENG_27a: "How uncouth."    
DD_ENG_28_t: "Reconstruction of the Wessex French Region"
DD_ENG_28_d: "Although our king is a descendant of the Angevin family, this does not mean he will completely side with the French. In fact, with the assistance of the English Parliament and his cabinet, although His Majesty still retains a sympathetic attitude toward the Anglois and the French, in actual political governance he does not place excessive emphasis on them. Many Anglois descendants born in England proper worry about being marginalized, and thus jointly petitioned His Majesty to grant—establishing special autonomous regions in Anglois population centers, granting them limited self-governing rights, dividing the country into an English region and a Wessex French region, applying different legal codes and governance. Obviously, the English will not be pleased."
DD_ENG_28a: "Reconstruct the Wessex French Region."
DD_ENG_28b: "This is England, not you Frenchmen's territory anymore."
DD_ENG_28a_modifier: "Wessex French Region"
desc_DD_ENG_28a_modifier: "This province is home to a large number of French-speaking English."
DD_ENG_28a_modifier2: "Wessex French Region"
desc_DD_ENG_28a_modifier2: "This province is home to a large number of French-speaking English."
DD_ENG_28a_tt2: "§YDue to our previous tolerance, the locals are willing to fight for us.§!\n"
DD_ENG_29_t: "The Irish Potato Famine"
DD_ENG_29_d: "'What do you think of the Irish?'\n'What is an Irishman?'\n\nIn [GetYear], an unprecedented potato blight struck all of Ireland, leaving the Emerald Isle barren. Although not restricted to growing only potatoes, the Irish had to export other crops, so the locals could only eat potatoes.\n\nThe Ottoman Sultan, upon hearing of the famine's horrors, planned to donate ten thousand pounds, but the British Crown donated only two thousand, and British authorities suggested the Sultan donate only one thousand. Later, the Sultan's secretly dispatched transport ships were also intercepted by the Royal Navy.\n\nThe deaths caused by the Irish Potato Famine are difficult to count, and the local population fled abroad at an extremely high rate, most fleeing to the Americas, because the Royal Navy blockaded Ireland's sea routes to Europe, firing on immigrant ships on sight. Nevertheless, many still crossed the ocean in wooden tubs."
DD_ENG_29a: "Oh."
DD_ENG_29a_tt: "§RRemoves§! the modifier '§YPotato Tycoon§!' from all provinces under our rule, and they gain: "
DD_ENG_29a_tt2: "§RSince we promoted potatoes throughout Britain, this famine in the Irish region has now swept the entire nation.§!\n"
DD_ENG_29a_modifier: "Famine Spreads"
desc_DD_ENG_29a_modifier: "A mysterious disease has struck the potatoes, greatly reducing their yield, causing severe famine in this province.\n"
DD_ENG_30_t: "Revenge for 1066"
DD_ENG_30_d: "Two blood-soaked swords are stuck in England's corpse—one called Viking, the other belongs to France. The Norse are merely greedy vultures circling the wreckage of our great nation, but the French are the cruel and despicable executioners. With a shameful and laughable absurd claim, they pushed England into the flames, into eternal damnation. They trampled our throne, they divided our land, they enslaved our people—they deceived, robbed, killed, they stopped at nothing.\n\nBut they never imagined that the kingdom France despicably betrayed, the nation they dismembered and divided, would one day reunite from the ruins and cross the Channel to stand before them. The English, clutching past wounds, hand in hand, vow to avenge the ruined kingdom of 1066. This nation, once seen by France as a meal to be carved up at will, now stands before France with sharpened swords. We will make them understand—we will return, we will always return."
DD_ENG_30a: "What is gained by injustice will be lost by injustice."
DD_ENG_30a_modifiier: "March on Paris"
desc_DD_ENG_30a_modifiier: "Invaders, we have returned!"
DD_ENG_31_t: "Righteous March"
DD_ENG_31_d: "In 1066, the first English governor, William the Conqueror, landed in Cornwall with a claim to the Kingdom of England; now, the Plantagenet king has also set foot on the shores of Normandy with the same claim. Our incompetent and pitiful cousins are neither able nor willing to rule France. Rather than sit idly by as our ancestors' homeland decays, it is better that we revive the name of France.\n\nAlso descended from the ancient Angevin family, our king certainly possesses the sacred right to inherit the Kingdom of France, and is more qualified than the king and rulers in Paris to decide the future of this kingdom. The foolish Richard II once unjustly confiscated our titles and lands; now, we will return to France to correct this mistake and personally take it all back."
DD_ENG_31a: "A drama of war is about to begin; two Kings of France once again take the stage."
DD_ENG_32_t: "France Reunited"
DD_ENG_32_d: "Our homeland is finally united once more under a powerful king—a legitimate king from across the Channel. God's gift, the fleur-de-lis symbolizing light and freedom, is once again bestowed upon this king worthy of inheriting Charlemagne's name and his immortal legacy, [Root.Monarch.GetName].\n\nThe usurper pretender has been driven out, the rebellious regions have been pacified, the shameful scum of the Hohenstaufen family have all been expelled, and the southern puppet states they propped up have been absorbed by us, once again becoming part of the glorious Kingdom of France.\n\nLooking across the river of history, since the distant Frankish era, we have been renowned worldwide as the undisputed leader of all Europe. After the empire split, the great work left by Charlemagne vanished like those great empires that came before, turning to dust in history. Yet God has given us the power to change destiny; we will not submit to the fate of decline. We are destined to reign over Europa, to heal the wounds of suffering caused by past chaotic times, to bring freedom and hope to this land.\n\nFrom the beautiful and bustling banks of the Thames to the harmonious and tranquil Loire Valley, the glory of this united kingdom shines equally upon every proud and self-confident citizen. The kingly nation that once ruled Europe has returned once more, ready to embark once again on the path to past glory. Whether the vast lands beyond the Alps and east of the Rhine, or the nations that have quarreled for a century beyond the Pyrenees, all will become the targets of our revival. A new legend has begun, and it will never end."
DD_ENG_32a: "France, I have returned."
DD_ENG_32a_modifier: "King of France"
desc_DD_ENG_32a_modifier: "France, I have finally returned."
DD_ENG_33_t: "French Fashion"
DD_ENG_33_d: "Through our efforts, England has finally, after countless hardships, defeated France and planted its flag in Paris. As we claimed, our king is the uncle of Richard II, a descendant of John of Valois, second son of Edward III. People are curious whether the Plantagenet dynasty, a family whose blood comes from France, will choose to follow in their ancestors' footsteps and return to the embrace of French culture. Indeed, French fashion is among the finest in Europe. But we have come this far thanks to the help of the English, and we must not forget our roots or lose their support."
DD_ENG_33a: "French culture is superior."
DD_ENG_33b: "We will embrace French culture, but will not shake our roots."
DD_ENG_33c: "The French are nothing worth mentioning."
DD_ENG_33c_modifier: "Contempt for France"
desc_DD_ENG_33c_modifier: "No doubt, English is the world's finest culture."
DD_ENG_33c_tt: "If when accepting culture, we have already accepted any culture of the §YFrench§! culture group, we will lose §R-1§! stability!\n"
DD_ENG_33c_tt2: "§RThe French will be very displeased about this.§!\n"
DD_ENG_33b_tt: "§YNorman§!, §YPicard§! and §YChampenois§! culture in our provinces convert to §YFrench§! culture.\n"
DD_ENG_33b_modifier: "Love"
desc_DD_ENG_33b_modifier: "We can take the dregs of France and discard the essence."
DD_ENG_33a_tt: "§YBritish§! culture group provinces under our rule will convert to §YAnglois§! culture.\n"
DD_ENG_33a_modifier: "Gallicization"
desc_DD_ENG_33a_modifier: "What I love is my life."
 
DD_ENG_34_t: "The Fate of France"
DD_ENG_34_d: "After we returned to France, as time passed, the French gradually began to accept our king's rule, and slowly accept the blending of English people and English culture with France. The people of the continent are accepting the fact that they now share a country and a sky with the English, and truly acknowledging the legitimacy of our royal family.\n\nNow, thanks to the kingdom's emphasis on and nurturing policies toward the continent, resistance activities throughout France are decreasing, and it is truly and slowly integrating into our nation. The English and French are no longer irreconcilable, mortal enemies. Although there are still social barriers, ethnic relations are easing and blending, and France will truly become part of us."
DD_ENG_34a: "Let us move forward hand in hand."
DD_ENG_34a_tt: "§YFrench§! core provinces under our rule gain: "
DD_ENG_34a_modifier4: "French Crown Land"
desc_DD_ENG_34a_modifier4: "France is an inseparable part of us."
DD_ENG_34a_modifier2: "French Integration Work"
desc_DD_ENG_34a_modifier2: "The local French probably quite welcome our integration."
DD_ENG_34a_modifier3: "French Integration Setback"
desc_DD_ENG_34a_modifier3: "The local French are somewhat unhappy with our integration."
DD_ENG_34a_modifier1: "French Integration Resistance"
desc_DD_ENG_34a_modifier1: "The local French cannot be said to be cooperative, one could say they are opposed."
DD_ENG_35_t: "The Plantagenet Century"
DD_ENG_35_d: "The Plantagenet dynasty rules this era. Its power spans the Channel, its territory extends deep into the continent. Our flag flies over French soil, and the blood of the fleur-de-lis sits on the English throne. East India merchant ships sail to the defined horizons, knights gallop across endless plains. Treaties are engraved with names, castle stone walls hang with the Lord's name. This dynasty is eager to conquer everything, leaving its order and mark wherever it goes. No matter how times change, the Plantagenets remain constant, like a silent giant overlooking its world in its palm.\n\n[Root.GetName]'s influence extends beyond battlefields and courts. Farmers in villages know whose tax collector to pay grain to, merchants in towns know whose ports to ship goods to. Church bells ring for the glorious monarch, post horses on roads run for edicts from the court. Law seeps into the crevices of daily life, its language mixed into accents everywhere. It does not need to brandish swords at all times, because it has long infused every drop of its blood into this land.\n\nOne generation ages, another is born, and the shadow of the Plantagenets always shrouds their lives, ruling as their eternal monarch. It is like a great river, flowing unhurriedly through centuries, the lands on both banks fertile because of it, and also heavy because of it. No one can ignore its existence, just as no one can deny its endurance. This is the Plantagenet Century—not just a magnificent legend, it is an era, an epic, a performance that never draws its curtain."
DD_ENG_35a: "The world belongs to the Plantagenets!"
DD_ENG_35a_modifier: "The Plantagenet Century"
desc_DD_ENG_35a_modifier: "The world belongs to the Plantagenets!"
DD_ENG_36_t: "Progress of the French Language"
DD_ENG_36_d: "The French language continues to advance in this era. It is written by more people, heard by more people, and used on more occasions. Its vocabulary is richer, its syntax more stable, its expression clearer. It retains the foundations of the past while embracing the novelty of the present. It is not merely a tool for daily conversation, but a language capable of carrying law, literature, thought, and diplomacy.\n\nNow, this beautiful language is not only our nation's official and common language, but is also eagerly studied and used by European nations. At socialite banquets, people use French as a symbol of elegance and nobility to display their distinction; in diplomatic settings, French is used as the language all diplomats can understand and the preferred first language for documents. The French of our era is better than that of the previous era, and will open the next era."
DD_ENG_36a: "Times flow, but French does not change."
DD_ENG_37_t: "Danish Descendant"
DD_ENG_37_d: "Unlike most warlike and martial Danes, the refined and courteous Sven Godwinson is a mathematician and inventor of Danish immigrant descent. As one of the most important scholars in the Danelaw, Sven is almost the leading figure in the natural sciences in Britain. But unfortunately, Sven's identity as a Danish descendant caused him to be marginalized after England's restoration, and his papers and research repeatedly hit walls.\n\nUpon hearing that a descendant of Cnut had been elected King of England, Sven and his brother—Professor Æthelstan Godwinson, a jurist at Oxford University—hurried to London, hoping to gain royal patronage and funding to restart their research. These two brilliant scholars will not only become pillars of our scientific innovation work, but will also become a weather vane for social reconciliation."
DD_ENG_37a: "What rare talents."
DD_ENG_38_t: "Reforming the New Varangians"
DD_ENG_38_d: "As the Greek state's rule falters, more and more Varangian Guard members are returning home from Greece, becoming a powerful asset to our army. These veterans are experienced and valiant; letting them be buried among ordinary soldiers would be an enormous loss. Now, most Varangian veterans who have returned home serve as trainers and instructors in the army.\n\nThe Varangian mercenary guard format is outdated; only undying oaths and unshakable loyalty can withstand the test. Let us use these excellent veterans as the core, select and train our strongest and bravest warriors, and have these mighty warriors serve their own nation, reforming a heavy guard belonging to us—the New Varangian Guard."
DD_ENG_38a: "They will serve me!"
DD_ENG_39_t: "Viking Spirit"
DD_ENG_39_d: "As we return to our royal family's North Sea homeland, the Viking blood of the Cnut family constantly calls to us. More and more people are advocating a return to the ancient Norse national traditions, to reclaim the brave and fearless Viking spirit, and a king from the Cnut family undoubtedly greatly encourages them. But regardless, it was the English who helped us reach this point, and we who have lived in Britain for centuries can hardly deny that we are now Britons—therefore, we must make our choice carefully."
DD_ENG_39a: "We will reclaim the traditions of Cnut the Great."
DD_ENG_39b: "We are already indistinguishable, as one."
DD_ENG_39c: "No, the Britons are our mainstay."
DD_ENG_39c_tt: "§YBritish§! region provinces of the §YScandinavian§! culture group will convert to §YNordic§! culture of the §YBritish§! culture group.\n\n§MPerhaps in the future we can also let the Nordic people enjoy a British greeting.§!\n"
DD_ENG_39b_modifier: "Norse Blending"
desc_DD_ENG_39b_modifier: "Britons are Norse, and Norse are Britons."
DD_ENG_39a_tt: "Each province in the §YBritish§! region additionally grants:\nRecruitable Varangian Guard: §G+0.25§!\n"
DD_ENG_39a_modifier: "Orthodox Guard"
desc_DD_ENG_39a_modifier: "Only these Nordic people are skilled at being Varangian Guards."
DD_ENG_39a_modifier2: "British Varangian Guard"
desc_DD_ENG_39a_modifier2: "The king wants you."
DD_ENG_39c_modifier: "Mainstay"
desc_DD_ENG_39c_modifier: "Without the Britons, what would we eat."
DD_ENG_40_t: "Reunited as One"
DD_ENG_40_d: "Oh, God, the English actually say they want to unite in rule over us, what to do."
DD_ENG_40a: "Let us return to the embrace of the Cnut descendants."
DD_ENG_40b: "The English are nothing but char siu waiting for us to conquer."
DD_ENG_40a_tt: "@JUT§YJutland§!'s §YGriffin§! Duke decides to §Rbreak free§!!\n"
DD_ENG_40a_tt2: "@HOS§YSchleswig§!'s §YGriffin§! Duke decides to §Rbreak free§!!\n"
DD_ENG_41_t: "Fate Was Never Fair"
DD_ENG_41_d: "On the matter of conquerors and conquered, fate seems to have played a crude joke. If, decades ago, Vikings spoke of that great adventure, that great conquest, there would only be praise and longing. After all, England was just a meal to be carved up for the North Sea—and now, for the Vikings, only pitiful death remains. No one could have imagined, not even the English themselves, that the Britain they once disdained, under the leadership of a Cnut prince stranded abroad, would actually return to Scandinavia.\n\nNow, the descendant of Cnut has led his new empire, once again wearing the crown of Britain like his ancestor, uniting the peoples of Britain and Scandinavia. It is foreseeable that the terror of the North Sea has returned, but this time not in the name of the Vikings, but in the name of Britain. Those who once saw Britain as meat on the chopping block, who expelled the Cnutlings, will once again remember the prestige and rule of Cnut the Great."
DD_ENG_41a: "The North Sea will tremble again!"
DD_ENG_41a_modifier: "New North Sea Empire"
desc_DD_ENG_41a_modifier: "On that day, people once again recalled the terror of Viking domination."
DD_ENG_41a_tt: "Provinces of the §YScandinavian§! culture group owned by us or our subjects will convert to §YNordic§! or §YNorseland§! culture of the §YBritish§! culture group.\n"
DD_ENG_41a_tt2: "Provinces of §YIrish§!, §YHighland Scottish§!, §YScottish§! or §YAlban§! culture owned by us or our subjects will convert to §YIrish§! or §YScottish§! culture of the §YScandinavian§! culture group.\n"
DD_ENG_42_t: "A Different Path"
DD_ENG_42_d: "The Viceroy of the Netherlands stood on the manor balcony, overlooking his country bathed in dusk. Viceroy, viceroy. What an irritating, what a covetous title. Who could be content forever seated to the Emperor's right? He was clearly a hundred times better than those mediocre fools—why should he bow to those dandies unworthy of sharing his surname? No, he should have more, he deserved more.\n\nAcross the distant Channel, the newly restored Kingdom of England had secretly sent him letters, inviting him to become King of England. Perhaps this would be the starting point of his kingly path, the prologue to an imperial epic—rather than rotting forever in the Emperor's backyard. Like an emperor, he once again cast his gaze upon this land sinking into twilight, toward this scene burning like crimson evening clouds, ambition burning in his heart."
DD_ENG_42a: "I will surely become king."
DD_ENG_42a_tt: "£icon_ideas£The §Y7th§! national idea is replaced with '§YThe Hohenstaufen Ambition§!', with effects:\nAdministrative Efficiency: §G+2.5%§!\n"
DD_ENG_43_t: "A Fatal Choice"
DD_ENG_43_d: "The Netherlands' mess is clearly beyond salvaging, even we on the other side of the Channel can see it. This morning, the Low Countries' ambassador and envoy in London took turns visiting the Consul, representing the two now mutually opposed governments of the Low Countries. The envoys and their military attachés all hope the Five Provinces will support them in the coming disaster, against the other government.\n\nWe must choose carefully; this will almost certainly determine our diplomatic relations with the Empire and that new Low Countries government after this chaos. If our bet wins overwhelmingly, then the Five Provinces will gain a close ally to help us revive England; but if the side we support fails, the Five Provinces will have to face the wrath of the new Low Countries government—and perhaps the Empire's wrath as well."
DD_ENG_43a: "Support Holland."
DD_ENG_43b: "Support Brabant."
DD_ENG_43c: "Best to help neither."
DD_ENG_43a_tt: "If we choose to support @HOL§YHolland§!, we will §Mhelp§! them in the §ODutch Revolt§!.\n\nIf @HOL§YHolland§! §Gwins§! the §ODutch Revolt§!, the mission '§YHand in Hand§!' can be completed via §Mdiplomacy§!.\n"
DD_ENG_43b_tt: "If we choose to support @BRB§YBrabant§!, we will §Mhelp§! them in the §ODutch Revolt§!.\n\nIf @BRB§YBrabant§! §Gwins§! the §ODutch Revolt§!, the mission '§YHand in Hand§!' can be completed via §Mdiplomacy§!.\n"
