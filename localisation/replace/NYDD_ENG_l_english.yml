DD_ENG_45_t: "Of One Heart and Mind"
DD_ENG_45_d: "In the distant Balearic Islands, there remains a branch of the old Kingdom of England in exile. They are one of the many overseas refugees from the great invasion, led by a cadet branch of the Wessex family, though that line has long since faded. Now, we have finally reestablished contact with our compatriots; they have established a new republican government in Iberia, named New England.\n\nThese children of England have never forgotten their homeland, but the never-halting passage of time and the complex mixed ethnic population have made them no longer a purely English nation. Today's New England is a diverse nation blending Iberian local peoples and cultures; although culturally more localized, they remain loyal to the motherland. Now, we have the opportunity to decide the fate of this nation of one heart with England—to reintegrate them, or to rule Iberia as our free state?"
DD_ENG_45a: "They should return to the motherland."
DD_ENG_45a_tt: "§Y[EN9.GetName]§! core provinces under our rule gain: "
DD_ENG_45a_modifier2: "New England Territory"
desc_DD_ENG_45a_modifier2: "We have to send people to faraway New England to govern the unruly locals."
DD_ENG_45a_modifier: "Territorial Autonomy"
desc_DD_ENG_45a_modifier: "Although the people of the New England region consider themselves of the same roots as us, the long separation has ultimately created a rift. Therefore, we grant the New England region autonomy, hoping to minimize their discontent as much as possible."
DD_ENG_45b: "New England, free and glorious."
DD_ENG_45b_modifier: "New England Autonomy"
desc_DD_ENG_45b_modifier: "Our beloved suzerain has granted us dominion status."
DD_ENG_45b_modifier2: "Well-Meaning Aid"
desc_DD_ENG_45b_modifier2: "The kind English have sent us their best administrative bureaucrats."
DD_ENG_46_t: "British Rule"
DD_ENG_46_d: "Few nations in the world operate a system as excellent and efficient as ours, let alone spread it to our other allies in the world. Now, we can proudly declare to our people and to the world that we have extended our excellent system and rule to every corner of the British Union nations, to every citizen. The British Union does not rule through oppression, violence, or intimidation, but through mutual assistance, loyalty to Britannia, and the precious friendship between nations.\n\nLike missionaries spreading the gospel, we also constantly spread British culture, politics, and influence to the world like spreading the love of God. The British Union is precisely such a great supranational union, uniting nations of different ethnicities, cultures, and regions under one belief, under the great culture and rule of Great Britain. If an English traveler circles the world, he will be surprised to find that the whole world is home."
DD_ENG_46a: "The world enjoys British rule."
DD_ENG_47_t: "Rule, Britannia"
DD_ENG_47_d: "Since the Roman Empire, the British Isles have seen one people after another—Romans, Celts, Anglo-Saxons, Vikings, or French. This great island is no longer merely a simple place name or symbol; she is the homeland of all peoples living here—our motherland, Britannia.\n\nDifferent ethnic cultures blend in Britannia; to govern this land, we need a stronger and more powerful rule. A unitary government will be established, a centralized British state will rule the entire archipelago, unifying all British people and territories under one political entity. We have had enough of division, conflict, violence, and intrigue; from now on, all peoples will find unity under the British central government.\n\nUnder God's grace, the newborn Britannia is rising from the blue ocean, to pursue her manifest destiny—Britannia shall never be enslaved, Britannia rules the waves, Britannia is supreme."
DD_ENG_47a: "Rule, Britannia!"
DD_ENG_47a_modifier: "British Rule"
desc_DD_ENG_47a_modifier: "They obey, we rule!"
DD_ENG_47a_modifier2: "Great British Hegemony"
desc_DD_ENG_47a_modifier2: "Becoming part of Great Britain is your best choice."
DD_ENG_47a_tt1: "£yes£§OOur lands cannot tolerate the Irish running wild.§!\n"
DD_ENG_47a_tt2: "£yes£§OSubmission finally shattered the brave.§!\n"
DD_ENG_48_t: "Out of Many, One"
DD_ENG_48_d: "Since Ivar's invasion of Britain, the administrative divisions throughout Britannia have been fragmented and chaotic. Even during the brief unification of the Danelaw and the North Sea Empire, Britain was full of various lords and lacked unified, clear administration. Due to the divided rule of various parties over Britain, the entire archipelago was divided into Irish-ruled, French-ruled, Norse-ruled, and English-ruled zones, with various laws, divisions, currencies, and more all the more complex and chaotic beneath.\n\nNow, we have successfully unified Britannia; it is time to end the chaos here. Through the 'Irish Throne Act,' a newly established Kingdom of Ireland will replace the various Irish lordships of the Viking era; the 'Scotland-Isles Act' abolishes the Viking Danelaw and Kingdom of the Isles, incorporating them into a reconstructed Kingdom of Scotland; the 'Wales Act' declares that a unified Wales will become an autonomous principality under the Kingdom of England, while other French and Viking territories will be incorporated into the Kingdom of England.\n\nFinally, the 'Act of Union' declares that the King of England, our monarch, shall become King of Scotland and Ireland, Lord of Wales, and King of the United Kingdom of Great Britain formed by the four nations. The parliaments of England, Scotland, Ireland, and Wales will be merged into the new Great British Parliament, and their churches, laws, currencies, and various standards will be unified."
DD_ENG_48a: "Great Britain, out of many, one."
DD_ENG_48a_modifier: "British Union"
desc_DD_ENG_48a_modifier: "They agree, we unite!"
DD_ENG_48a_modifier2: "Act of Union"
desc_DD_ENG_48a_modifier2: "With our excellent experience in British union, we can extend it to other lands we rule."
DD_ENG_48a_tt1: "£yes£§JThe Irish beg us to rule!§!"
DD_ENG_48a_tt2: "£yes£§JThe Scots are willing!§!"
DD_ENG_49_t: "The Fleur-de-Lis Throne"
DD_ENG_49_d: "Once again, we have set foot on French soil. Centuries ago, the foolish Richard II drove us from our homeland; today, we lead a great army back to the shores of France—in the name of the King of Britain. Everything we lost in the past—wealth, land, honor—will return to us, to the rightful masters of France.\n\nThe old Kingdom of France has been declared dissolved, the pretender driven from his throne. Now, we have finally achieved what Henry of Valois could not—ascending the fleur-de-lis throne of France. A new, true Kingdom of France is being rebuilt, a true legitimate king has returned to his loyal Paris. Let us once again take up the crown of France, and crown ourselves with our own victory and rule."
DD_ENG_49a: "France, your king has returned!"
DD_ENG_49a_tt: "Provinces in the §YNormandy§!, §YPicardy§!, §YLoire Valley§! and §YBrittany§! regions under @FRA§YFrance§! will be §Jceded§! to us.\n"
DD_ENG_49a_tt2: "Will begin to consider whether to pledge loyalty to us or become independent.\n"
DD_ENG_49b: "France should remain intact."
DD_ENG_49c: "Let us meet at the negotiating table."
DD_ENG_49c_modifier: "Return to France"
desc_DD_ENG_49c_modifier: "After a century of wandering, the Plantagenet king has finally returned to his ancestors' land. Though this time, as a conqueror."
DD_ENG_50_t: "The Fate of the Netherlands"
DD_ENG_50_d: "Years ago, we set out from the Low Countries and set foot on British soil. For our family's great ideal, we abandoned the Empire, abandoned the Low Countries, abandoned all ties with the main branch. Now, we have once again returned to the Low Countries, as King of Britain. This time, we are not only monarch of England, but will once again become master of the Netherlands.\n\nThe lands of the Low Countries are now once again under our control; we decide the fate of this kingdom that once belonged to us. The rich Low Countries remain to this day an important region providing tax revenue and production, enough to deserve the title of tax pillar. If we can have an administrative apparatus loyal to us govern the Low Countries, it will benefit us greatly."
DD_ENG_50a: "The sunken kingdom has long crumbled; only we look back in the air."
DD_ENG_50b: "The Netherlands' economy is truly booming."
DD_ENG_50b_tt: "Provinces in the §YLow Countries§! region under our rule gain: "
DD_ENG_50a_modifier: "Integrating Low Countries Merchants"
desc_DD_ENG_50a_modifier: "Low Countries merchants voluntarily transfer wealth to us."
DD_ENG_50b_modifier2: "Low Countries Wealth"
desc_DD_ENG_50b_modifier2: "We pool the Low Countries' resources to share with the English."
DD_ENG_50b_modifier3: "Low Countries Prosperity"
desc_DD_ENG_50b_modifier3: "The prosperity of the Low Countries is truly delightful."
DD_ENG_51_t: "Smooth Sailing"
DD_ENG_51_d: "Through our wise governance, France has basically accepted our rule, and the government is sailing smoothly. The integration work of the entire Kingdom of France is basically complete, and soon the people on the continent will thoroughly join our ranks, heading toward a great future together."
DD_ENG_51a: "We are of one heart."
DD_ENG_52_t: "The Time Has Come"
DD_ENG_52_d: "France has fallen like yesterday's flowers at the hands of the former loser. It is time for us to choose our future—to pledge loyalty to this new conqueror, or to seek our own path?"
DD_ENG_52a: "Life will find a way."
DD_ENG_52b: "The mandate of heaven has changed, the sacred vessel has changed hands, and it returns to the virtuous…"
DD_ENG_53_t: "Taming the Southern Dukes"
DD_ENG_53_d: "Southern France has always been an unruly land, dominated politically by three southern dukes. When the south had not yet left the kingdom, they were obsessed with political intrigue, constantly obstructing Paris, and ultimately turned wholly toward the Empire after the Albigensian War. In fact, they did not care whether they pledged loyalty to the French king or the Emperor; in the hearts of the southern dukes, only their power and glory were worth preserving.\n\nNow, we have finally conquered the duchies of the southern dukes, spreading our authority across every inch of Aquitaine. Since the south has been detached from Paris's rule for centuries, why not reunify them into a new nation? By elevating and expanding the lands of the Duke of Aquitaine into a kingdom, we will gain an entire loyal south of Britain. Aquitaine will become the symbol of southern independence, rather than a French vassal."
DD_ENG_53_d2: "Southern France has always been an unruly land, dominated politically by three southern dukes. When the south had not yet left the kingdom, they were obsessed with political intrigue, constantly obstructing Paris, and ultimately turned wholly toward the Empire after the Albigensian War. In fact, they did not care whether they pledged loyalty to the French king or the Emperor; in the hearts of the southern dukes, only their power and glory were worth preserving.\n\nNow, we have finally conquered these southern dukes. It is time to thoroughly break their backs and unify the land of France. The new France will completely abolish the rule and titles of the southern dukes, bringing southern France under the direct rule of Paris. We will no longer allow southern ambitious men to split the kingdom and interfere with Paris. This time, we will unify this kingdom, divided for a century, once and for all; we will truly unite France."
DD_ENG_53a: "Never again divided."
DD_ENG_53a_modifier: "Triumphant Return from the South"
desc_DD_ENG_53a_modifier: "The land of southern France, back in my hands!"
DD_ENG_53b: "Aquitaine must separate from France!"
DD_ENG_53c: "These provinces are better managed by us directly!"
DD_ENG_53c_modifier: "Direct Management"
desc_DD_ENG_53c_modifier: "France must be prevented from rising again."
DD_ENG_54_t: "The Kingdom's Curtain Falls"
DD_ENG_54_d: "After we thoroughly conquered all French lands, this ancient kingdom, continuing from the Frankish era to today, finally drew the curtain on her history. The rule of the Capetians and Angevins will become a page of past history like the Merovingians and Carolingians—their story is over. The drama written by the French and performed by the French has ended; the future belongs to us.\n\nNow, the future and fate of this kingdom are in our hands. We stand before the gate of France's future, ready to take the first step of a new era. The Kingdom of France already belongs to history, and the future belongs only to us, to Britain. No need to indulge in recollections of the old era, for a brand-new, hope-filled future is about to knock on France's door!"
DD_ENG_54_d2: "After we thoroughly conquered all French lands, this ancient kingdom, continuing from the Frankish era to today, finally drew the curtain on her old history. The rule of the Capetians and Angevins will become a page of past history like the Merovingians and Carolingians—their story is over; the future belongs to us.\n\nNow, the future and fate of this kingdom are in our hands. We stand before the gate of France's future, ready to take the first step of a new era. The Kingdom of France already belongs to history, and the future belongs only to us, to a brand-new Britain, to the great union of these two lands. No need to indulge in recollections of the old era, for a brand-new, hope-filled future is about to knock on France's door!"
DD_ENG_54a: "We are the future!"
DD_ENG_54a_modifier: "The Curtain Falls"
desc_DD_ENG_54a_modifier: "Your era is over."
DD_ENG_54a_modifier2: "Destruction and Rebirth"
desc_DD_ENG_54a_modifier2: "My era has begun."
DD_ENG_54a_modifier3: "Southern Garrison"
desc_DD_ENG_54a_modifier3: "We will loyally guard the south of France."
DD_ENG_54a_tt: "Modifier '§YJourney of Rebirth§!' is replaced with '§YThe Plantagenet Return§!', with additions:\nCavalry Fire: §G+0.5§!\nCavalry Shock: §G+0.5§!\n"
DD_ENG_55_t: "Same Bed, Different Dreams"
DD_ENG_55_d: "Although our king is a descendant of Cnut the Great, this does not mean he will completely side with the Vikings. In fact, with the assistance of the English Parliament and his cabinet, His Majesty's attitude toward the Vikings can even be described as indifferent. Many Danish descendants born in England proper worry about being marginalized, and thus jointly petition as before—establishing special Danelaw regions in Viking population centers, implementing Danish law, granting them limited self-governing rights, dividing the country into an Anglo-law region and a Danelaw region, applying different legal codes and governance. Obviously, the English will not be pleased."
DD_ENG_55a: "Reconstruct the Danelaw."
DD_ENG_55b: "This is England now, not you Vikings' territory anymore."
DD_ENG_55a_modifier: "New Danelaw"
desc_DD_ENG_55a_modifier: "Perhaps more appropriately called a Danish autonomous region now."
DD_ENG_55a_tt: "If we are no longer of the §YBritish§! culture group in the future, this modifier will be removed.\n"
DD_ENG_56_t: "The North Wind Howls"
DD_ENG_56_d: "The north wind howls, bringing news from afar. The last Viking nation has declared submission to [Root.GetName]'s rule; our centuries-long wish has finally come true. Scandinavia, this land familiar yet strange, carries our dreams and wishes. This feeling of revenge achieved now seems so bewildering. We have not yet thought about how to govern this land that was never ours. Some shout for eye for an eye, establishing an Anglo-law region in distant lands too, delivering judgment upon them. Some are noncommittal, but believe only our direct rule can permanently end the threat. Others wish to show benevolence—the Vikings are merely sheep that went astray."
DD_ENG_56a: "An eye for an eye, establish an Anglo-law region."
DD_ENG_56b: "End the threat forever, educate them culturally."
DD_ENG_56c: "Benevolence first, grant them autonomy."
DD_ENG_56b_modifier: "Anglo Education"
desc_DD_ENG_56b_modifier: "Come, repeat after me. A-B-C-D-E-F-G."
DD_ENG_56c_modifier: "Nordic Autonomy"
desc_DD_ENG_56c_modifier: "As long as they don't hinder us."
DD_ENG_56_d2: "[Root.Monarch.GetName] silently raised a puzzle piece and slowly placed it on the map. Then, a colossal entity leaped from the map. [Root.Monarch.GetName] nodded with satisfaction, clapped, smiled, and sighed silently, as if admiring a work of art. Rapid footsteps came from outside the door; the howling north wind burst in with the newcomer, and the empire on paper collapsed in the cold wind. The panting messenger scratched his head awkwardly, and before [Root.Monarch.GetName] could fly into a rage, he hurriedly handed over the battle report and fled. [Root.Monarch.GetName] tossed the letter aside, silent, and silently picked up the puzzle, trying to piece it together again."
DD_ENG_56d: "After all that, I still have to do it myself."
DD_ENG_56d_tt2: "Modifier '§YJourney of Rebirth§!' is replaced with '§YSong of the North Sea§!', with added effects:\nAdministrative Efficiency: §G+5.0%§!\n"
DD_ENG_56d_modifier: "Song of the North Sea"
desc_DD_ENG_56d_modifier: "I come from the sea, to the land I go."
DD_ENG_56d_tt: "Unlocks diplomatic-influence action, allowing us to convert §YBritish Union member§! subjects into §YNorth Sea Union member§! subjects.\n\n§YNorth Sea Union member§! subjects additionally grant us:\nRecruitable Varangian Guard: §G+5.0%§!\nInfantry Combat Ability: §G+5.0%§!\nWhen development reaches §Y200§!, effects §Gdouble§!.\n"
DD_ENG_56d_modifier3: "Song of the North Sea"
DD_ENG_56d_modifier2: "Song of the North Sea"
desc_DD_ENG_56d_modifier3: "Gobble gobble"
desc_DD_ENG_56d_modifier2: "Gobble gobble"
DD_ENG_57_t: "The Wind Shifts"
DD_ENG_57_d: "Never has any Englishman dared to hope that one day we could reach the Scandinavian homeland. The Vikings who once invaded England must now finally pay for their crimes, letting their land taste the pain of invasion. Viking culture and land will be reshaped, tamed, and fused by us, ultimately becoming part of our great British culture—just as the Vikings once wanted to do to us. When they committed atrocities against us, did they ever imagine that one day the meat on the chopping block, the lamb to the slaughter, would turn the tables? Yet this is but a small part of our journey of rebirth. The tide will not gently go into that good night; she will also take much away."
DD_ENG_57a: "I will remember you, Viking."
DD_ENG_57a_modifier: "The Storm Subsides"
desc_DD_ENG_57a_modifier: "I opened the door, but there was no rain outside. It was, in my heart."
DD_ENG_57_d2: "Never has any Viking had such a fanciful idea, that one day a descendant of Cnut could, with English help, fight back to the homeland. The Vikings who once invaded England now have their coastlines filled with foreign ships; stepping onto the land are not Viking warriors, but foreigners they once ruled. Viking culture and land will be reshaped, tamed, and fused by us, ultimately becoming part of our great British culture—just as Cnut the Great once wanted to fuse the two nations. Yet this is not only our journey of rebirth, but theirs too. The tide will not gently go into that good night; she will also sweep up those along the way, rushing together toward the rolling sea."
DD_ENG_57b: "Children, I have returned."
DD_ENG_57a_modifier2: "New Storm"
desc_DD_ENG_57a_modifier2: "I am the storm that is approaching."
DD_ENG_58_t: "Granting Power to the People"
DD_ENG_58_d: "Although our Parliament is an institution representing the people's rights, many believe that current parliamentary representatives are mostly from the nobility and big merchants, and the poor's lack of representation means their interests are not fully realized. Therefore, they demand that we expand the proportion of parliamentary representatives, relax the conditions for representatives, and open voting rights to commoners.\n\nThe Commoners' House is composed of elected representatives; the two houses together form our Parliament, to reflect the interests of all. Regarding voting rights, any adult male who meets a certain property threshold and can be proven to be a citizen of the nation is eligible to vote or be elected as a representative of the Commoners' House. But some also believe that most of Britain's populace is ignorant and letting them participate in politics will only backfire."
DD_ENG_58a: "Allow commoners into Parliament."
DD_ENG_58b: "Commoners may not enter Parliament."
DD_ENG_58c: "Establish a Commoners' House."
DD_ENG_58b_modifier: "Maintain Status Quo"
desc_DD_ENG_58b_modifier: "Someone will be happy."
DD_ENG_58c_modifier: "Bicameral System"
desc_DD_ENG_58c_modifier: "Can always make everyone unhappy."
DD_ENG_59_t: "Beyond the Republic"
DD_ENG_59_d: "The republican system originated from the city-state republics of ancient Greece, which mostly only allowed adult male citizens of the city to have citizenship, and commercial republics like Venice even excluded other commercial city-states, treating other nations or even other city-states of the same nation as enemies. People cannot help but see the republic as a narrow, exclusive political system.\n\nBut we are different; we have transcended the shackles of the republic. Whether English, Scottish, Irish, or Welsh, or descendants of Vikings and French, all under Britannia's wing are our compatriots. All who live in Britannia are Britons. We treat all Britons equally, without discrimination; we will be united as one, we will be of one heart and mind!"
DD_ENG_59a: "Britannia is indestructible!"

DD_ENG_60_t: "The High Wall"
DD_ENG_60_d: "That high wall approaches. Spreading across our land are these never-healing wounds, these fears that make one fall, confusing right and wrong, marginalizing reality and illusion. Has the day of judgment come? I can no longer tell. The union we forged is now about to fall apart with the tide. The goodness we believed in has become the sins of the past. The wounds we carved did not harm others, but made us who we are. Whenever I close my eyes, I see only an unmanned carriage driving into the vortex of confusion, with thousands of troops following behind her.\n\nI am not here to plead. I come to repent, to fill the numb truth, to shatter countless lies, to wash hands covered in wounds, to find our original selves. Although I know all this is futile, I only wish for one thing…"
DD_ENG_60a: "…to forgive myself for what I have done."

DD_ENG_civil_war: "The Grand Remonstrance"
DD_ENG_61_t: "The Grand Remonstrance"
DD_ENG_61_d: "The tyrannical and cold king [Root.Monarch.GetName] has decided to rid himself of Parliament, rule the country alone, establish a new absolute monarchy, and has therefore dissolved Parliament. Not only that, to support his ongoing wars and arbitrary rule, the king also unilaterally enacted several new tax laws, and with the support of the Church, expanded the power of bishops.\n\nThis enraged Parliament and the nobles. Former parliamentary representatives organized themselves, drafted a 'Grand Remonstrance' and submitted it to the king, condemning his tyranny and demanding limits on royal power and the reopening of Parliament. The king, refusing to accept the Grand Remonstrance, attempted to arrest the parliamentary representatives, but failed due to informants and crowd obstruction, ultimately triggering a full-scale civil war between Parliament and the Crown."
DD_ENG_61a: "You leave me no choice!"
DD_ENG_61a_modifier: "Parliament Suspended"
desc_DD_ENG_61a_modifier: "The parliamentary faction has raised a rebellion, which has also led to a full suspension of Parliament."
DD_ENG_62_t: "Oliver Cromwell"
DD_ENG_62_d: "Oliver Cromwell was born into a noble family in Huntingdonshire and was twice elected to Parliament as a representative of Huntingdonshire. By leading the fenland residents in resistance against nobles, Cromwell won widespread popular support. In the English Civil War, he returned to Huntingdon, organized a cavalry troop to fight the king, won battle after battle, was promoted to lieutenant general, and ultimately became the largest parliamentary army.\n\nAfter the war broke out, Cromwell returned to Parliament to participate in organizing the Eastern Association army, and advocated Parliament passing the 'New Model Army Act,' becoming the deputy commander-in-chief and de facto supreme military commander of this main parliamentary army. Now, Oliver Cromwell and his New Model Army have become the most powerful enemy of the Royalist army, appearing almost invincible."
DD_ENG_62_d2: "Oliver Cromwell was born into a noble family in Huntingdonshire and was twice elected to Parliament as a representative of Huntingdonshire. By leading the fenland residents in resistance against nobles, Cromwell won widespread popular support, and thus became an important force in Parliament, accumulating substantial political strength.\n\nIn Parliament, Cromwell is known for advocating hardline political views, and has been called 'General Cromwell' for repeatedly advocating military action and forceful solutions. He supports presidential centralization, establishing an efficient bureaucratic government and a centralized system, and has numerous supporters. Now, Oliver Cromwell has become a strong contender for the next presidency, with a chance to realize his ideas."
DD_ENG_62a: "An excellent presidential candidate."
DD_ENG_62c: "Invite him to join the cabinet."
DD_ENG_62b: "Rebel, you will pay the price!"
DD_ENG_62a_modifier: "General Cromwell"
desc_DD_ENG_62a_modifier: "Hardline and efficient."
DD_ENG_63_t: "The Dust Settles"
DD_ENG_63_d: "The war is over; the parliamentary army's rebellion has finally been crushed by us, but England has become ruins. Now, the land needs recovery, the ruins need rebuilding, and what should we do with Parliament? The English Parliament is a tradition continuing from the Five Provinces Union era, and an important tool for winning over the nobles; this attempt to abolish Parliament caused a huge backlash.\n\nTherefore, we had best retain Parliament, limit its power through legislation, strengthen royal power, reduce Parliament's nagging at us, and also win over the people's hearts, preventing the nobles from becoming desperate. The lenient and kind king has decided that, except for the ringleaders of this rebellion who will be prosecuted for treason according to law, the other rebels who participated in the rebellion will be pardoned."
DD_ENG_63a: "Long live the King!"
DD_ENG_63a_modifier: "Limited Parliament"
desc_DD_ENG_63a_modifier: "By limiting Parliament, the king's power will be infinite."
DD_ENG_64_t: "The Fate of the Netherlands"
DD_ENG_64_d: "Fate unexpectedly chose us to be King of England, but this also means we must make a choice. The Emperor will not allow his Low Countries to drift outside the Empire; if we insist on going our own way, it will obviously cause a war over the Low Countries. But if we simply resign ourselves to giving up our power, it would be too regrettable.\n\nOur advisors propose a new option—perhaps we can try to negotiate with the Emperor, re-dividing the imperial territories and taking only our hereditary lands, returning the rest to the Empire. Such a compromise might satisfy everyone and peacefully resolve our differences with the main branch."
DD_ENG_64a: "Maintain rule over the Low Countries."
DD_ENG_64b: "Return the Low Countries to the Empire."
DD_ENG_64c: "Split the Low Countries with the Empire."
DD_ENG_64b_op: "Renounce the Throne Claim"
DD_ENG_64a_op: "Seize the Low Countries"
DD_ENG_64a_modifier: "Looming Threat"
desc_DD_ENG_64a_modifier: "Our recent high-profile seizure of other nations' lands has forced other countries to worry about our threat."
DD_ENG_64a_tt: "§RMaintaining rule over the Low Countries means angering the Emperor, and makes it unlikely we can join the Holy Roman Empire diplomatically in the future.§!\n\nAll §YHoly Roman Empire§! nations gain §R+50§! aggressive expansion toward us.\n"
DD_ENG_64b_tt: "§YThis demonstrates our goodwill; Empire members will be more inclined to accept us in imperial incidents.§!\n"
DD_ENG_65_t: "Low Countries Unrest"
DD_ENG_65_d: "The people of the Low Countries are very dissatisfied with the Viceroy going to England to be crowned king. After all, they never wanted to betray the Empire; they needed a German king, not an English king. Moreover, the Low Countries are separated from England by the Channel, making rule very inconvenient. Therefore, a large number of Low Countries nobles and peasants openly protested, demanding independence and a return to the Empire."
DD_ENG_65a: "Unsettling."
DD_ENG_65a_modifier: "Low Countries Protest"
desc_DD_ENG_65a_modifier: "The Low Countries are deep in discontent."
DD_ENG_66_t: "The Best Model"
DD_ENG_66_d: "[Root.Monarch.GetName] sat on the throne, but his heart was full of confusion. Because he had never thought about what to do once he had this country. After all, how would an ordinary person from Italy know how to govern? After pondering for a long time, he finally hit upon a brilliant idea. Why not look to Italy's 'distant relatives'? Italy's republican spirit and parliamentary politics are truly interesting things; by letting the people elect representatives and manage the state themselves, capable cabinet ministers can help him govern the country without revealing his own meager abilities. Let us imitate them as well."
DD_ENG_66a: "Meticulous, step by step."
DD_ENG_67_t: "A Big Gamble"
DD_ENG_67_d: "The late autumn wind carried street dust as a man hurried through the narrow cobblestone streets. His brow was tightly furrowed, fine beads of sweat on his forehead, and his bloodshot eyes warily scanned his surroundings. He burst into a tavern, picked up the menu, rubbed his hands, and beckoned the waiter: 'Bring me one of everything on this menu. The steak needs extra gravy, so much it overflows the plate!' The waiter was stunned. He looked the man up and down—his clothes were somewhat refined yet somewhat disheveled—and frowned with difficulty, lowering his voice to advise: 'Sir, this will cost a lot.' 'I know,' the man waved impatiently, 'and bring me the biggest tankard of beer you have, ice cold, and overflowing!'\n\nBefore long, the long table was covered with mouth-watering delicacies. A whole roast chicken sizzling with oil, a thick soup fragrant with truffles, a mountain of roasted vegetables, and that huge steak drenched in dark brown gravy, almost drowning the plate. The man was like a beast that had starved for three days and nights, long past caring about gentlemanly etiquette. He grabbed knife and fork and devoured it like wind and clouds. When the last drop of beer was poured down his throat, the man finally let out a long sigh. He leaned back in his chair; that anxiety seemed to dissipate somewhat with this feast, but a trace of gloom still lingered in his eyes. He hesitated, reached into his inner pocket, and slowly pulled out an exquisitely crafted envelope. He drew out the yellowed paper inside—it was a fire-sealed envelope of excellent quality, stamped with a crest symbolizing supreme wealth and power—six fleurs-de-lis surrounding a shield, the emblem of the Medici family. The man gently pushed the paper toward the waiter, a bitter smile at the corner of his mouth: "
DD_ENG_67a: "'Send the bill to the Medici Bank.'"
DD_ENG_68_t: "The Medici of London"
DD_ENG_68_d: "A Medici from Tuscany and his accompanying secretary sat in a coffeehouse on a London street, arguing about their family's wealth and power. This banker, traveling in England, had a sudden whim: if an honest and clever man were stranded in London, destitute, with no relatives, and nothing but a token proving his name was Medici—what fate would such a person have?\n\nThe banker's secretary bet he would starve to death, because he could not prove the wealth in the bank belonged to him; but the true Medici was certain he would not only not starve, but would have a completely different life within thirty days. So this gentleman of great boldness took out his family crest, had his secretary transcribe an impeccable document, and prepared an identity for the person they were waiting for—a banker come to London to prepare a branch of the Medici family bank.\n\nThey waited in front of the shop window for a day, but found no one who met the Medici's fancy. Some looked honest but not clever, some looked clever but not honest, some had both but were not poor enough—until they spotted a Florentine sailor stranded on the English coast."
DD_ENG_68a: "London welcomes a Medici."
DD_ENG_68a_modifier: "Knows Nothing"
DD_ENG_68a_modifier2: "Branch Manager"
desc_DD_ENG_68a_modifier: "Sometimes, knowing nothing is best."
desc_DD_ENG_68a_modifier2: "Seeing this document is like seeing the Medici manager."
DD_ENG_69_t: "Returning to the Owner"
DD_ENG_69_d: "London nights are always silent and cold. [Root.Monarch.GetName] walked alone in his courtyard, enjoying his after-dinner stroll as usual. Sparse clouds obscured the lonely moonlight, making this silent night seem dim and lightless.\n\nPerhaps it was too quiet.\n\nNo nightingales singing, no monotonous insect chirps, the usual clatter of guards' weapons on patrol, the chatter of servants passing by, the giggling evening breeze—all silent and gone.\n\nColdness pierced the king's slightly tipsy brain, making him realize something was wrong—he must return to the hall. The door to the corridor was right before him; he immediately reached for the handle—\n\n'Good evening, Your Majesty.' A man's voice suddenly sounded behind him. 'What a beautiful night, isn't it?'\n\nAn icy chill shot up his spine. The king quickly turned to look at him, hand still on the door handle behind him. 'Who are you? How did you get in?'\n\nThe man held a candlestick in one hand and elegantly bowed with the other to his chest, looking every bit the harmless, delicate nobleman. 'Don't be nervous, sir, relax. We are the Medici family's liquidators. Yes, yes, the Medici of Italy.' Seeing the king's confusion, the man smiled and slowly paced: 'Our duty is to manage, collect, and restructure the family's non-performing assets, and reorganize them into profitable family projects. Oh, you probably don't understand what I mean?'\n\nA sharp sword thrust out from behind the door panel the king was leaning against, piercing through his heart, the blade emerging from his chest. 'Just like that, sir. A Britain ruled by a fraud bearing the family name is of course a non-performing asset.' The liquidators looked at the man gasping in a pool of blood, and threw the candlestick onto the corpse. Leaping flames climbed the palace drapes, devouring everything around like a ravenous beast, soon spreading to the entire palace."
DD_ENG_69a: "A new Medici will soon replace you."
DD_ENG_69a_modifier: "The Eternal Monarch"
desc_DD_ENG_69a_modifier: "Many people say they feel the king has become a different person."
DD_ENG_69a_modifier2: "Renaissance"
desc_DD_ENG_69a_modifier2: "This feeling is truly wonderful."
DD_ENG_70_t: "The Five Provinces Assembly"
DD_ENG_70_d: "France is deep in succession crisis, the North Sea Empire is in its twilight, and our old friends seem too preoccupied to stop our ambitions. An opportunity to unify our nation and revive England seems right before our eyes, fleeting. To realize our motherland's dream of revival, to dig England out of the grave, the surviving remnants of England must unite—more united than ever before. To this end, London has decided to convene the Five Provinces Assembly, to determine at the Grand Parliament the future policy for leading England's revival."
DD_ENG_70a: "Convene the assembly!"
DD_ENG_71_t: "Assembly Invitation"
DD_ENG_71_d: "London's mayor Humphrey urgently convened an assembly, saying there was some important matter to discuss. Recently, rumors of centralization are growing; perhaps London's representatives want to use this meeting to propose merging the five provinces and taking the lead."
DD_ENG_71a: "Let's go see what they're up to."
DD_ENG_71b: "This must be a conspiracy; let's investigate."
DD_ENG_71b_tt: "§RThis is obviously not a good idea.§!\n"
DD_ENG_71b_tt2: "§MWho knows what you might find out?§!\n"
DD_ENG_72_t: "Gathering Together"
DD_ENG_72_d: "Without surprise, representatives from all provinces have arrived in London, ready to attend the upcoming Five Provinces Assembly."
DD_ENG_72_d2: "Unexpectedly, when the provincial representatives gathered, they found that Kent's representative was missing from the hall. Of course, this is harmless; the assembly will continue."
DD_ENG_72a: "Then, the stage is set."

DD_ENG_73_t: "The Eve of the Storm"
DD_ENG_73_d: "The Parliament was bustling with voices, representatives from various provinces whispering about what today's assembly might discuss, until the distinct sound of leather boots striking the floor came clearly from the doorway.\n\n'Welcome, welcome everyone.' Sir Humphrey stamped his cane and elegantly spoke, 'According to reliable information, something major is about to happen in both France and the North Sea Empire. Something we English have long awaited—an inevitable civil war.' The crowd erupted in uproar, discussing animatedly.\n\n'Gentlemen, gentlemen!' The knight swung his cane, the dark head making a clear sound on the wooden table. 'We have waited for this for a hundred years, or even longer, so long that we no longer knew if such a golden opportunity would ever come. How many of us come from the fallen north, fleeing from Viking rule? How many of us were subjects of French governors, having to endure their foolish and brutal rule over England? We are proud English nobles, descendants of Alfred the Great, not anyone's attendants, servants, or anything else. Since God has given us this opportunity, we absolutely cannot let it slip away, letting fate manipulate us again, standing by idly!'\n\n'Unwavering determination flows in the noble blood of the English, and unity is our innate noble virtue. We will, in the name of England, unite as one once more. We will declare war on them. War on the savage plunderers and pirates, war on the shameless usurpers and invaders, war on the fools who delusionally wish to rule and annex England. We will fight on every inch of British land, every sea. We will make them understand—England will never submit, never fade away!'"
DD_ENG_73a: "*Thunderous applause*"
DD_ENG_73a_modifier: "Preparations for Restoration"
desc_DD_ENG_73a_modifier: "For what I love, unto death."
DD_ENG_74_t: "England and the Empire"
DD_ENG_74_d: "Our king has Hohenstaufen blood flowing in his veins, thus we have an indisputable claim to the Empire. However, due to our differences with the Empire over the Low Countries, the situation between us is critical. Some advisors suggest we humble ourselves and apply to the Emperor to join the Holy Roman Empire, so as to better dismantle the Empire from within. Of course, perhaps we need not bow our proud heads and confront the Empire head-on."
DD_ENG_74a: "We must join the Holy Roman Empire."
DD_ENG_74b: "Let them come."
DD_ENG_74c: "Let the Low Countries also break free from the Empire."
DD_ENG_75_t: "The German Tide"
DD_ENG_75_d: "Since the Hohenstaufen was elected king, a German tide has swept through the English court and noble society. Courtiers and nobles are competing to imitate German culture, using German-style decorations, even using German in court life, hoping to gain the king's favor. London's high society looks less like London and more like Frankfurt.\n\nTherefore, now seems a perfect opportunity to promote German culture in England. By turning this temporary trend into a long-term policy strategy, perhaps we can transform the English into a people closer to their king, into our true compatriots, and make them thoroughly accept their new royal family."
DD_ENG_75a: "Promote Germanization."
DD_ENG_75a_tt: "§YBritish§! culture group provinces under our rule convert to §YWest Saxon§! culture of the §YGermanic§! culture group.\n"
DD_ENG_75b: "We must stay true to ourselves amid the German tide."
DD_ENG_75b_modifier: "Staying True"
desc_DD_ENG_75b_modifier: "Our ancestors may have come from Germany, but we and they are no longer the same people."
DD_ENG_76_t: "Pioneer of the Republic"
DD_ENG_76_d: "After casting off the shackles of monarchy and stale past traditions, the united Britannia stands alone at the pinnacle of nations. Loose and negligent autonomy, redundant and superfluous freedoms—it is precisely our citizens' great dedication and moving unity that forged our great work; it is precisely the great power they ceded and granted us that allows Britain to command billions of lives like the palm of a hand.\n\nNow, Britannia, Queen of the Seas and Vanguard of the World, is leading the followers of republicanism toward a bright future. Republics take Britain as their model, joining our alliance of common prosperity, all seas in harmony, all nations in concord. And in our united republic, the pillars of the state are all tightly united around the great leader, dedicating everything to the motherland. Of course, the humble public instruments are not without their desires—beneath the shroud of absolute power, countless also dream of one day replacing them."
DD_ENG_76a: "The republican spirit never dies!"
DD_ENG_76a_modifier: "The Republic Endures"
desc_DD_ENG_76a_modifier: "Everything in the world will eventually perish; only the republican ideal endures."
DD_ENG_77_t: "Land of Hope and Glory"
DD_ENG_77_d: "Dear land of hope, thy hope is crowned.\nGod make thee mightier yet!\nOn sov'reign brows, beloved, renowned,\nOnce more thy crown is set.\nThine equal laws, by Freedom gained,\nHave ruled thee well and long;\nBy Freedom gained, by Truth maintained,\nThine Empire shall be strong.\n\nLand of Hope and Glory, Mother of the Free,\nHow shall we extol thee, who are born of thee?\nWider still and wider shall thy bounds be set;\nGod, who made thee mighty, make thee mightier yet,\nGod, who made thee mighty, make thee mightier yet!\n\nThy fame is ancient as the days,\nAs Ocean large and wide\nA pride that dares, and heeds not praise,\nA stern and silent pride\nNot that false joy that dreams content\nWith what our sires have won;\nThe blood a hero sire hath spent\nStill nerves a hero son."
DD_ENG_77a: "Britannia, free and great!"
DD_ENG_77a_tt: "Thank you for playing @ENG§YEngland§!!\n"
DD_ENG_77a_modifier: "Soul of England"
desc_DD_ENG_77a_modifier: "Spirit supernal, Splendour eternal, ENGLAND!"
 #(Spirit supernal, Splendour eternal, ENGLAND!)
 
DD_ENG_78_t: "Master of Europe"
DD_ENG_78_d: "We, [Root.Monarch.GetName], by the grace of God, Emperor of Britannia and the Holy Roman Empire, King of England, Scotland, Ireland, Germany, the Netherlands, France, Italy, Sicily and Jerusalem, etc.; Duke of Wales, Cornwall, Swabia, Brabant, Holland, Naples and Anjou; King of the Romans, Sovereign of all dominions and crown lands.\n\nWe hereby solemnly proclaim to all the peoples of the monarchy, that We ascend the throne in the name of [Root.Monarch.GetName].\n\nWe, out of Our own conviction, recognizing the need for and lofty value of freedom and institutions befitting the times, confidently embark on this path that will lead us to the beneficial transformation and revival of the entire monarchy.\n\nWe are firmly determined to keep the splendor of the crown undefiled, to keep the entire monarchy intact, but are willing to share Our rights with the representatives of Our peoples. We count on the help of God and the understanding of the nations to successfully unite all the lands and tribes of the monarchy into one great national body, merging the old Empire and true kingship into one—Holy Britannia.\n\nAll the dominions of Europe will be unified under the radiance of the new Empire, on the basis of true freedom, on the basis of the equality of rights of all nations of the Empire, the motherland will be reborn, restoring the greatness of old, bound closely by the bonds of brotherhood as beneath the scepter of Our ancestors. We expect from Our glorious people their proven courage, loyalty and endurance. They shall, as they were to Our forebears, become the pillar of Our throne, an unshakable bastion of Europe and of free institutions.\n\nPeoples of Holy Britannia! We have inherited the throne of Our ancestors in a grave era. The responsibility is heavy, and the responsibility bestowed upon Us by Providence is heavy. God's protection will accompany us."
DD_ENG_78a: "By Our own hand, at Our capital [Root.Capital.GetName], in the year of redemption."
DD_ENG_78a_modifier: "Master of Europe"
desc_DD_ENG_78a_modifier: "The secret to a long life is to work less."
DD_ENG_79_t: "Trim One's Sails"
DD_ENG_79_d: "Our earlier efforts to incite the appanages have finally borne fruit. Some appanages disloyal to France have declared neutrality and expressed a desire to join us."
DD_ENG_79a: "Welcome, welcome, a warm welcome!"
DD_ENG_79b: "Actually, I have changed my mind."
DD_ENG_80_t: "The Fate of Scotland"
DD_ENG_80_d: "The fields of Scotland were once filled with primordial freedom, until the arrival of the Vikings broke that silence. The Scots under our rule always wish to return to that joyful age of sprouting things and vibrant life. Alas, our great nation cannot accommodate such freedom."
DD_ENG_80a: "How about as an autonomous state?"
DD_ENG_80b: "Allow them to keep their own culture."
DD_ENG_80c: "Extend our rule to the Scottish Highlands."
DD_ENG_80d: "We only need to rule the people of the Scottish Lowlands."
DD_ENG_80b_tt2: "Provinces of §YAlba§! and §YHighland Scottish§! culture under our rule and in the future gain: "
DD_ENG_80b_modifier: "Autonomous Region"
desc_DD_ENG_80b_modifier: "This province enjoys a certain degree of autonomy, is permitted to form its own government and enact laws."
DD_ENG_80c_tt: "§YHighland Scottish§! and §YAlba§! culture will transform into §YScottish§! culture of the §YBritish§! culture group.\n"
DD_ENG_80d_tt: "§YAlba§! culture will transform into §YScottish§! culture of the §YBritish§! culture group.\n"

DD_ENG_81_t: "The Fate of Ireland"
DD_ENG_81_d: "Although we have replaced the Vikings and become the new High King of Ireland, many still grumble and harbor resentment about this, wishing instead that the High King could be an Irishman. Accordingly, some Irish nobles have extended an olive branch to us, hinting that if we promise not to interfere with their privileges in Ireland, they can help promote the legitimacy of our rule over Ireland."
DD_ENG_81a: "Promise the Irish nobles their rule."
DD_ENG_81b: "Establish an Irish autonomous region."
DD_ENG_81c: "Forcibly integrate Ireland."
DD_ENG_81b_tt: "Provinces in the §YIreland§! region under our rule and in the future will gain: "
DD_ENG_81c_tt: "§YIrish§! culture will transform into §YHibernian§! culture of the §YBritish§! culture group.\n"
DD_ENG_82_t: "What of the Rest"
DD_ENG_82_d: "Since we expelled the Viking regimes and unified the entire island, what to do with the Vikings still remaining in Britain has become a problem. True, our king may share the same roots as them, but there is no surplus land available to settle them at present. Of course, the Celts always have surplus land..."
DD_ENG_82a: "Integrate them."
DD_ENG_82b: "Allow them to settle in the Scottish Highlands."
DD_ENG_82c: "Back where they came from."
DD_ENG_82b_tt: "§YHighland Scottish§! culture under our rule will transform into §YIsles§! culture.\n"
DD_ENG_82c_tt: "§YIsles§! culture of §YBritain§! will transform into §YHighland Scottish§! or §YAlba§! culture.\n"
DD_ENG_83_t: "Choose a Political Ideal"
DD_ENG_83_d: "There is too much imperfection and regret in the world, and also too many beautiful things worth striving and working for. Everyone arrives with ideals and dies with regrets. Mr. President, what is your ideal?"
DD_ENG_83a1: "I wish for lasting peace and stability."
DD_ENG_83a2: "I wish for smooth sailing."
DD_ENG_83b1: "I wish for world peace."
DD_ENG_83b2: "I wish to mediate at home and abroad."
DD_ENG_83c1: "I wish for invincibility."
DD_ENG_83c2: "I wish for wars to go smoothly."
DD_ENG_83d: "I crave power!"
DD_ENG_83e: "I want to live easily!"
DD_ENG_83f: "I want to live forever!"
DD_ENG_83a1_modifier: "Political Ideal: Lasting Peace and Stability"
desc_DD_ENG_83a1_modifier: "This president wants to make the people happy. There is no simpler ideal than this."
DD_ENG_83a2_modifier: "Political Ideal: Smooth Sailing"
desc_DD_ENG_83a2_modifier: "This president hopes that ideally nothing happens, at least during his term."
DD_ENG_83b1_modifier: "Political Ideal: World Peace"
desc_DD_ENG_83b1_modifier: "This president believes the world is beautiful and devotes himself to building a beautiful world."
DD_ENG_83b2_modifier: "Political Ideal: Mediation at Home and Abroad"
desc_DD_ENG_83b2_modifier: "This president hopes to conduct diplomacy with ease both domestically and abroad, but things always turn out contrary to his wishes."
DD_ENG_83c1_modifier: "Political Ideal: Invincibility"
desc_DD_ENG_83c1_modifier: "This president craves invincibility in war, conquering all and winning every battle—after all, war is an art."
DD_ENG_83c2_modifier: "Political Ideal: Smooth Wars"
desc_DD_ENG_83c2_modifier: "This president hopes wars will all go smoothly, though he can do nothing but declare war."
DD_ENG_83d_modifier: "Political Ideal: Centralization"
desc_DD_ENG_83d_modifier: "This president well knows that greater power means greater rights, and thus thirsts for power."
DD_ENG_83e_modifier: "Political Ideal: Decentralization"
desc_DD_ENG_83e_modifier: "This president knows nothing of politics. He does not truly want to be president; he would prefer to be a mascot, a rubber stamp."
DD_ENG_83f_modifier: "Political Ideal: Eternal Monument"
desc_DD_ENG_83f_modifier: "This president understands that only by living can one make contributions, and thus wishes for his own immortality, in whatever sense."
DD_ENG_83a1_tt: "§MGaining§! province development grants §G+0.5§! §ODevotion§!.\n"
DD_ENG_83b1_tt: "Once randomly checked each year, if at §Ypeace§! gain §G+1.0§! §ODevotion§!.\n"
DD_ENG_83c1_tt: "Winning a war grants §G+2.5§! §ODevotion§!. If the opponent is a §YGreat Power§!, the §ODevotion§! gained is §Gdoubled§!.\n"
DD_ENG_84_t: "Both Holy and Imperial"
DD_ENG_84_d: "Since we have successfully become Emperor of the Holy Roman Empire, many have begun cheering another name—Holy Britannia. The reason is simple: rather than being an emperor of a Holy Empire without Rome, it is better to establish our own Holy Empire."
DD_ENG_84a: "Three cheers for Holy Britannia!"
