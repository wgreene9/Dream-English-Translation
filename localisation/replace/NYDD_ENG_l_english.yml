NYDD_ENG_care_france_title: "French Court"
NYDD_ENG_care_france_desc: "France is Europe's advanced court, and French is almost the lingua franca of Europe. We must immediately introduce French to the court."
NYDD_ENG_heal_the_pain_title: "Healing the Wounds"
NYDD_ENG_heal_the_pain_desc: "Enough. Although there is irreconcilable deep hatred between the French and English, for the stability and development of the nation, we must force them to set aside their fratricidal sentiments and march toward tomorrow together."
NYDD_ENG_unite_culture_title: "Cultural Blending"
NYDD_ENG_unite_culture_desc: "Our newly conquered, or rather reclaimed, French regions are influencing us with their profound culture. It is time to decide who we are."

NYDD_ENG_care_france_tt: "This modifier will gradually §Gstrengthen§! with the ages."
NYDD_ENG_care_france_modifier: "French Court"
desc_NYDD_ENG_care_france_modifier: "French is our court language; she will progress with the ages."
NYDD_ENG_care_france_modifier2: "French Court"
desc_NYDD_ENG_care_france_modifier2: "French is our court language; she will progress with the ages. In our age, words are mightier than swords."
NYDD_ENG_care_france_modifier3: "French Court"
desc_NYDD_ENG_care_france_modifier3: "French is our court language; she will progress with the ages. In our age, dare people still speak?"
NYDD_ENG_care_france_modifier4: "French Court"
desc_NYDD_ENG_care_france_modifier4: "French is our court language; she will progress with the ages. In our age, do words still have meaning?"
NYDD_ENG_heal_the_pain_ttt: "Has passed the decision '§YUnite English Culture§!'"
NYDD_ENG_heal_the_pain_tt: "When §Mdeveloping§! a province of §YBritish§! or §YFrench§! culture group, §G20.0%§! chance to develop §G1§! extra point.\n\nWith modifier '§YTreat All Equally§!', chance increases by an additional §G20.0%§!.\n"
NYDD_ENG_heal_the_pain_modifier: "Treat All Equally"
desc_NYDD_ENG_heal_the_pain_modifier: "A believing heart is my magic."
NYDD_ENG_unite_culture_tt: "Our newly conquered, or rather reclaimed, French regions are influencing us with their profound culture. It is time to decide who we are."

NYDD_ENG_claim_france_title: "Plantagenet Dynasty" # The Plantagenet Dynasty
NYDD_ENG_claim_france_desc: "To avoid arousing the discontent of the English populace, our king has changed his surname to 'Plantagenet,' hoping this will reduce people's resentment. However, we still do not intend to abandon our claim to France."
NYDD_ENG_anjou_france_title: "King of the Fleur-de-Lis"
NYDD_ENG_anjou_france_desc: "Our ancient bloodline has had the right to inherit France since ancient times. The incompetent Richard II exiled our ancestors; we will surely seek justice."
NYDD_ENG_conquer_south_title: "Rule France"
NYDD_ENG_conquer_south_desc: "There are still many nobles in our ruled France who oppose us. We must bring the courts to France and make them loyally obey us."
NYDD_ENG_king_of_EF_title: "Joint Monarchy" # Joint Monarch of England and France
NYDD_ENG_king_of_EF_desc: "We rule both Britain and France. Greatness needs no elaboration."
NYDD_ENG_anjou_empire_title: "Plantagenet Century" # The Plantagenet Century
NYDD_ENG_anjou_empire_desc: "Once, we were just a group of exiles, struggling stranded in Britain. Now, we not only reign over Paris, but have also established our great united kingdom. Oh, our era, like the sun, shines forever upon the people."

NYDD_ENG_claim_france_ttt: "Is or was France"
NYDD_ENG_claim_france_tt: "Next time we declare war on @FRA§Y[FRA.GetName]§! gain;"
NYDD_ENG_claim_france_modifier: "Righteous Claim"
desc_NYDD_ENG_claim_france_modifier: "Once they used a throne claim on England; now they too will taste their own medicine."
NYDD_ENG_claim_france_modifier2: "Throne Dispute"
desc_NYDD_ENG_claim_france_modifier2: "Where did some random nobody come from to claim our throne of France."
NYDD_ENG_anjou_france_modifier: "Plantagenet France"
desc_NYDD_ENG_anjou_france_modifier: "Not the same name, but perhaps the same bloodline."
NYDD_ENG_anjou_france_modifier2: "Return to the Continent"
desc_NYDD_ENG_anjou_france_modifier2: "Perhaps the last time returning to England."
NYDD_ENG_anjou_france_tt2: "§Y[Root.GetName]§! gains §Jterritorial cores§! on §YFrench§! region provinces not belonging to it or its subjects.\n"
NYDD_ENG_anjou_france_tt: "Unlocks tier §M5§! government reforms '§YOrdinance Gendarme Company§!', '§YMusketeer Guard§!' and '§YHeavy Cavalry§!'.\n"
NYDD_ENG_king_of_EF_ttt: "Has completed the event '§YFrench Fashion§!' §g(triggered by mission '§YCultural Blending§!')§!"


NYDD_ENG_perpare_fleet_title: "Regardless of Distance"
NYDD_ENG_perpare_fleet_desc: "Our claim is far away in distant Northern Europe, which means we must build a massive invasion fleet. To return to the ancestral land, we spare no distance."
NYDD_ENG_north_sea_union_title: "North Sea Union"
NYDD_ENG_north_sea_union_desc: "The cruel tyranny of the past North Sea Empire was too oppressive. We in Britain have had the tradition of the Witenagemot since ancient times. Let us form a North Sea Union with our Nordic brothers and sisters, everyone equal, only we are more equal."
NYDD_ENG_country_road_title: "Return to the Ancestral Land"
NYDD_ENG_country_road_desc: "Oh, Viking longship, take me home."
NYDD_ENG_restore_northsea_empire_title: "A New North Sea Empire" # Restore the North Sea Empire
NYDD_ENG_restore_northsea_empire_desc: "The old North Sea Empire is gone; the new North Sea Empire will be reborn from her ruins, becoming a new legend."

NYDD_ENG_perpare_fleet_tt: "@DAN§YDanes§! have gained independence from the North Sea Empire and established their own nation. Considering past relations, perhaps we can negotiate with them about the future. However, the §YGermans§! within their territory may be §Runhappy§!.\n"
NYDD_ENG_perpare_fleet_ttyes1: "£yes£If @DAN§Y[Root.GetName]§! exists and has §G100§! opinion of us, triggers event '§YReunited as One§!', giving us a §Gchance§! to unite in rule over @DAN§Y[DAN.GetName]§!.\n\n£no£Otherwise we gain a casus belli '§YThrone Claim§!' against them for §G20§! years.\n"
NYDD_ENG_perpare_fleet_ttno1: "£no£If @DAN§Y[Root.GetName]§! exists and has §G100§! opinion of us, triggers event '§YReunited as One§!', giving us a §Gchance§! to unite in rule over @DAN§Y[DAN.GetName]§!.\n\n£yes£Otherwise we gain a casus belli '§YThrone Claim§!' against them for §G20§! years.\n"
NYDD_ENG_perpare_fleet_ttno2: "£no£If @NOR§Y[NOR.GetName]§! exists and is independent, we gain a casus belli '§YThrone Claim§!' against them for §G20§! years.\n"
NYDD_ENG_perpare_fleet_ttno3: "£no£If @NSE§Y[NSE.GetName]§! exists and is independent, we gain a casus belli '§YThrone Claim§!' against them for §G20§! years.\n"
