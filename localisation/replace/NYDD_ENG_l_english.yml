NYDD_ENG_country_road_modifier: "Continue Eastward"
desc_NYDD_ENG_country_road_modifier: "There are too many primitive Norse; the North Sea Empire simply did not kill enough of them."
NYDD_ENG_country_road_tt: "§YNorth Sea Union member§! subjects gain:\nMissionary Strength: §G+2.0%§!\nConstruction Cost: §G-10.0%§!\n\nUnlocks decision allowing us to release @SW1§YSweden§! as a §YNorth Sea Union member§! subject.\n"
NYDD_ENG_north_sea_union_modifier: "North Sea Union Member"
desc_NYDD_ENG_north_sea_union_modifier: "Gobble gobble?"
NYDD_ENG_country_road_modifier2: "North Sea Union Member"
desc_NYDD_ENG_country_road_modifier2: "Gobble gobble!"
DD_ENG_release_SW1_tt: "§MUnite§! §YSvealand§!, §YNorrland§!, §YGötaland§! into §YSwedish§! culture.\n"
DD_ENG_release_SW1_title: "@SW1 Unite Sweden"
DD_ENG_release_SW1_desc: "The Swedes remain divided to this day, unable to unite. Let us help these lost lambs."
NYDD_ENG_restore_northsea_empire_tt: "An emperor reforges destiny, an empire is reborn."
NYDD_ENG_restore_northsea_empire_ttt: "Has passed the decision '§YUnite Sweden§!'"

DD_ENG_set_northsea_subject:0 "Establish North Sea Union Member"
DD_ENG_set_northsea_subject_title:0 "Establish North Sea Union Member"
DD_ENG_set_northsea_subject_desc:0 "Do you wish to establish §Y[From.GetName]§! as your §YNorth Sea Union member§!? This will cost us §R25§!£dip£"
DD_ENG_set_northsea_subject_tooltip:0 "Suggest they become our North Sea Union member."
DD_ENG_set_northsea_subject_alert_tooltip:0 "Propose establishing a §YNorth Sea Union member§!"
DD_ENG_set_northsea_subject_ttt: "Fewer than §Y4§! North Sea Union members"

NYDD_ENG_last_of_empire_title: "Last Remnant of the Empire"
NYDD_ENG_last_of_empire_desc: "Our king comes from the long-declined Cnutling dynasty. As the last descendant of the First North Sea Empire, he is truly alone. Fortunately, he has us excellent Britons by his side; surely we can return to the homeland and create glory again."
NYDD_ENG_accept_norse_title: "Accept the Vikings"
NYDD_ENG_accept_norse_desc: "End the hostility! The king cries. Vikings are people too. We can move forward hand in hand, making history together."
NYDD_ENG_understand_norse_title: "Understand the Vikings"
NYDD_ENG_understand_norse_desc: "The Vikings have come and settled; we can make a good life together, right?"
NYDD_ENG_become_norse_title: "Become Vikings"
NYDD_ENG_become_norse_desc: "Oh oh oh oh, awakened, the Viking blood within."

NYDD_ENG_accept_norse_modifier: "Viking Court"
desc_NYDD_ENG_accept_norse_modifier: "According to our ruler's preferences, the court inexplicably has a bunch of Vikings."
NYDD_ENG_accept_norse_tt: "Each level of §YScandinavian§! culture group advisor grants:\nCorresponding advisor cost: §G-5.0%§!\n"
NYDD_ENG_understand_norse_tt: "Excellent military training will prevent our heir from dying in hunting accidents.\n"
NYDD_ENG_understand_norse_modifier2: "Recruitable Varangian Guard"
desc_NYDD_ENG_understand_norse_modifier2: ""
NYDD_ENG_understand_norse_modifier: "Reform the Varangian Guard"
desc_NYDD_ENG_understand_norse_modifier: "More and more Varangian Guard members are returning home from Greece, becoming a powerful asset to our army. Let us use these excellent veterans as the core to form our own Varangian Guard."
NYDD_ENG_become_norse_tt: "As the Viking power within us awakens, some begin to propose a mysterious theory—returning to the embrace of Scandinavia. But others say, we have long been Britons."

NYDD_ENG_true_king_title: "Legitimists Return" # The Legitimists Return
NYDD_ENG_true_king_desc: "They've returned, all returned. England's one and only legitimate king, the king of the Wessex dynasty, has finally returned to his loyal England."
NYDD_ENG_old_capital_title: "Return the Old Capital"
NYDD_ENG_old_capital_desc: "During the Wessex dynasty, our capital was always Hampshire. Although later, due to circumstances and trade needs, London became a more suitable capital. But since our king's homesickness is gradually welling up, let us satisfy his small request."
NYDD_ENG_stop_7_title: "Integrate Administration"
NYDD_ENG_stop_7_desc: "In the past England was divided and each ruled its own way; later England also became a contested zone among various forces, with chaotic administration. Since we have reunified England, we should reintegrate the administrative systems of the various regions."
NYDD_ENG_english_culture_title: "Cultural Self-Reliance"
NYDD_ENG_english_culture_desc: "Englishmen, be confident! Don't be fooled by the French and Vikings and Germans and Italians and Dutch and Spanish outside—there's no gold out there!"
 
NYDD_ENG_true_king_modifier: "Legitimist King"
desc_NYDD_ENG_true_king_modifier: "People cheer, because the Wessex family has returned."
NYDD_ENG_old_capital_modifier: "Rebuild the Capital"
desc_NYDD_ENG_old_capital_modifier: "Hampshire, great and beautiful."
NYDD_ENG_stop_7_tt: "§YCourt§! building now grants the province §G+15.0%§! local tax modifier.\n"
NYDD_ENG_stop_7_modifier: "Administrative Integration"
desc_NYDD_ENG_stop_7_modifier: "This province is under English rule, very happy."
DD_ENG_courthouse_give_10_tax_modifier: "Courthouse Tax"
desc_DD_ENG_courthouse_give_10_tax_modifier: "Under the courthouse's watch, taxes are higher. This is very reasonable."
NYDD_ENG_english_culture_tt: "§YAnglois§! culture under our rule will convert to §YEnglish§! culture of the §YBritish§! culture group.\n\n"
NYDD_ENG_english_culture_modifier: "Cultural Confidence"
desc_NYDD_ENG_english_culture_modifier: "England, rise up!"

NYDD_ENG_help_island_title: "Aid the Small Island"
NYDD_ENG_help_island_desc: "An unknown passerby told us something unheard of—far away in the Balearic Islands of Mallorca, there is actually a wandering former English fleet, claiming to be refugees of the Wessex dynasty from the 1066 invasion. This greatly shocked us. The king even ordered that all possible aid be sent to help these English on the small island."
NYDD_ENG_long_way_from_home_title: "Far Across the Shore"
NYDD_ENG_long_way_from_home_desc: "Although we have done our utmost to help the people of Mallorca get by, their living space is still too small. We must open a new homeland for them in Iberia."
NYDD_ENG_beyond_two_countries_title: "Twin Across the Sea"
NYDD_ENG_beyond_two_countries_desc: "The New England regime we fostered in Iberia is thriving, echoing us from afar, complementing each other."
NYDD_ENG_british_union_title: "British Union"
NYDD_ENG_british_union_desc: "Our British Union system trialed in various places has had some success. It is time to spread it worldwide. Let the world feel British rule."

NYDD_ENG_help_island_tt: "When @MJO§Y[MJO.GetName]§! is our §Msubject§!, it can also complete §Mpart§! of its missions.\n"
NYDD_ENG_long_way_from_home_ttyes: "£yes£If @MJO§Y[MJO.GetName]§! is our §Msubject§!: "
NYDD_ENG_long_way_from_home_ttno: "£no£If @MJO§Y[MJO.GetName]§! is our §Msubject§!: "
NYDD_ENG_long_way_from_home_tt: "§YNew English§! culture will §Gspread naturally§! in §YIberian§! provinces under us or our subjects that are of the §Ystate religion§! with no separatism or rebellion.\n"
NYDD_ENG_beyond_two_countries_modifier: "Heart to Heart"
desc_NYDD_ENG_beyond_two_countries_modifier: "We are intimately close with the people of New England."
NYDD_ENG_beyond_two_countries_modifier2: "British Union Member Tribute"
desc_NYDD_ENG_beyond_two_countries_modifier2: "How wonderful."
NYDD_ENG_beyond_two_countries_tt: "Our §YBritish Union member§! subjects will also gain this modifier.\n\nEach §YBritish Union member§! subject with at least §Y10§! provinces grants us:\nMerchants: §G+1.00§!\nFlagship Limit: §G+1.00§!\n"
NYDD_ENG_beyond_two_countries_tt2: "It is time to decide the fate of our friends far away in Iberia."
NYDD_ENG_long_way_from_home_tt2: "@EN9§Y[EN9.GetName]§! is now considered a §YBritish Union member§!.\n"
NYDD_ENG_long_way_from_home_modifier: "English Military Aid"
desc_NYDD_ENG_long_way_from_home_modifier: "Our English compatriots have risen and decided to aid us."
DD_ENG_46a_modifier: "British Rule"
desc_DD_ENG_46a_modifier: "Britain, conquer the Earth!"
DD_ENG_46a_modifier2: "Blessings of the British Union"
desc_DD_ENG_46a_modifier2: "We must strive hard to be worthy of our suzerain."
DD_ENG_46a_tt: "Our §YBritish Union member§! subjects §Gremove subject base penalties§! and gain:\n[global_trade_goods_size_modifier]: §G+15.0%§!\n[global_manpower_modifier]: §G+15.0%§!\n"
NYDD_ENG_british_union_tt: "[Root.GetName]'s gaze crosses the world; we will establish a great union with our dear member nations, forever.\n"
DD_ENG_60a_tt: "Unlocks diplomatic §YInfluence§! action '§YEstablish Member State§!', allowing us to convert qualifying §Yvassals§! into §YBritish Union member§! subjects.\n"
 num_of_british_subject: "British Union Member Limit"

NYDD_ENG_unexpected_title: "Unexpected"
NYDD_ENG_unexpected_desc: "Why would a Medici become King of England? This can't be right. Alas, new here, first throw money around to show strength."
NYDD_ENG_english_bank_title: "Bank of England"
NYDD_ENG_english_bank_desc: "Bank of England, trust guaranteed independently by the Medici family. If you can't repay your loan, mysterious Italian men in black will soon come to help you pay."
NYDD_ENG_economic_master_title: "Economic Master"
NYDD_ENG_economic_master_desc: "Who keeps saying the Medici aren't good at economics? I really need to personally operate and show you my understanding of economics. Oh no, crash."
NYDD_ENG_control_hand_title: "Macro-Control"
NYDD_ENG_control_hand_desc: "Macro-control means secretly pocketing the extra money from the market. Economy? What economy? Talk to my tax collectors."

NYDD_ENG_unexpected_modifier: "Campaign Promise"
desc_NYDD_ENG_unexpected_modifier: "Throwing money really works, kids."
NYDD_ENG_unexpected_tt: "When §Yconfiscating estate land§!, rebels will no longer trigger.\n"
NYDD_ENG_english_bank_tt: "One problem must always be covered by another.\n"
NYDD_ENG_economic_master_ttyes: "£yes£If we have the age ability '@ENG§YEnglish Commercialism§!', convert it to a §Gpermanent modifier§!.\n"
NYDD_ENG_economic_master_ttno: "£no£If we have the age ability '@ENG§YEnglish Commercialism§!', convert it to a §Gpermanent modifier§!.\n"
NYDD_ENG_economic_master_modifier: "@ENG English Commercialism"
desc_NYDD_ENG_economic_master_modifier: "The Medici truly are economic masters."
NYDD_ENG_control_hand_modifier: "English Protectionism"
desc_NYDD_ENG_control_hand_modifier: "Oh my, the great hand of the Medici!"
NYDD_ENG_economic_master_tt: "Each level of '§YTreasurer§!' advisor additionally grants §G-0.06§! yearly inflation reduction.\nEach level of '§YMerchant§!' advisor additionally grants §G+4.0%§! national tax modifier.\nEach level of '§YMint Master§!' advisor additionally grants §G+4.0%§! trade efficiency.\n"
NYDD_ENG_control_hand_tt: "Modifier '§YJourney of Rebirth§!' is replaced with '§YLanguage of Economics§!', with additions:\nGlobal Prosperity Growth: §G+2.00§!\nGlobal Workshop Limit: §G+1§!\n"
NYDD_ENG_control_hand_modifier2: "Language of Economics"
desc_NYDD_ENG_control_hand_modifier2: "Money speaks to me."

NYDD_ENG_good_dip_title: "Distinguished Guests" # Full of Distinguished Guests
NYDD_ENG_good_dip_desc: "One of a banker's excellent qualities is having a good reputation. You may not know, but Parliament is full of my friends."
NYDD_ENG_beloved_title: "Clouds of Friends"
NYDD_ENG_beloved_desc: "The Medici's good reputation always lets them make many friends across Europe. Some of them are quite useless."
NYDD_ENG_paint_republic_title: "Whitewashing the Republic"
NYDD_ENG_paint_republic_desc: "The Medici are all the same; wherever they go, they whitewash their republican spirit, firmly denying they are monarchs. Unfortunately, everyone knows."
NYDD_ENG_make_false_ture_title: "Making False True"
NYDD_ENG_make_false_ture_desc: "When false is true and true is false, false is true. Can the gambler who threw the chips guess today's outcome?"

NYDD_ENG_good_dip_ttt: "nations have §G150§! opinion of §Y[Root.GetName]§!"
NYDD_ENG_good_dip_tt: "Immediately §Gremoves§! all our §Raggressive expansion§!.\n"
NYDD_ENG_make_false_ture_ttt: "Has the world's highest income"

NYDD_ENG_beloved_tt: "Each level of £dip£§Ydiplomatic advisor§! additionally grants §G+0.5§! diplomatic reputation.\n\nUnlocks diplomatic §YInfluence§! action '§YJustify Propaganda§!', allowing us to §Gremove§! a specified nation's §Gaggressive expansion impact§! toward us.\n"
NYDD_ENG_beloved_modifier: "Loved by All"
desc_NYDD_ENG_beloved_modifier: "Convincing others we mean no harm is not difficult."
NYDD_ENG_paint_republic_tt: "§GDouble§! the chance of gaining monarch traits '§YEntrepreneur§!', '§YIndustrious§!', '§YCharismatic Negotiator§!', '§YSilver Tongue§!' and '§YFierce Negotiator§!'.\n"
 #entrepreneur_personality industrious_personality charismatic_negotiator_personality silver_tongue_personality fierce_negotiator_personality
NYDD_ENG_paint_republic_ttt: " §YRepublican§! nations are your §Yallies§! or §Ysubjects§!"
NYDD_ENG_make_false_ture_tt: "When all is silent, an uninvited guest bursts into the palace, seemingly to demand something…"

DD_ENG_clear_ae_dip_ttt: "[Root.GetName] can afford §Y[From.GetName]§!'s one year income"
DD_ENG_clear_ae_dip: "Justify Propaganda"
DD_ENG_clear_ae_dip_title: "Justify Propaganda"
DD_ENG_clear_ae_dip_desc: "Pay §Y[From.GetName]§!'s one year income to express our goodwill, letting them understand our expansion is justified, not aggressive.\n\nThis will remove all of §Y[From.GetName]§!'s aggressive expansion toward us, and costs §R25§!£dip£.\n"
DD_ENG_clear_ae_dip_tooltip: "With a little wealth, we can make [From.GetName]'s ruler ignore our expansion.\n"
DD_ENG_clear_ae_dip_ttt2: "Has not used this interaction in the last year"


NYDD_ENG_diff_friend_title: "All Rivers Run into the Sea"
NYDD_ENG_diff_friend_desc: "Our republic is very tolerant. No matter what ethnicity or faith you come from, as long as you serve the republic, you can be accepted."
NYDD_ENG_more_friend_title: "Greatness Lies in Tolerance"
NYDD_ENG_more_friend_desc: "Commoners are the foundation of our nation; letting them participate in Parliament doesn't seem bad. Otherwise, how are we different from an aristocratic republic?"
NYDD_ENG_more_than_republic_title: "Beyond the Republic"
NYDD_ENG_more_than_republic_desc: "The republic cannot be merely superficial, but a shared responsibility for public affairs. We have transcended the classical republic, allowing every citizen to participate in public affairs."

NYDD_ENG_diff_friend_modifier: "All Rivers Run into the Sea"
desc_NYDD_ENG_diff_friend_modifier: "All are brothers from every corner of the world."
NYDD_ENG_diff_friend_modifier_bjh: "Military Expansion Act"
desc_NYDD_ENG_diff_friend_modifier_bjh: "The Duke of Buckingham continues the policy, continuing military expansion."
NYDD_ENG_diff_friend_modifier_glmg: "Welsh Development Act"
desc_NYDD_ENG_diff_friend_modifier_glmg: "The Earl of Glamorgan still can't forget his homeland."
NYDD_ENG_diff_friend_modifier_ld: "Shipbuilding Act"
desc_NYDD_ENG_diff_friend_modifier_ld: "The Earl of Hastings is advocating the necessity of shipbuilding."
NYDD_ENG_diff_friend_modifier_dwe: "Public Works Act"
desc_NYDD_ENG_diff_friend_modifier_dwe: "The Duke of Devonshire seems particularly keen on the construction industry."
NYDD_ENG_diff_friend_modifier_stl: "Northern Act"
desc_NYDD_ENG_diff_friend_modifier_stl: "The Duke of Stirling always opens doors to northerners."
NYDD_ENG_diff_friend_modifier_wles: "War Act"
desc_NYDD_ENG_diff_friend_modifier_wles: "War, war never changes."
NYDD_ENG_more_friend_tt: "A bill on whether commoners may enter Parliament has been submitted. Around this argument, fierce debate erupted in Parliament.\n"
NYDD_ENG_more_than_republic_tt: "Modifier '§YJourney of Rebirth§!' is replaced with '§YVoice of the Republic§!', with additions:\nStability Cost Modifier: §G-25.0%§!\nReform Progress Growth: §G+25.0%§!\n"
NYDD_ENG_more_than_republic_modifier: "Voice of the Republic"
desc_NYDD_ENG_more_than_republic_modifier: "Let the people speak; the sky won't fall."

NYDD_ENG_republic_live_title: "The Republic Endures"
NYDD_ENG_republic_live_desc: "In the end, the republican system prevailed in the election, becoming the people's choice. Long live the Republic!"
NYDD_ENG_iron_fist_title: "Iron Fist Politics"
NYDD_ENG_iron_fist_desc: "Facts prove that naively trusting Parliament is not advisable. Our president has decided to adopt iron fist politics, silencing Parliament."
NYDD_ENG_silence_age_title: "The Silent Age"
NYDD_ENG_silence_age_desc: "The era when Parliament was silenced is called the Silent Age. The president does as he pleases, though the president claims it is all for dedication to the nation."
NYDD_ENG_death_of_republic_title: "Death of the Republic"
NYDD_ENG_death_of_republic_desc: "Good heavens, the president will eventually leave us, leaving behind a mess. Does this mean the republic is already dead?"
NYDD_ENG_grand_parliament_title: "The Republic Immortal"
NYDD_ENG_grand_parliament_desc: "The departure of the former president does not mean the end of an era. His successor, the new president, will carry on the will of the republic, continuing to dedicate everything to the nation until death parts them."

NYDD_ENG_republic_live_modifier: "Republican Spirit"
desc_NYDD_ENG_republic_live_modifier: "This is the best of times."
NYDD_ENG_republic_live_tt: "Unlocks decision '§YChoose Political Ideal§!', each §Ypresident§! can choose a political ideal of theirs.\n"
DD_ENG_rep_choose_ideal_title: "£adm£Choose Political Ideal"
DD_ENG_rep_choose_ideal_desc: "Everyone has ideals. President, what is your ideal?"
DD_ENG_rep_choose_ideal_ttt: "The current president has not yet chosen a political ideal"
DD_ENG_rep_choose_ideal_tt: "The president will choose a political ideal and strive for it as a lifelong vision. However, perhaps they need not decide on an ideal too early. §YAfter all, once an ideal is set, it cannot be changed.§!\n"
NYDD_ENG_iron_fist_modifier: "Powerful President"
desc_NYDD_ENG_iron_fist_modifier: "This is also the worst of times."
NYDD_ENG_iron_fist_tt: "While the above modifier exists, §Mre-election§! additionally grants §G5.0§! §ODevotion§!.\n"
NYDD_ENG_silence_age_modifier: "Iron Curtain"
desc_NYDD_ENG_silence_age_modifier: "Quiet. You only need to learn to be silent." 
NYDD_ENG_silence_age_tt: "Recently, there seem to be some newcomers in Parliament…\n"
NYDD_ENG_death_of_republic_tt: "§GRemoves§! the natural decay of the government mechanic '§ODevotion§!'.\n\nNew rulers gain §G+25.0§! §ODevotion§!.\n\n§YRe-election§! grants §G+10.0§! §ODevotion§!.\n"
NYDD_ENG_grand_parliament_tt: "In the end, the republic survived. §RHowever, is that really so?§!"

NYDD_ENG_german_king_title: "Unexpected King"
NYDD_ENG_german_king_desc: "A German king from the Low Countries, who attracted Parliament's attention with his excellent charm."
NYDD_ENG_hre_dip_title: "Holy Diplomacy"
NYDD_ENG_hre_dip_desc: "The Holy Roman Empire's fate is tightly bound with ours, inseparable. We must do our diplomatic work well, hoping one day to return to the Empire."
NYDD_ENG_new_compitor_title: "Compete for the Throne"
NYDD_ENG_new_compitor_desc: "We have a legitimate claim to the Holy Roman Empire. Thus we must strive to contest the throne, or perhaps take it by physical means."
NYDD_ENG_backing_home_title: "The Lion's Homecoming"
NYDD_ENG_backing_home_desc: "Swabia, your emperor has returned."
NYDD_ENG_hre_empoper_title: "New Emperor Enthroned"
NYDD_ENG_hre_empoper_desc: "A new emperor is enthroned, a new Iron Century is about to begin, and it will never end."
 
NYDD_ENG_german_king_ttt: "Has completed the event '§YThe Fate of the Netherlands§!'"
NYDD_ENG_german_king_modifer: "Unexpected King"
desc_NYDD_ENG_german_king_modifer: "No one expected a German to become king."
NYDD_ENG_hre_dip_tt: "Each level of £dip£ advisor grants §G+10§! elector preference.\n"
NYDD_ENG_hre_dip_modifier: "Imperial Diplomacy"
desc_NYDD_ENG_hre_dip_modifier: "Our diplomatic network extends in all directions."
NYDD_ENG_hre_dip_tt2: "As tensions between us and the Empire grow, some suggest we use the king's special identity to rejoin the Empire. This might help us make some small moves from within the Empire.\n"
NYDD_ENG_new_compitor_ttt2: "The Holy Roman Empire now has free election"
NYDD_ENG_new_compitor_ttt: "electors support us as emperor"
NYDD_ENG_new_compitor_modifier: "Striving for the Imperial Throne"
desc_NYDD_ENG_new_compitor_modifier: "To become emperor, we will spare no cost."
NYDD_ENG_new_compitor_modifier2: "Re-proclaim the Holy Roman Empire"
desc_NYDD_ENG_new_compitor_modifier2: "The Holy Roman Empire has perished; we must rebuild our empire."
NYDD_ENG_backing_home_modifier: "German Brotherhood"
desc_NYDD_ENG_backing_home_modifier: "Oh, brother, always brothers."
NYDD_ENG_hre_empoper_modifier: "Song of the Germans"
desc_NYDD_ENG_hre_empoper_modifier: "Fatherland above all!"

NYDD_ENG_netherland_problem_title: "Low Countries Negotiation"
NYDD_ENG_netherland_problem_desc: "Although the Low Countries are our king's territory, she obviously also belongs to the Holy Roman Empire. And we are obviously just a kingdom outside the Empire. Therefore we must negotiate well, whether to appease the Low Countries or the Empire."
NYDD_ENG_loyaty_ned_title: "Forever Loyal"
NYDD_ENG_loyaty_ned_desc: "Thanks to our previous experience in the Low Countries commissioner districts, this time we have introduced loyalty trials, ensuring the Low Countries remain forever loyal to us."
NYDD_ENG_german_culture_title: "Cultural Echo"
NYDD_ENG_german_culture_desc: "Our king is German, and our court is full of German fashion. Perhaps we are Germans too?"
NYDD_ENG_a_new_empire_title: "A New Empire"
NYDD_ENG_a_new_empire_desc: "We combined Britain and the Holy Empire, innovatively proposing the concept of Holy Britannia. This concept was quickly accepted by many and believed to be true."

NYDD_ENG_netherland_problem_ttt: "10 years have passed since the event '§YThe Fate of the Netherlands§!'"
NYDD_ENG_netherland_problem_tt: "§GRemoves§! modifier '§YLow Countries Unrest§!'.\n"
NYDD_ENG_loyaty_ned_modifier: "Low Countries Granary"
desc_NYDD_ENG_loyaty_ned_modifier: "The Low Countries' harvest is truly delightful."
NYDD_ENG_a_new_empire_tt: "See the eagle banner fluttering in the wind, our Holy Empire is powerful and fascinating. From London to Rome, there is not an inch that is not imperial land. The Empire is above all.\n"
NYDD_ENG_loyaty_ned_tt: "Thanks to the Low Countries' grain, we will §Geliminate§! the possibility of the disaster '§YPeasant Uprising§!' occurring.\n"
NYDD_ENG_german_culture_tt: "Who we are is for us to decide.\n"


