DD_franch_aspect_adm_1_king: "Royal Appointment"
desc_DD_franch_aspect_adm_1_king: "The King can directly appoint bishops, achieving an autonomous church.\n\nWhen constructing §YChurches§! buildings, there is a §G+50.0%§! chance to gain §G1§! tax base.\n§g(Once per province)§!\n"
DD_franch_aspect_adm_2_roma: "Submission to Rome"
desc_DD_franch_aspect_adm_2_roma: "We have to acknowledge the jurisdiction of Rome, and bishops are still decided by Rome.\n\nMutual §G+25.0§! opinion with all existing known §YRoman Catholic§! countries.\n"
DD_franch_aspect_adm_3_election: "Bishop Nomination"
desc_DD_franch_aspect_adm_3_election: "Our domestic bishops are nominated by the King, and then the Pope selects one from a list provided abroad, which undoubtedly appeases both the domestic realm and Rome.\n\n§YChurch§! buildings additionally grant the province §G-1.00§! unrest.\n"

DD_franch_aspect_adm_2_roma_op: "Submission to Rome"
DD_franch_aspect_adm_3_election_modifier: "Bishop Nomination"
desc_DD_franch_aspect_adm_3_election_modifier: "Bishop nomination makes the bishops happier, and this church is also more convincing to the people."

DD_franch_aspect_dip_1_expand: "Patronize Monasteries"
desc_DD_franch_aspect_dip_1_expand: "Our domestic monasteries cannot survive without Rome, and it is necessary for us to patronize these monasteries to help them better fulfill Christ's will.\n\nWhen §YCelebrating§!, a random §Y1§! §Ystate religion§! province with a §YChurch§! building under our rule gains §G1§! tax base.\n"
DD_franch_aspect_dip_2_reform: "Reformation Diplomacy"
desc_DD_franch_aspect_dip_2_reform: "In the wave of reform, we cannot stand aside. Comparatively, we all have a similar goal — Rome.\n\nWhen §YCelebrating§!, mutual §G+10.0§! opinion with §YProtestant§!, §YReformed§!, §YAnglican§!, and §YImperial Catholic§! countries. §g(Maximum §G+100.0§!)§!\n"
DD_franch_aspect_dip_3_free: "Freedom of Faith"
desc_DD_franch_aspect_dip_3_free: "Our domestic religious composition is complex and diverse, and it is necessary to grant them the right to free belief. This is also for the stability of our nation.\n\nWhen §YCelebrating§!, we will gain §G+1§! stability or §G25§!£adm£.\n"

DD_franch_aspect_dip_2_reform_tt: "Mutual §G+10.0§! opinion with §YProtestant§!, §YReformed§!, §YHussite§!, §YAnglican§!, and §YImperial Catholic§! countries.\n"
DD_franch_aspect_dip_2_reform_op: "Reformation Diplomacy"

DD_franch_aspect_mil_1_holywar: "Eradicate Heresy"
desc_DD_franch_aspect_mil_1_holywar: "In the wave of the Reformation, there are simply too many heretics, and heavy cavalry must be sent to send them all to heaven.\n\nEnables the casus belli \"§YCleanse Heresy§!\" against §YHeretic§! countries (§G75.0%§! aggressive expansion and warscore cost).\n"
DD_franch_aspect_mil_2_kinght: "Patronize Knightly Orders"
desc_DD_franch_aspect_mil_2_kinght: "The knightly orders need funding for modernization, and since we have money, let's sponsor them a little.\n\nWhen §YDeclaring War§!, we will gain §G+10.0%§! cavalry combat ability for §Y5§! years. §g(Refreshes, does not stack)§!\n"
DD_franch_aspect_mil_3_free: "War Blessing"
desc_DD_franch_aspect_mil_3_free: "The Church has decided to support our righteous cause. For this, we can rightfully levy war taxes.\n\nWhile at §YWar§!, we will gain §G+10.0%§! national tax modifier.\n"
DD_franch_aspect_mil_1_holywar_modifier: "Eradicate Heresy"
desc_DD_franch_aspect_mil_1_holywar_modifier: "War, a performance art."
DD_franch_aspect_mil_3_free_modifier: "War Blessing"
desc_DD_franch_aspect_mil_3_free_modifier: "The Church has decided to support our righteous cause."
DD_franch_aspect_mil_2_kinght_modifier: "Knightly Order Support"
desc_DD_franch_aspect_mil_2_kinght_modifier: "The knights of the order have arrived on the battlefield."

oversea_catholic: "Outremer"
oversea_catholic_religion_desc: "Outremer Christianity is in fact a self-reform of the Patriarchate of Jerusalem, a new denomination that merged with the Eastern Catholic Churches and numerous local Eastern sects, tolerating and incorporating many traditions that Orthodoxy considers heretical or even pagan. It is effectively a syncretic faith that emerged after the overseas crusader kingdoms ruled the region for hundreds of years, and was accepted by the local peoples. This denomination even revived certain Gnostic doctrines, advocating for the religious unity and harmony of Eastern peoples, and is led by an elected Patriarch of Jerusalem."

