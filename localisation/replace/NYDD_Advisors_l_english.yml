fu_city_planner: "City Planner"
fu_city_planner_desc: "Planning and controlling the construction, growth, and development of towns and other urban areas is no easy task. An experienced city planner will work wonders in expanding our current and future infrastructure."

fu_cartographer: "Cartographer"
fu_cartographer_desc: "Cartographers study, design, draw, and distribute conventional maps with textual labels, as well as charts used for exploration, maritime surveying, and commercial clients."