l_english:
# Acknowledgements
LOADING_TIP_0:0 ""The Dream yet to be Dreamed" was originally conceived as a worldline where the Crusades were a resounding success; the current scenario of a total Mongol victory is not representative at all."
LOADING_TIP_1:0 "Blade Chanter, the author of "Alexiad: Komnenos' Glorious Finale", created the content for Thessaly and Thessalonica for this mod. Many thanks!"
LOADING_TIP_2:0 "The vast majority of the text and part of the design in "The Dream yet to be Dreamed" was written by Medici. (This tip was absolutely not written by him)."
LOADING_TIP_3:0 "Most mission descriptions and modifier descriptions in "The Dream yet to be Dreamed" were written by NewYoung, purely for your amusement!"
LOADING_TIP_4:0 ""The Dream yet to be Dreamed" — a grand stage. If you have a dream, come on up."
LOADING_TIP_5:0 "In "The Dream yet to be Dreamed", some nations have special unit types available at certain tech levels. Have you discovered them?"
LOADING_TIP_6:0 "In "The Dream yet to be Dreamed", development provides more force limit, making AI nations stronger and more aggressive than in vanilla. To balance this, vassals suffer double the penalty."
LOADING_TIP_7:0 "When you have the chance to make a choice, don't let yourself regret it."
LOADING_TIP_8:0 "In "The Dream yet to be Dreamed", you can choose to directly administer provinces in the New World yourself, or release colonial nations as in vanilla. The AI will always choose to release colonial nations."
LOADING_TIP_9:0 "If you find a bug or have feedback, feel free to join our community Discord "Nolexios' EU4 Mods" to report it."

# Holy Roman Empire
LOADING_TIP_10:0 "The Swabians are always asking why there's no Swabian update in the Iron Century version."
LOADING_TIP_11:0 "After the defeat in the North-South War of 1324, the princes of North Germany were expelled from the Holy Roman Empire."
LOADING_TIP_12:0 "The Hohenstaufen once had the chance to bring the Empire toward unification, until the North-South War caused their rule to gradually fall apart."
LOADING_TIP_13:0 "As Joan of Arc's second-in-command, Jan Žižka was a famous war hero against the Hussite heresy. Yes, Jeanne d'Arc went to Bohemia to fight in the Hussite Wars."
LOADING_TIP_14:0 "Unlike the tricolor that represents Prussia and the Hanseatic League in reality, the German flag in "The Dream yet to be Dreamed" represents Brandenburg, Saxony, and the Hanseatic League, symbolizing unity, nobility, and unification."
LOADING_TIP_15:0 "Lombardy's Republican, Imperial, and Templar paths each have different unique end-game disasters. Hope you enjoy them!"
LOADING_TIP_16:0 "Frederick II made the groundbreaking choice to marry the Sultan of Egypt, accomplishing the great deed his grandfather could not."
LOADING_TIP_17:0 "The Lombard League was originally just an alliance against the Emperor, and later developed into an unstable political entity. In reality it remained decentralized; its in-game representation is just for gameplay convenience."
LOADING_TIP_18:0 "The Hanseatic League is a loose confederation. If the North German Confederation dissolves, they will follow suit and meet the same fate."
LOADING_TIP_19:0 "Most of Brandenburg's unique mechanics only appear after unifying Germany. Don't stop at Germany — keep your ambitions high!"

# North Africa
LOADING_TIP_20:0 "Besides the three starting Taifas, there is actually a hidden Taifa in Iberia..."
LOADING_TIP_21:0 "The union of Africa and Sicily created the present kingdom of North Africa, which carries the bloodlines of both Rodrigo "El Cid" and Roger of Sicily."
LOADING_TIP_22:0 "Fez and Algiers also have their own exclusive mission trees. They are not just Morocco and Tlemcen starters!"
LOADING_TIP_23:0 "Africa's Third Great Muslim Uprising can be avoided through the mission "Forge a New Nation"! But if you want to experience it, it's actually richer than the Second Great Muslim Uprising."
LOADING_TIP_24:0 "Genoa invested heavily in supporting Africa, and in return gained many trading posts in North Africa."
# LOADING_TIP_25:0 "You can use the ledger to compare your country's economic and military power against others."
# LOADING_TIP_26:1 "When relieving a besieged Fort, your armies will be treated as the defenders."
# LOADING_TIP_27:0 "High Stability increases your chances of inheriting countries you are in a Personal Union with."
# LOADING_TIP_28:1 "Don't use up all your Administrative Power while at war.\nYou may need some to core any provinces you take."
# LOADING_TIP_29:0 "All trade modifiers are listed and explained in the Trade screen for your country."

# Scandinavia
LOADING_TIP_30:0 "In 1066, Harald defeated Harold and split England with William, establishing the Second North Sea Empire."
LOADING_TIP_31:0 "The North Sea Empire spent everything to maintain their colonies in North America, though the cost was steep."
LOADING_TIP_32:0 "The North Sea Empire's fervent spread of Christianity provoked discontent among Swedish Norse believers, who went the opposite way, resisting Christianity and spreading pagan faith everywhere."
# LOADING_TIP_33:0 "The more autonomous your provinces are, the less tax and manpower you will get from them."
# LOADING_TIP_34:0 "Sending Light Ships to Protect Trade will increase your Naval Tradition."
# LOADING_TIP_35:0 "Naval Tradition increases your Trade Steering."
# LOADING_TIP_36:0 "Assigning a leader with maneuver to a fleet that is Protecting Trade will increase its efficiency."
# LOADING_TIP_37:0 "Your troops may suffer increased attrition during winter."
# LOADING_TIP_38:0 "The number of monthly reinforcements is tied to your army maintenance slider."
# LOADING_TIP_39:0 "Rulers and heirs that command an army may die in battle.\nThink twice before assigning them!"

# France
LOADING_TIP_40:0 "The disastrous defeat of the Albigensian Crusade made Southern France part of the Holy Roman Empire, and led to the Anjou governor being elected King of France."
LOADING_TIP_41:0 "France's opening execution event is actually the end of the story — it's told in reverse! If you dislike this ending like Sylvia does, Picardy might have a way to change it."
LOADING_TIP_42:0 "France has four different paths, meaning you can play through multiple times!"
LOADING_TIP_43:0 "Brittany is EDG crossover content, but Jeanne's mother is no longer someone resembling Joan of Arc but rather Prelati! (Yes, a female Prelati.)"
LOADING_TIP_44:0 "In the French Civil War, the Five Provinces Alliance of England joined with the Low Countries to defeat France, forcing it to sign the Magna Carta and granting the Five Provinces autonomy."
# LOADING_TIP_45:0 "Don't take too much land at once.\nOverextension means trouble on the horizon!"
# LOADING_TIP_46:0 "Overextension increases the costs of raising Stability."
# LOADING_TIP_47:0 "Lower Religious Unity will increase unrest in your provinces."
# LOADING_TIP_48:0 "Overseas colonies will not add to Overextension.\nBut conquered cities will!"
# LOADING_TIP_49:0 "Blockading enemy ports not only hurts their province income, but also their Trade Power."

# Iberia
LOADING_TIP_50:0 "The Kharijites still stand alone in a world where Arabia has fallen, calling themselves the last imperial navy."
LOADING_TIP_51:0 "The three pirates of the Balearics each have their own characteristics. Though they were originally designed as easter eggs, they're worth a try if you're skilled!"
LOADING_TIP_52:0 "Asturias has three heirs — Carlos the eldest, Alfonso of León, and Enrique of Castile — each representing a different path!"
LOADING_TIP_53:0 "Rumor has it that Navarra's spymaster Skovinsen secretly controls intelligence across the entire world..."
LOADING_TIP_54:0 "Sancho of Galicia saw a vast blue sea in his dreams — that was his far horizon."
# LOADING_TIP_55:0 "Coalitions can be a very powerful tool to counter a superior foe."
# LOADING_TIP_56:0 "Don't rush into action, make sure you know your foe's friends and enemies before declaring war. They can be useful to achieve your goals."
# LOADING_TIP_57:0 "Armies, navies and advisors become more expensive over time.\nMake sure your economy grows enough to keep supporting them."
# LOADING_TIP_58:0 "Constructing buildings can greatly increase the value of your provinces."
# LOADING_TIP_59:0 "The value of trade goods directly increases the production income from a province."

# Balkans
LOADING_TIP_60:0 "Croatia is a patchwork state ruled jointly by Venetian nobles, Norman landowners, and Hungarians — not as strong as it looks."
LOADING_TIP_61:0 "The Teutonic Knights, returning from the Holy Land, accepted Hungary's offer to fight alongside the Order of the Dragon for generations against the Cumans."
LOADING_TIP_62:0 "Facing heavy Latin taxation, the citizens of Constantinople angrily expelled the Latins in 1444 and established a provisional committee."
LOADING_TIP_63:0 "In the Hungarian succession crisis, you can choose Nitra, Bohemia, Transylvania, the Teutonic Order, and others, depending on the current world situation."
LOADING_TIP_64:0 "Albrecht of Habsburg campaigned alongside his father-in-law Sigismund and was elected Grand Master of the Teutonic Order. As a result, his cousin Frederick became Count Palatine of the Rhine."
LOADING_TIP_65:0 "The Habsburgs' assistance to the Emperor in the First North-South War earned them the title of Count Palatine of the Rhine, and they served as hereditary court stewards assisting the Emperor."
# LOADING_TIP_66:0 "Fighting an expensive war?\nDon't be afraid to raise War Taxes or take out a Loan."
# LOADING_TIP_67:0 "Each group of National Ideas has a unique set of random events associated with it. Some of them are helpful, some are not."
# LOADING_TIP_68:0 "The Holy Roman Emperor may appoint new Electors if there are fewer than seven."
# LOADING_TIP_69:0 "It's not possible to assault a fort before its walls have been breached."

# Eastern Europe
LOADING_TIP_70:0 "Thanks to the Mongols, the Rus were forced to unite under the rule of the Grand Prince of Kiev."
LOADING_TIP_71:1 "After being invaded by the North Sea Empire, Novgorod became a gathering place for fleeing Norse believers and was called "Holmgard.""
LOADING_TIP_72:0 "The Poles lost to the Prussians yet again. Fortunately they called on the Hanseatic League for support, otherwise the consequences would have been unimaginable."
LOADING_TIP_73:0 "A Grand Duke named Mindaugas resolutely converted to Christianity, and after being crowned King of Lithuania, allied with the Livonian Order against the other pagan dukes."
LOADING_TIP_74:0 "War Exhaustion only goes away slowly while at peace and not at all while at war."
# LOADING_TIP_75:0 "Keep an eye out for coalitions. Stumbling into a war with most of your neighbors can be dangerous."
# LOADING_TIP_76:1 "You can not only forge a claim on adjacent provinces, but also on all provinces sharing a sea-zone with one of your cores."
# LOADING_TIP_77:0 "Many common actions have hotkeys.\nCheck the tooltips to find out what they are."
# LOADING_TIP_78:0 "Use Control plus a number key to assign a selected unit to a control group. Hit the number key alone to instantly select the unit in question."
# LOADING_TIP_79:1 "Manpower recovers slowly. Consider hiring Mercenary Companies to conserve Manpower."

# HRE 2
LOADING_TIP_80:0 "The Hohenstaufen's centralized rule in the Empire effectively made the Holy Roman Imperial throne hereditary for them."
LOADING_TIP_81:0 "In 1500, the Holy Roman Emperor may issue the "Heinrich Act", causing the Second Great Christian Schism. Don't worry — even if the Holy Roman Empire dissolves, the Protestant Reformation will still trigger normally."
LOADING_TIP_82:0 "At the Council of Constance convened in 1414, Jan Hus and the reformist faction advocating church reform gained the upper hand, and the council ultimately adopted a moderate stance."
# LOADING_TIP_83:0 "High level forts are virtually unsiegeable without artillery. Make sure you bring enough firepower."
# LOADING_TIP_84:0 "Moving an army to a rebellious province may considerably reduce the local unrest."
# LOADING_TIP_85:0 "You may use your fleet to block your enemy from crossing a strait."
# LOADING_TIP_86:0 "You can find your screenshots from the game here: ../Documents/Paradox Interactive/Europa Universalis IV/Screenshots"
# LOADING_TIP_87:0 "Press F11 to save a screenshot of the game."
# LOADING_TIP_88:0 "Hold down shift while giving orders to a unit to create a custom path."
# LOADING_TIP_89:0 "You can delete saves in-game by clicking the delete button on a save game."

# Miscellaneous
LOADING_TIP_90:0 "Theodore I led many nobles and retainers onto a great fleet to escape the fires of the Fourth Crusade. After encountering a storm, this fleet split into three and arrived in West Africa."
LOADING_TIP_91:0 "Soga no Ishikawa's defection caused Emperor Kotoku and the Soga to split east and west. His grandson inherited the Kikuza bloodline to rule the western provinces, while the eastern provinces under the Emperor were led by the rising Fujiwara clan."
LOADING_TIP_92:0 "The Fatimid legitimate Imam Tayyib did not fall victim to al-Majid; instead, after his father was assassinated by the Nizari, he was sheltered by the Sulayhid dynasty of Yemen. This sect became known as Tayyibiyya."
LOADING_TIP_93:1 ""
LOADING_TIP_94:0 "The Ottoman Empire is not the strongest nation in the game. If you're a beginner, definitely don't play them."
# LOADING_TIP_95:0 "Very Easy is suitable for beginners who feel that Normal is too challenging."
# LOADING_TIP_96:0 "At Hard difficulty, the AI is as skillful as possible with almost no cheats."
# LOADING_TIP_97:0 "At Very Hard difficulty, the AI is as skillful as possible and has a lot of cheats to make playing even major nations a challenge."
# LOADING_TIP_98:1 "Use terrain to your advantage! Place your armies so that if attacked,\nthe attacker gets river crossing or difficult terrain."
# LOADING_TIP_99:0 "An army besieging a fortress in enemy territory will be counted as the attacker in a battle when attacked, incurring terrain penalties."
# LOADING_TIP_100:0 "This game takes a long time to master, don't be surprised to be learning new things after playing a thousand hours."
# LOADING_TIP_101:0 "You might lose a battle (or more), but still win the war.\nIt's often worth fighting on after suffering initial setbacks in a war."