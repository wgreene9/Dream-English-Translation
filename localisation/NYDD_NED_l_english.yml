#Effect: If on the Imperial path, form the Low Country Imperial Circle, enact Tier 1 reform "Imperial Circle," noble influence -10%, national manpower modifier +10%, unrest +1, Parliament enabled, dynasty locked, no heir, Imperial governance abilities enabled: Levy Taxes (gain half-year income), Conscript Labour (gain 20% of manpower cap), Request Aid (recruit infantry equal to 15% of army cap in capital), each usable once per year, at the cost of paying Imperial tax to the Emperor each year—the higher the development, the more paid (transferred to the Emperor's treasury). Inherit all Low Country national legacies. If on the United Provinces path, form the Dutch United Provinces Republic, move capital to The Hague, inherit all Low Country national legacies, enact Tier 1 reform "Dutch United Provinces Government," infantry combat ability +10%, production efficiency +10%, Parliament enabled, enable Stadtholder–Grand Pensionary conflict (similar to the vanilla Netherlands: below 0, a stadtholder for life with the dynasty locked to Von Nassau; above 0, a randomly generated ruler every 4 years; range -100 to +100, starting at -100. Each time a new ruler takes office, choose either to strengthen the Stadtholder or the Grand Pensionary, with a shift of 10 points).

DD_NED_15_t:"The Man Behind the Curtain"
DD_NED_15_d:"Daniel knocked sleepily on the door of the Stadtholder's office. Though as Secretary of State he was always ready to serve his country, being summoned at this hour was rather taxing. But when he pushed open the door, all his drowsiness swept away like a summer evening breeze, replaced by a chill that cut to the bone.\n\nThe midnight wind poured through the open window, and the silk curtains danced wildly in the cold moonlight, filtering the pale silver glow through the mesh and mingling it with the candlelight on the desk. Upon the old table stood only a single candlestick, its dim flame flickering in the quivering lunar breeze, casting the Stadtholder's shadow long and thin as a clock hand, pointing straight toward the silver radiance beyond the window.\n\n'Daniel, come here.' Hendrik set down his pipe and beckoned to Daniel. The faint candlelight revealed half of his face from the shadows, startling Daniel. Wrinkles like spiderwebs had spread across his features; it was as though some demon had stolen the Stadtholder's life and emotion, leaving behind only a cold, hardened, aged visage.\n\n'This list,' he said, handing Daniel a thin sheet of paper as light as a feather, 'deliver it to the military. Tell them to deal with these names within three days at most—dig deep, go after their families too. There must be someone behind them.' 'This… so many? And so many Low Country nobles—' 'Daniel,' the Stadtholder slowly set down his pen, those cold eyes staring straight at him from beneath the shadow of the moonlight, and spoke in a tone utterly flat, utterly indifferent, utterly devoid of feeling—"
DD_NED_15a:"'Daniel, you had best get to it.'"
#Effect: Leave the Empire, gain 500 ducats, all Low Country provinces gain 20 devastation, gain modifier "Uprooted" for 10 years, noble loyalty equilibrium -10%, noble influence -20%, unrest +1, monthly autonomy -0.05. One month later, trigger event "The Broken Scales."
DD_NED_15a_modifier:"Uprooted"
desc_DD_NED_15a_modifier:"No one is spared."
DD_NED_16_t:"The Broken Scales"
DD_NED_16_d:"Hendrik van Nassau stood calmly before the villa, engulfed in flames, leaning on a silver-handled walking stick. Squad after squad of soldiers rushed past him and poured into the building. An elaborately dressed old man was dragged out in ropes, his fine robes stained with traces of his own blood.\n\n'Hendrik! Have you gone mad, have you gone mad! I am the Speaker of the Netherlands! I—' Before the cursing old man could lift his head toward him, Hendrik swung his copper-headed cane, now somewhat rusted, and struck him full across the face, sending several bloodied teeth flying into the air. He drew his sword from his waist and thrust it deep into the Speaker's thigh, then pulled it out without mercy amid his agonised howls.\n\n'Lamal van Egmont,' he said, the crimson flames casting his sharp-featured face in ruddy light, like a blade beneath the forge, 'you are sentenced to death for treason, corruption, bribery, and sedition.' 'Base slander! I never—'"
DD_NED_16a:"'Execute him immediately.'"
DD_NED_16a_tt:"All provinces of §Gloyal§! subject states will be ceded to us, and will receive the following effects:"
DD_NED_16a_tt2:"The government mechanic '§YStadtholder vs. Grand Pensionary§!' will be locked at §R-100§!.\n"
DD_NED_16a_modifier:"Eternal Stadtholderate"
desc_DD_NED_16a_modifier:"All men must die…"
#This modifier also enhances the progress bar effect when at -100.
#Effect: Remove modifier "Republican League," gain modifier "Eternal Stadtholderate," Stadtholder vs. Grand Pensionary will remain permanently at -100, administrative efficiency +5%.

DD_NED_17_t:"The End of Madness"
DD_NED_17_d:"Hendrik knew that his end would come someday, but he had never expected it so soon. He felt great gulps of foul air drawn into his lungs, only to be met with the sweet, cloying taste of blood rising in return. The searing pain and icy cold radiated from the bloody wound in his chest—his time was running out.\n\nHe saw more men approaching with guns raised, so he snatched the reins from the hapless coachman, kicked his lifeless body off the carriage, and, fighting through the pain, whipped the horses onward. The rushing wind grew fierce, as if left behind by him, making him feel as though everything was still firmly in his grasp. Yet he felt his soul and consciousness fleeing this ageing prison with the gale, racing toward heaven—or in the opposite direction.\n\nAt last, a scarred hand released the reins. The speeding carriage, like a wild horse unbridled, plunged headlong into the surging river and shattered apart."
DD_NED_17a:"It is over."
#Effect: Current ruler dies. Remove modifier "Eternal Stadtholderate." Reset Stadtholder vs. Grand Pensionary value to 0. Enable government abilities (design as you wish, or adapt from ABE). One month later, trigger event "Legacy of the Republican League."
DD_NED_18_t:"Legacy of the Republican League"
DD_NED_18_d:"With the 'Eternal Stadtholderate' and the mad, contradictory dictator Hendrik ascending to heaven—or perhaps the underworld—amid an assassination, the already hollow Republican League finally collapsed entirely. The supporters of the Prince of Nassau and the republicans turned against each other, evolving into a conflict and balance of power between the Stadtholder and the Grand Pensionary factions.\n\nThe Republican League, once united by the ideal of liberty, had now irrevocably marched toward ruin. The Prince of Nassau, backed by the monarchist old nobility, and the Grand Pensionary, supported by the Low Country plutocrats and republicans, became the two polarising political forces tearing the Dutch government apart. The social disorder wrought by their clashes would eventually subside, but this protracted confrontation would long cast its shadow over the Low Countries."
DD_NED_18a:"All leagues and unions are forged only to be broken."
DD_NED_18a_tt:"Until the mission '§YFree Debate§!' is completed, if the §Mbalance of power§! exceeds §Y+60§! or falls below §Y-60§!, the nation will suffer §Mnational unrest penalties§!.\n"
DD_NED_18a_tt2:"Completing the missions '§YDeal with the Governors§!' and '§YFree Debate§!' will §Gweaken§! and remove this modifier.\n"
DD_NED_18a_modifier:"Legacy of the Republican League"
desc_DD_NED_18a_modifier:"After the death of the 'Eternal Stadtholder,' the power vacuum in the Netherlands allowed many particularist forces to rise."
DD_NED_18a_modifier2:"Legacy of the Republican League"
desc_DD_NED_18a_modifier2:"The tide of particularism in the Netherlands has been suppressed."
#Effect: From now on, if the Stadtholder–Grand Pensionary conflict falls below -70 or exceeds +70, it will cause +3 unrest, but each extreme will also grant a buff (to be designed—ideas welcome). Completing the mission "Union of the Seventeen Provinces" requires the balance to be between -30 and +30.
DD_NED_19_t:"Singing in the Rain"
DD_NED_19_d:"Aldo held an umbrella black as night, pushing through the unbroken curtain of rain. Before the gates of The Hague Opera House, a warm orange glow radiated from the splendid doors, mingling with the strains of melodious music, setting the scene apart from the cold, rain-soaked world outside.\n\nHe folded his umbrella, his damp boots treading upon the marble floor with a hollow echo. The umbrella still dripped steadily, leaving a wet, narrow trail that wound its way toward the opera's private box. With one hand holding the umbrella and the other removing his hat and pressing it to his chest, he paused before the door, then knocked gently.\n\n'Your Highness, it is all finished.' He kept his head bowed, yet his gaze slanted toward the prince lounging on the sofa. Upon the box's table lay a plate of lustrous fresh fruit, beside it a flute of bubbling champagne. Golden liquid, dotted with pearl-like bubbles racing up the slender glass, appeared untouched. Joachim crossed one leg over the other; on stage, an Italian tenor was singing the highest, clearest note of the night.\n\n'Finished? Are all those in Brabant dealt with? What about their children?' Joachim asked without turning his head. 'Yes, Your Highness, all of them.' The prince clapped lightly, squinting with appreciation at the bel canto echoing beneath the vaulted ceiling."
DD_NED_19a:"'Well done. Let Erwin carry on with tomorrow's work.'"
#Effect: Gain 500 ducats. All Low Country provinces gain 20 devastation. Gain modifier "Uprooted" for 10 years: noble loyalty equilibrium -10%, noble influence -20%, unrest +1, monthly autonomy -0.05. Remove modifier "Republican League." One month later, trigger event "Saviour at Dusk."

DD_NED_20_t:"Saviour at Dusk"
DD_NED_20_d:"An old man with frost-white hair leaned against a withered tree stump on the hillside, surrounded by empty beer bottles. The golden slanting sunlight poured down in dappled twilight hues, filtering through the murky glass and flashing before the old man's eyes a world of dreams. A half-empty bottle, its shallow surface glistening, rolled slowly down the slope, coming to rest at the feet of the assembled knights.\n\n'So you've finally found me.' The old man raised his face slightly, feeling the gentle evening breeze brush past his cheeks, and squinted with contentment, paying no heed to the knights drawing their swords and closing in around the hill. Below the slope, in the flower fields, clusters of blossoms on the verge of withering still danced wildly in the wind beneath the fiery twilight, stubbornly striving to sound a perfect, flawless high note for the final movement of their lives.\n\n'Hey, you there,' the old man propped himself up with his scabbard and drew his slender blade like a flash of lightning, pointing it at the knight-commander beneath the fluttering eagle banner. 'Cross swords with me—give my life a curtain call worthy of honour.' But the knights merely stepped forward in silence, their longswords gleaming coldly. 'Ha—hahahaha, the Empire's knights, afraid?' The old man burst into wild laughter beneath the westering sun, his neatly trimmed silver beard trembling like pine needles. He twirled his sword in an elegant flourish, then lightly rested it against his own throat; the bright silver blade glowed with a rosy-gold sheen in the orange-red sunset. 'No matter—then let God be the witness—'"
DD_NED_20a:"'—and see whose ideal is the nobler one.'"
DD_NED_20a_modifier:"Death of Freedom"
desc_DD_NED_20a_modifier:"There are ideals worth defending with one's life."
#Effect: Gain modifier "Death of Freedom" for 10 years: years of separatism -10, unrest -3, tolerance of the true faith +1, gain 1 stability. One month later, trigger event "The Constitution of Brussels."
DD_NED_21_t:"The Constitution of Brussels"
DD_NED_21_d:"With the end of civil war and rebellion, the old Constitution of Ghent—which had disrupted the order of both Empire and Low Countries—was utterly abolished. At the behest of Prince Joachim, the autonomous Council of State of the Imperial Circle convened a new constitutional assembly in Brussels under the Empire's watch. The new constitution stipulated that the Regent would serve as Governor and sovereign of the Netherlands, ruling the Low Countries on behalf of the Emperor.\n\nThose nobles who had resisted the Empire and fomented rebellion were expelled from the Dutch government without exception, and subjected to rigorous trial and sanction. When necessary, the Governor was empowered to issue new laws and taxes in the name of both Empire and Low Country government, while the autonomous Council of State would serve only in an advisory and representative capacity, no longer able to interfere with the government as forcefully as before."
DD_NED_21a:"Thus the Low Countries are at peace."
DD_NED_21a_modifier:"The Constitution of Brussels"
desc_DD_NED_21a_modifier:"The constitution ensures the rise of an absolute ruler."
#Effect: Remove modifier "The Constitution of Ghent." Gain modifier "The Constitution of Brussels": unrest +1, national tax modifier +10%, national manpower modifier +10%, autonomy change -0.05. One month later, trigger event "The Imperial Knights."
DD_NED_22_t:"The Imperial Knights"
DD_NED_22_d:"It was plain to see that, in the Netherlands—a land teeming with unruly subjects—the Regent's own power was far from sufficient to control the restive Low Countries. The Imperial Knights were the blade—or rather, the hounds—that the Emperor lent to the Regent to pacify the region. Composed of German knights loyal to the Hohenstaufen, the Imperial Knights embodied the supreme will of Swabia: cold, ruthless, and merciless.\n\nWith the collapse of the Republican League and the local noble factions, the Knights swiftly filled the void in the Imperial Circle's government. To fully grasp the reins of the Netherlands, the Regent could not do without the Knights; yet to loosen the leash around his own neck, he would also have to consider how to curb this dangerous double-edged sword. After all, the Knights were forever loyal to the Hohenstaufen—but not necessarily to the Hohenstaufen of the Low Countries."
DD_NED_22a:"One day…"
DD_NED_22a_modifier:"The Imperial Knights"
desc_DD_NED_22a_modifier:"The dutiful Imperial Knights loyally guard the Low Countries."
DD_NED_22a_modifier2:"The Imperial Knights"
desc_DD_NED_22a_modifier2:"The dutiful Imperial Knights loyally guard the Low Countries."
DD_NED_22a_tt:"Unlock the §M5th§! tier government reform '§YThe Imperial Knights§!' with the following effects:"
#Effect: Enable the Imperial Knights mechanic, ranging from 0 to 100. The higher the value, the greater the combat ability but also the more unrest. Each use of a government ability increases it by 10, with monthly decay of 0.5. Completing the mission "Grip the Reins" requires the value to be between 40 and 60.

DD_NED_23_t:"Self-Reflection"
DD_NED_23_d:"Joachim held the letter, still wet with ink, and pondered for a long time. When he first arrived in the Low Countries, he had thought it a comfortable posting. Clearly, the situation here had far exceeded his expectations. The Imperial Governor threw his weight around under the Empire's name. And himself? A mere stripling with no military power whatsoever! There was no way to counter him. No—before the Low Countries slid into the abyss, he had to find a way…"
DD_NED_23a:"Send a letter requesting aid."
DD_NED_23a_tt:"§RRegardless of whether the Emperor accepts or not, this move will greatly diminish §YJoachim§!'s standing in the Emperor's eyes.§!\n\n£yes£If they §Gaccept§!: §Y[Root.Capital.GetName]§! will spawn §Y4§! regiments of §Oheavy cavalry§!.\n"
DD_NED_23b:"We will find a way…"
DD_NED_23b_tt:"Unlock the mercenary company '§YImperial Knights§!'. Hiring this company does §Jnot reduce§! army professionalism.\n"
DD_NED_empire_knight_merc:"§JThe Imperial Knights§!"
DD_NED_24_t:"The Letter for Aid"
DD_NED_24_d:"Prince Joachim, Imperial Regent of the Low Countries, has sent a letter earnestly requesting that the Empire dispatch its finest knights to aid the region. The situation in the Low Countries is far graver than we had imagined—a single misstep could mean the permanent loss of these lands."
DD_NED_24a:"I will send my best knights to aid you, my child."
DD_NED_24b:"Why else do you think you were sent to the Low Countries?"
DD_NED_25_t:"The Response"
DD_NED_25_d:"The Empire has decided to aid us, dispatching knights to Antwerp to await our command."
DD_NED_25_d2:"The Empire has refused our request for aid; we must rely on our own strength."
DD_NED_25a:"So be it."
DD_NED_26_t:"Aid for the Low Countries"
DD_NED_26_d:"A terrible famine has ravaged the Low Countries of late. [From.GetName] hopes that we, in our kindness and compassion, will extend a helping hand to see them through this crisis."
DD_NED_26a:"Set aside some grain to help them."
DD_NED_26b:"Alas, we have no surplus to spare."
DD_NED_26a_tt:"\n§YThis will help the Low Countries overcome the famine more quickly.§!\n"
DD_NED_help_us_in_fame:"Aided us during the famine"
DD_NED_help_us_in_fame2:"Refused to aid us during the famine"
DD_NED_27_t:"Supplies Arrive from [From.GetName]"
DD_NED_27_d:"To our surprise, [From.GetName] has sent us some grain to help alleviate the pressure of the famine. How kind of them."
DD_NED_27a:"You are truly generous."
DD_NED_28_t:"Refusal from [From.GetName]"
DD_NED_28_d:"The envoy of [From.GetName] regretfully informed us of the unfortunate news—[From.GetName] is itself in the grip of a great crisis and cannot come to our aid. We can only offer our understanding, respect, and best wishes."
DD_NED_28a:"It is only natural."
DD_NED_29_t:"The Famine Ends"
DD_NED_29_d:"After years of natural disaster and man-made devastation, the Great Famine that had plagued the entire Low Countries finally began to recede. The soil and farmlands gradually returned to life; thanks to government relief and economic policies, agriculture in the Low Countries showed signs of recovery. The lands that had yielded no harvest due to war and calamity were now recovering from desolation, and new seeds had been sown in the reclaimed fields.\n\nYet even so, Dutch society and agriculture remained fragile after the Great Famine. Social tensions and the struggle for sustenance still plagued the land—poverty, war, and plague had not yet departed. Could this weather-beaten Low Country once again become the Empire's prosperous granary? Only time would tell."
DD_NED_29a:"At last, it is over."
DD_NED_29a_modifier:"Land Recovery"
desc_DD_NED_29a_modifier:"After the famine ended, for some reason, grain yields became even higher."

DD_NED_30_t:"The Low Countries in Turmoil"
DD_NED_30_d:"The recent chaos caused by the famine in the Netherlands has steadily weakened our grip on the Low Countries. Rumours abound that the region is secretly clamouring for autonomy and preparing to raise the banner of revolt against Hohenstaufen rule. Someone must step in to restore order and firmly stamp the royal name upon the banner of the Imperial Circle of the Low Countries. To that end, Frederick III has decided to appoint his third son, the young Prince Joachim, as Regent to investigate the situation in the Low Countries. This is not only because the Emperor himself is occupied with other matters, but also as a test for Joachim, who eagerly covets the crown."
DD_NED_30a:"May he not disappoint the Emperor."
DD_NED_30a_tt:"§YJoachim von Hohenstaufen§! will travel to @BRB§YBrabant§! to become its ruler.\n"
DD_NED_31_t:"Freedom of Friesland"
DD_NED_31_d:"As the province farthest from the feudal order and from the imperial heart of the Low Country Circle, Friesland is arguably the poorest and most backward region of the Netherlands. It is a land of marshes, where construction and development are exceedingly difficult, and effective exploitation is nearly impossible. Yet, as the saying goes, harsh lands breed fierce folk—the Frisians are valiant and combative, their fighting prowess not to be underestimated. Our envoys easily made contact with some of their mercenaries, who proved willing to swear fealty to the Empire in exchange for a few modest promises. So long as we pledge to allocate resources to develop the Frisian marshes after the war, they are willing to join our cause."
DD_NED_31a:"A fair bargain."
DD_NED_31b:"We cannot make such a promise."
DD_NED_31a_tt:"We have §Y25§! years to develop the Frisian marshes (complete the mission '§YDevelop the Marshes§!'). Otherwise, the §YFrisians§! will be very §Rangry§!.\n"
DD_NED_support_us_tt:"@[ned_ally_temp.GetTag]§Y[ned_ally_temp.GetName]§! will support us during the §ODutch Revolt§!.\n"
DD_NED_32_t:"The Magnificent One of Gelre"
DD_NED_32_d:"When [Root.GetName]'s envoy entered the hall of the Count of Gelre, he was immediately stunned by the dazzling array of artworks on display. The Count's collection rivalled even that of the palace in Brabant—fitting for a man of ducal rank. In fact, during the negotiations, although he had not yet received a formal investiture, the Count of Gelre unabashedly styled himself a duke. This magnificent lord was eloquent and courteous, firmly believing that he would one day receive what was rightfully his. Upon hearing of our cause, the Count gladly accepted. And in return—quite simply—he merely wished to become a duke."
DD_NED_32a:"After we succeed, petition the Grand Council to elevate his title."
DD_NED_32b:"I will petition the Emperor on his behalf."
DD_NED_32c:"A duke? Daydreaming!"

DD_NED_33_t:"The Ambition of the Bishop of Liège"
DD_NED_33_d:"Before a precious mahogany desk, the Bishop of Liège appraised the young prince before him with an inscrutable gaze. Flanking him at all times stood two grim-faced knight-guards, their hands resting on their sword hilts like the suits of armour lining the corridor. The prince sat with one slender leg crossed over the other, draped in an opulent gold-embroidered robe that flowed over him like soft brook water, concealing his somewhat delicate frame. Yet the young scion possessed a face with sharp brows and bright eyes, a high-bridged nose, and features that belied his youth—his short, glossy golden hair fell slightly over his brow, masking half ambition, half defiance. When the prince raised his head and addressed the Bishop, his noble eyes were already as calm as a still pond—"
DD_NED_33a:"'Do you wish to become Archbishop of the Low Countries?'"
DD_NED_33a_tt:"@LIE§Y[LIE.GetName]§! has decided to stand with us during the §ODutch Revolt§!.\n"
DD_NED_34_t:"The Price of the Free Cities"
DD_NED_34_d:"As cities that had flourished under the Empire's favour, the Free Cities ought to have been our loyal supporters. Yet the ever-rising taxes in the Low Countries in recent years, along with tightening controls and tolls, have strained their loyalty. Whispers spread through field and lane that the Empire cared nothing for the Low Countries, only for their coin and grain. In truth, this was no lie—the Empire had never concerned itself with any trifle that did not threaten crown or dynasty. Our envoys managed to infiltrate the Free Cities and meet with members of their city councils. These short-sighted petty merchants sought only greater autonomy in exchange for limited support—but to expect them to fight alongside us was out of the question."
DD_NED_34a:"Standing idly by is enough."
DD_NED_34a_tt:"If we ever come to possess provinces of @[ned_ally_temp.GetTag]§Y[ned_ally_temp.GetName]§!, those provinces will gain §R+50.0%§! local autonomy.\n"
DD_NED_choose_ntr_tt:"@[ned_ally_temp.GetTag]§Y[ned_ally_temp.GetName]§! will remain neutral.\n"
DD_NED_34b:"Absolutely not! You will all obey my command!"
DD_NED_35_t:"The Cry of Wallonia"
DD_NED_35_d:"Wallonia—meaning 'land of outsiders.' Its people have always felt closer to the French than to the Germans. Faced with the menacing threat of France, they ultimately chose to accept the Empire's protection. Yet the Empire treated them as nothing more than another purse to squeeze, trying to extract every last coin from it. The Walloons grew weary of the Empire's fickleness and broken promises, weary of being forever treated as foreigners. At first, they intended only to sit back and watch the struggle from afar—but upon hearing of our grand vision, they decided to join our cause and resist the Empire for the sake of a republican and united future."
DD_NED_35a:"Truth never demands a price."
DD_NED_36_t:"The Rise of East Frisia"
DD_NED_36_d:"Initially, Joachim had not expected to win any support from Friesland. But a local noble from East Frisia came to him of his own accord, presenting himself at Joachim's residence and swearing fealty to the Regent and the Hohenstaufen. Joachim was only too pleased to see Friesland thrown into internal disarray; he readily accepted and recognised the noble's rule over East Frisia, acknowledging East Frisia as a prince of the Holy Roman Empire. Of course, this would still need to be reviewed by the Imperial Diet—but such trifles were of little concern to that body."
DD_NED_36a:"'Most delighted to be of service, Your Highness.'"
DD_NED_36a_tt:""

DD_NED_37_t:"The Fury of Frisia"
DD_NED_37_d:"The 25-year pact has come due, yet we have still failed to fulfil our promise—to develop the Frisian marshes. The enraged Frisians, feeling deceived, have raised the banner of revolt in fury."
DD_NED_37a:"Reaping what we sowed."
DD_NED_38_t:"Striking First"
DD_NED_38_d:"Standing upon a hastily erected platform, Joachim gazed with satisfaction at the assembled troops below him. Crisp uniforms, gleaming barrels, bayonets glinting with cold light, and the rhythmic thud of boots striking the ground in unison—this was undoubtedly an army worthy of his noble name. Not a rabble of peasants, not vagabond rebels waving republican banners, but a true army of the Low Country Regent—of the Hohenstaufen—bought at no small cost.\n\n'Your Highness,' Joachim's commander, clad in full dress uniform rather than armour, saluted him. 'Your army stands ready, awaiting your command. We are prepared to march into The Hague and seize the rebels.' The blinding sunlight forced Joachim to squint as he took one last look at his orderly ranks. 'March forth,' he declared with lofty spirit. 'May you bring no shame to the name of Hohenstaufen.'"
DD_NED_38a:"Forward—march on The Hague."
DD_NED_38a_modifier:"Striking First"
desc_DD_NED_38a_modifier:"Speed will bring us victory!"
DD_NED_39_t:"The Dutch Revolt"
DD_NED_39_d:"The people of Holland can no longer bear the oppression of the Empire, and have decided to raise the standard of revolt. We had best consider which side we ought to support."
DD_NED_39a:"Stand with @HOL§Y[HOL.GetName]§!."
DD_NED_39b:"Stand with @BRB§Y[BRB.GetName]§!."
DD_NED_39c:"I have no idea."
DD_NED_40_t:"A Missed Move"
DD_NED_40_d:"[From.GetName] has already completed the mission 'Seek Foreign Support'—this means we can no longer complete that mission.\n"
DD_NED_40a:"Oh no."
DD_NED_41_t:"A Missed Move"
DD_NED_41_d:"[From.GetName] has already completed the mission 'Channel Friends'—this means we can no longer complete that mission.\n"
DD_NED_41a:"All is past."
DD_NED_42_t:"Republican Triumph"
DD_NED_42_d:"After a bloody struggle, the Republican League—led by Admiral Hendrik van Nassau and his martyred elder brother, Prince Willem—emerged victorious from the Dutch civil war. The Republican League, forged from an alliance of Low Country nobles, won the day amid the fratricidal conflict of the Netherlanders, securing independence and sovereignty for the Netherlands through blood and hatred.\n\nThe Imperial Circle and the followers of the Hohenstaufen were chased out of the Low Countries in disgrace, and even those states that had once rallied under the Regent's banner were compelled to recognise the League's authority. Now, all the Netherlands stand truly united beneath a single flag, having thrown off the Empire's yoke once and for all. Under the leadership of the new Prince of Nassau, Admiral Hendrik, the Netherlands shall stride boldly into her new era."
DD_NED_42a:"The Admiral saves the Low Countries!"
DD_NED_42a_tt:"All provinces belonging to §Renemy§! states during the §ODutch Revolt§! will be ceded to us, and gain:"
DD_NED_42a_tt2:"All §Gallied§! states during the §ODutch Revolt§! will become our §Yvassals§!.\n"
DD_NED_42a_modifier:"Provincial Integration"
desc_DD_NED_42a_modifier:"This province is being integrated into the new state."

DD_NED_43_t:"Imperial Triumph"
DD_NED_43_d:"After a bloody struggle, the Imperial Circle government of the Low Countries—led by the Imperial general and Low Country Regent, Joachim von Hohenstaufen—emerged victorious from the Dutch civil war. The Imperial Circle government, composed of imperial bureaucrats and generals loyal to the crown, won the day amid the fratricidal conflict of the Netherlanders, securing the wealth and sovereignty of the Netherlands through blood and hatred.\n\nThe Republican League and the followers of the Prince of Nassau were chased out of the Low Countries in disgrace, and even those states that had once rallied under the League's banner were compelled to recognise the authority of the Imperial Circle government. Now, all the Netherlands stand truly united beneath a single flag, and the Empire's rule is unshakeable at last. Under the leadership of the great and noble Low Country Regent, Prince Joachim, the Netherlands shall stride boldly into her new era."
DD_NED_43a:"The Regent pacifies the Low Countries!"
DD_NED_44_t:"The Staff-Bearer"
DD_NED_44_d:"Hendrik sat alone in his office, in the chair of the Stadtholder, staring blankly at the walking stick resting across his lap. He had never really studied this long staff, though it had been with his elder brother since childhood—when Willem was mockingly called 'Lame Willem'—serving as his third leg, supporting him through countless seasons. It was a mark of his brother's infirmity, a symbol of their unhappy youth—and now, a relic of the brother who had once stood here.\n\nThe silver tip of the staff was worn and tarnished, its once-bright base now mottled black and white. In earlier days, Hendrik had always stood silently behind this chair, his view filled only by his brother's broad back—now, before him lay only an empty long table. Taking up the staff, he understood at last what the Stadtholder faced, what the words 'Republican League' truly meant—not noble ideals, not the people's welfare, not the freedom of the Low Countries.\n\nInterest—nothing more. Squabbling nobles, lords carving up the inheritance, governors eager to fill the vacuum left by the Empire. Upon this very soil, where his brother's body still lay unburied, the ugly monsters had already bared their claws once more for gain. Decrees went unheeded, spoils were divided unevenly, and not a single command could penetrate the wall erected by the Grand Council of the Netherlands. Hendrik leaned back in his chair and gazed into the distance—all he saw were ideals trampled underfoot and a blazing fury kindled within."
DD_NED_44a:"He lifted the staff and lightly tapped the floor, as his brother once did."
DD_NED_44a_modifier:"Striking with an Iron Fist"
desc_DD_NED_44a_modifier:"No more tolerance—it is time to strike hard."
DD_NED_45_t:"The Man Outside the Frame"
DD_NED_45_d:"Joachim lounged on the sofa in the antechamber, idly twisting his interlaced fingers. His slender, slightly damp digits rubbed against one another, a white glove pinched between them. 'Prince Joachim, His Majesty will see you now.' Ignoring the royal secretary's breach of protocol in addressing him by name alone, Joachim rose swiftly and walked with light steps through the door. What would he receive? A post at the heart of the Empire? A place at his father's side? Perhaps even…\n\n'Father!' As he entered the office, his eyes fell upon mountains of documents piled high like small hills, and among them a red-haired man—the Emperor of the Empire—buried in his work. Behind him stood a pair of open windows; cream-coloured curtains, tinged with the soft haze of dawn, swayed gently in the breeze behind the Emperor, like a coronation robe. The bright afternoon sun fell upon a portrait on the wall, filling the room with a golden warmth.\n\n'Sit, Joachim. You have done well in the Low Countries.' The Emperor did not look up, merely waved his hand casually, gesturing for his son to sit. 'Thank you for your praise, Father. We have thoroughly uprooted the threat of rebellion in the Low Countries and largely resolved the famine in the Empire's granary—' 'I know.' The Emperor remained focused on the papers before him. 'You have done well.' Interrupted, Joachim opened his mouth, but noble restraint kept him silent, waiting for his father's next words. After a brief pause, the Emperor picked up another stack of documents from his left and continued lightly: 'Therefore, I have decided. You shall be formally invested as Duke of Brabant and Viceroy of the Netherlands. Go now.'\n\nThe Prince rose stiffly, bowed his head low to the Emperor, and after a long moment turned away rigidly. The oil paintings on the wall still gleamed with their lustrous light, but only then did the foolish prince realise—he was nothing more than the gilded frame itself, a mere ornament, a man outside the painting lost in idle dreams. Only when the royal secretary smiled and held the door open did he stumble dazedly toward the exit.\n\n'Joachim,' he heard his father's voice from behind."
DD_NED_45a:"'Do not bring shame to my name.'"
DD_NED_45a_modifier:"Viceroy of the Netherlands"
desc_DD_NED_45a_modifier:"We have been granted the honourable title of Viceroy of the Netherlands."

DD_NED_46_t:"The Unlooked-For King"
DD_NED_46_d:"On the carriage ride back from Swabia to Brabant, Aldo rarely found himself sharing the journey with his master, the Emperor's third son. Joachim still wore that exquisite formal attire, silently resting his cane between his legs, his eyes quietly closed. He remained the third son of Hohenstaufen, but he seemed less buoyant than before, and more sombre and brooding. Aldo stole a glance at him, then turned his face away without a word.\n\n'Aldo.' The prince had opened his eyes at some point, fixing his gaze on Aldo across from him, staring intently at his knight-commander—his butcher, his executioner, the Imperial-appointed watcher—and spoke abruptly: 'Do you have any regrets?' 'Every day.' Aldo did not hesitate for a second, even though the question came suddenly and seemed less than well-intentioned. 'Is that so?' The prince narrowed his eyes slightly, boring into the knight-commander, and asked with a half-smile: 'Tell me—you have all sworn your oaths, have you not?'\n\n'Of course. My knights and I have all sworn loyalty to the Empire and the Emperor.' The commander's reply remained resolute.\n\n'Hahaha, hahahaha—how forthright you are, Commander. Is it unwillingness, or disdain?' Joachim burst into laughter, casting aside all the noble composure he had so carefully maintained. He propped himself up on his cane, rising unsteadily in the moving carriage like a ship tossed in a storm, pushed open the window, and leaned out to look back. The scenery of the Empire sank with the blood-red dusk, trailing behind Joachim. The Empire—the Empire! He lifted the corner of his mouth lightly in the wind, and in his heart, he set the course for his ambition."
DD_NED_46a:"My era begins now."
DD_NED_47_t:"A Prisoner of the Imperial House"
DD_NED_47_d:"From the moment I was born, I was a Hohenstaufen of Swabia—a prince set above ten thousand men. They told me I was born with the right to inherit the Empire, that I would be the famed son of the double-headed eagle, that I carried the noble blood of the Empire and was destined to become an emperor as great as any who came before—and I believed it without question.\n\nI was wrong—utterly wrong. My surname was indeed noble, but it held sway only over the mediocre—in the eyes of true players of the game, I was but another nobody bearing imperial blood. I was the third son of that man—before me stood the true heir to the Empire, and the spare contender vying for the crown. The third son, arriving late, was nothing more than a useless vase in anyone's eyes. Was I not the prince of the Empire? Was I not the third heir to this leviathan? Was I not—born a Hohenstaufen standing above millions?\n\nI was merely a prisoner of the Imperial House.\n\nBut the twenty-year-old me was not. He refused, and could not, accept it. He exhausted himself proving his worth, cast aside his vows to the Heavenly Father, forgot his own station, and burned himself without reservation—until at last he discovered that the Emperor had never cared whether a vase was fit to be an emperor.\n\nThe fire died out, and everything he had believed in his first life streaked across the sky like a fleeting spark—and so, the third son, at the end of the line of succession, finally resolved to claim the throne.\n\nHe cast aside his standing as a prince, renounced the name of Hohenstaufen, abandoned loyalty and honour. That vase set deep within the imperial palace wagered everything, gambled everything, all so that this loathsome, cunning, profit-driven Empire—this bloated, hypocritical, heartless, and fate-bound many-headed monster—might spare him even a single glance.\n\nDid he succeed?\n\nI do not know. I have walked through battlefields drenched in fraternal blood, through valleys piled with mountains of corpses, through dark and wretched courts. Power, intangible and elusive, has been a plaything in my hands; the darkest, most shameful secrets are only whispered in the final confession—yet that young prisoner never truly left the palace, never broke free from the cage of the Imperial House."
DD_NED_47a:"But at last, my long sentence has come to an end."

