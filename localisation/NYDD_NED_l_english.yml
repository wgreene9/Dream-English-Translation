DD_NED_85_t:"Eastern Strategy"
DD_NED_85_d:"After exploration and trade by adventurers and a small number of merchant vessels, the Eastern branch of the Dutch East India Company submitted a report to the directorate that could not be ignored. The report detailed the considerable wealth of the East—an unexpectedly abundant supply of silver, a wide variety of high-value trade goods, vast sources of low-cost raw materials, and untapped markets. If the Company could successfully open Eastern trade and penetrate the East Asian market, the profits would be beyond imagination.\n\nThe report outlined two viable approaches: a gradualist strategy—engaging through trade negotiations, securing privileges, and cultivating local proxies to steadily expand Eastern commerce; or a forceful approach—using the Company's armed might to directly establish a Dutch regime in the East. However, it was noted that, unlike other colonial regions and commercial ventures the Company had previously engaged in, much of the East lay under the protection of powerful, centralised states; reckless action might entail considerable risk and cost."
DD_NED_85a:"The directorate votes in favour of the trade proposal."
DD_NED_85b:"The military proposal passes the directorate by a narrow margin."
DD_NED_85a_tt:"§MThrough shrewd calculation and trade, Dutch merchants will navigate the East and bring wealth back to the homeland.§!\n\n§YCurrent mission rewards and conditions remain unchanged.§!\n"
DD_NED_85b_tt:"§OWho would complain of too much wealth? Dutch merchants will conquer the riches of the East by force!§!\n\nAdjust the missions '§YEstablish Fort Zeelandia§!,' '§YSilver Empire§!,' and '§YPax Neerlandica§!'.\n"
DD_NED_86_t:"Modest Returns"
DD_NED_86_d:"Despite our vigorous promotion of cloves, most people remained prudent and cautious with their investments. Yet although prices did not soar as we had imagined, they still caused a ripple in the European market. Some adventurers from Northern Europe took a liking to the pungent kick of cloves, even declaring they would buy them at double the price. To meet their premium demand, the East India Company reluctantly expanded clove production by a modest margin and, as they wished, raised prices several fold—thus reaping a tidy profit."
DD_NED_86a:"Well, at least we still made a profit."
DD_NED_86a_TRADE:"The Clove Craze Subsides"
DD_NED_87_t:"The Clove Bubble"
DD_NED_87_d:"Our deliberate laissez-faire approach—even encouragement—of the clove market produced disastrous consequences. A flood of speculators created a futures market, and prices soared to dizzying heights—until finally, the bubble burst. East India Company shares plummeted, hitting the floor; the Amsterdam stock exchange was forced to close, as the crowds of distraught citizens had caused serious trampling incidents. Countless people were ruined. It had become a full-blown catastrophe.\n\nA famous French economist remarked: 'Amsterdam is a casino in all but name.'"
DD_NED_87a:"Which falls faster—a man or a stock?"
DD_NED_87b:"Save the stock market at all costs!"
DD_NED_87a_TRADE:"Mirror, Flower, Water, Moon"
DD_NED_87a_modifier:"Fading Mirage"
desc_DD_NED_87a_modifier:"Merely the failure of speculators—what is that to me?"
DD_NED_87b_modifier:"Fading Mirage"
desc_DD_NED_87b_modifier:"Merely the failure of speculators."

DD_NED_88_t:"The Clove Craze"
DD_NED_88_d:"Merchant ships plied the calm waters of the Sunda Shelf, laden with cargo—yet most of it scarcely justified the journey from the other side of the world: bulk goods such as rice, salt, preserved fish, textiles, and metalware offered little value. The proportion of spices was small, but cloves, nutmeg, and the like—crops that grew only in the eastern East Indies—yielded extraordinary profits.\n\nExperts who consulted Chinese historical records revealed that, besides the uses already known to us, cloves had also been employed to mask bad breath. With suitable marketing on our part, chewing cloves quickly became a pan-European fashion—nothing was more refined than popping one after a meal. Yet the long transit times for spices made it impossible to guarantee a steady supply. Faced with this surging demand for cloves, the East India Company began pre-selling many shipments overnight. Barring any unforeseen mishaps, we stood to make a fortune!"
DD_NED_88a:"This is a new opportunity! Immediately promote it as a noble rarity!"
DD_NED_88a_tt:"§RWhat could possibly go wrong? Right?§!\n"
DD_NED_88b:"Stop this immediately—this is reckless speculation!"
DD_NED_88a_tt2:"§RBetter to play it safe.§!\n"
DD_NED_88b_TRADE:"The Clove Craze"
ned_spice_trade_modifier_prov2:"Moderate Extraction"
desc_ned_spice_trade_modifier_prov2:"Moderation is the truth."
DD_NED_89_t:"East Asia Council"
DD_NED_89_d:"The Dutch East Asia Council (Oost-Aziatische Raad), established in Suzhou in the year $YEAR$, was a branch directly subordinate to Amsterdam, tasked with managing and coordinating trade with China and the broader Far East. The Council employed local Chinese staff, a few of whom were promoted to sail to other regions' trading companies, or even across the oceans to Amsterdam. For this reason, Suzhou also acquired the nickname 'Shanghai' (meaning 'upon the sea'). During the Council's operations, Chinese and Dutch cultures deeply influenced one another: tea, distilled spirits, and various root vegetables began to appear in European households, while new breeds of cats from Europe became fashionable in the Chinese court. With the further expansion of Far Eastern trade, the East Asia Council grew into the largest trading company under the Dutch state."
DD_NED_89a:"Let us make a fortune!"
