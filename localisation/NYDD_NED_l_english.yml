DD_NED_62_t:"The Balance Shifts"
DD_NED_62_d:"Amid the dizzying political competition, the formerly dominant ruling faction has gradually been defeated by another, and their opponents have taken control of the government. This has forced the centre of power in the Dutch government to shift from one side to the other. Now, the leader of the opposing faction has taken over the reins of government, and the transfer of power has been carried out peacefully."
DD_NED_62a:"The scales of power tip gently."
DD_NED_63_t:"The Helmsman of the Netherlands"
DD_NED_63_d:"The previous Stadtholder of the Netherlands has passed away, leaving the leadership of the Netherlands vacant. Though the helmsman of the Low Countries is gone, the political factions within the Dutch parliament he left behind are clearly defined: the deputies supporting the Stadtholder and those backing the Grand Pensionary have both made their positions clear, ready to vie for influence in the coming political contest. With the support of the deputies, the new helmsman of the Netherlands will soon emerge victorious from among the new Stadtholder and Grand Pensionary."
DD_NED_63a:"The Republicans triumph again."
DD_NED_63a2:"The House of Nassau has mobilised its connections…"
