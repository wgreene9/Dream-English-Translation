desc_DD_NED_com_care_local_button_modifier:"A little here, a little there, and the locals will be quite docile."
DD_NED_com_improve_state_button_modifier:"Good Infrastructure"
desc_DD_NED_com_improve_state_button_modifier:"As the saying goes: if you want to get rich, build roads first."
DD_NED_com_support_dev_button_modifier:"Development Funds"
desc_DD_NED_com_support_dev_button_modifier:"To develop is to first nurture one's own wings for flight."

