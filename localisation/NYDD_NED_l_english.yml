DD_NED_94_d:""
DD_NED_94a:""
DD_NED_95_t:"Chasing the Wind"
DD_NED_95_d:"It cannot be said that God was unjust to the Low Countries—but neither can it be said that He favoured her. Our land was once nothing more than a disregarded territory, a mere appendage of imperial hegemony. The world saw us only as the Emperor's backdrop, the Empire's granary. No one could have foreseen that this low-lying land, crouching beneath the tides, would one day come to dominate the world.\n\nNow, the Low Countries have not only ascended to the seat of hegemony, but have also emerged as the sole victor in this great political game. We are no longer the prize of great power rivalries, no longer fearful onlookers. We are not merely masters of our own fate—we have become the arbiters of the destinies of countless millions. The world is no longer commanded by the imperious French or the arrogant Hohenstaufen, but by the Netherlands—mistress of the seas and the land alike."
DD_NED_95a:"The world is a stage, and all men are but puppets in our hands."
NYDD_NED_between_two_sea_tt:"The shadow of the sea level has already risen above the throne; a new age is quietly crowned in foam and salt crystals.\n"
DD_NED_95a_modifier:"Brilliant Tomorrow"
desc_DD_NED_95a_modifier:"Tomorrow, and tomorrow, and tomorrow—a tale full of sound and fury, signifying nothing."

DD_NED_96_t:"Chasing the Waves"
DD_NED_96_d:"Does the boundless blue sea have an end? Over the past centuries, the valiant explorers and merchants of the Netherlands have travelled to every corner of the world, unveiling every mysterious and unknown secret. The seafarers who chased the waves left our mark upon every part of this endless ocean. We have expanded the frontiers of civilisation, woven a web of commerce, and united the once-fragmented and isolated world for the first time.\n\nNow, the seven continents and four oceans are united under the glory of our rule; our flag shall forever bask in the radiance of the sun. Our great commercial system bridges the divides of peoples and cultures, bringing civilisation and prosperity to every corner of the globe. We are the pioneers of the age, the explorers of the world, the adventurers rebuilding the Tower of Babel. The ships of the Netherlands chase the waves of the age, forever sailing at the very forefront of the world."
DD_NED_96a:"Even if the world has no end, we shall forever pursue the unknown waves."
DD_NED_96a_tt:"Thank you for playing @NE8§Ythe Netherlands§!.\n"
DD_NED_97_t:"Chasing the Wind"
DD_NED_97_d:"It cannot be said that God was unjust to the Low Countries—but neither can it be said that He favoured her. Our land was once nothing more than a disregarded territory, a mere appendage of imperial hegemony. The world saw us only as the Emperor's backdrop, the Empire's granary. No one could have foreseen that this low-lying land, crouching beneath the tides, would one day come to dominate the world.\n\nNow, the Low Countries have not only ascended to the seat of hegemony, but have also emerged as the sole victor in this great political game. We are no longer the prize of great power rivalries, no longer fearful onlookers. We are not merely masters of our own fate—we have become the arbiters of the destinies of countless millions. The world is no longer commanded by the imperious French or the arrogant Germans, but by the Netherlands—mistress of the seas and the land alike."
DD_NED_97a:"What is past is prologue."
DD_NED_99_t:"The Birth of Afrikaner Culture"
DD_NED_99_d:"Among the first to set foot on the Dark Continent were adventurers seeking new opportunities and refugees of all kinds who had nowhere else to turn. These were people rejected by their homelands and societies, hoping to restart their lives on new soil. When the colonial companies took over African colonisation, large numbers of company employees settled here and built the necessary infrastructure.\n\nTheir descendants multiplied and thrived, and new cities rose from the earth. These Germanic offspring gradually formed their own identity and culture in Africa, far from their ancestral homeland. In contrast to the commercially vibrant and innovative home country, the African colonies were largely agricultural, and even though commerce and trade were also major industries, they were largely controlled by the companies and the Germanic settlers. This led the local Germanic descendants to develop a more conservative and distinct culture, and they came to call themselves 'Afrikaners'."
DD_NED_99a:"The birth of a new culture."
DD_NED_99a_tt:"All §YGermanic§! culture group provinces in §YAfrica§! will change to §YAfrikaner§! culture.\n"

DD_NED_100_t:"Dutch Council of State"
DD_NED_100_d:"In [GetYear], after much busy governance, the Council of State (de Raad van State) gradually took shape. Its predecessor was the Estates-General convened by the permanent delegation. Like the Estates-General, the permanent Estates-General was still composed of representatives from each province. Owing to the urgency and timeliness of affairs, they had greater latitude to act expediently, and in practice they often engaged in more private consultations and compromises in order to reach swift decisions. The Council was chaired each week by a representative from a different region, with a clerk present to keep records. Regardless of how many representatives were in attendance (though the number of seats was limited, each province could send as many delegates as it wished), each region had only one vote. The Council of State would determine policies across various fields—military, economic, expansion, and so on—and appoint the corresponding ministers."
DD_NED_100a:"Establish the Council of State."
DD_NED_100b:"Let us keep the current Estates-General."
DD_NED_101_t:"Stadtholder–Grand Pensionary Conflict"
DD_NED_101_d:"The conflict between the Stadtholder and the Grand Pensionary never ceased—they not only vied for power behind the scenes but also clashed head-on in the Council of State. To resolve their disputes, we must support one side."
DD_NED_101a:"Support the Stadtholder."
DD_NED_101b:"Support the Grand Pensionary."
DD_NED_102_t:"Armament Dispute"
DD_NED_102_d:"The Stadtholder has been attempting to build a larger army, prompting the Republicans to accuse him of seeking to restore the House of Nassau's rule."
DD_NED_102a:"This is utter nonsense—trust the Stadtholder."
DD_NED_102b:"The Stadtholder must stop."
DD_NED_102a_modifier:"Military Preparedness"
desc_DD_NED_102a_modifier:"Actively preparing militarily."
DD_NED_102b_modifier:"Curbing Ambitions"
desc_DD_NED_102b_modifier:"Whatever you intend to do—don't."
DD_NED_103_t:"Republican Debates"
DD_NED_103_d:"Since the collapse of the Republican League, various republican factions of all sizes have emerged within the Netherlands. These republicans constantly argue in the streets of Amsterdam, satirising the current government."
DD_NED_103a:"Arrest them all."
DD_NED_103b:"Truth becomes clearer through debate."
DD_NED_103a_modifier:"Guarantee Orthodoxy"
desc_DD_NED_103a_modifier:"Dare not speak."
DD_NED_103b_modifier:"Free Debate"
desc_DD_NED_103b_modifier:"Speak freely."
DD_NED_104_t:"Merchants Flee"
DD_NED_104_d:"Years of war have unsettled the merchants; many have seized the opportunity to flee abroad with their possessions."
DD_NED_104a:"Stop them and confiscate their property."
DD_NED_104b:"Alas, let them go if they wish."
DD_NED_105_t:"Divergent Opinions"
DD_NED_105_d:"On several proposals before the Council of State, compromise is needed to keep [Root.GovernmentName] running efficiently. When representatives cannot reach agreement, our nation cannot be governed. Our efforts to ensure the Stadtholder cannot rule with an iron fist have succeeded. However, this also means that consensus must be achieved through political manoeuvring rather than authority. Sometimes no consensus can be reached at all."
DD_NED_105a:"Only the iron fist is the answer."
DD_NED_105b:"We cannot abandon republicanism because of this."
DD_NED_106_t:"Advisor Supports the Ruling Faction"
DD_NED_106_d:"Our court advisors, being shrewd, have chosen to support the current power-holders."
DD_NED_106a:"Discerning."
DD_NED_107_t:"Disappointment"
DD_NED_107_d:"The people are deeply disappointed that we have not only failed to protect them, but have actively offered more to the Empire. This has greatly reduced their willingness to enlist."
DD_NED_107a:"Well, there is nothing I can do."
DD_NED_108_t:"Death and Taxes"
DD_NED_108_d:"The Empire's tax collectors always arrive on schedule, stripping every last grain from our lands. Some peasants, resentful, have raised the banner of revolt."
DD_NED_108a:"Crush them!"
DD_NED_109_t:"Tears"
DD_NED_109_d:"People say we fight meaningless wars, dying only for the Empire's interests."
DD_NED_109a:"Flow on, your tears."

DD_NED_110_t:"Take Your Places"
DD_NED_110_d:"The time has come.\n\nThe Emperor is mired in crisis; the Empire is preoccupied with its own troubles—war and calamity have once again visited this poor realm. But this time, our role is no longer that of a Hohenstaufen vanguard or firefighter. Perhaps too much time has passed, perhaps people have forgotten our ambitions, perhaps the world sees us only as the Empire's loyal hounds—but that is not so. Our ambition was merely buried, not extinguished, lying in wait amid their arrogance and hubris.\n\nNow the moment has arrived.\n\nLet the tyrants who took our loyalty for granted be astonished; let the fanatics who dismissed our devotion as worthless be enraged. They shall finally understand that Joachim's kingdom is not the Emperor's backdrop, not the vassal of those 'destined ones' born with everything, not the vase of the so-called Imperial head—we are rivals bearing the very name of Hohenstaufen, flowing with ambition and noble blood.\n\nJoachim's kingdom stands ready. This shall be the first time the Empire truly beholds her loyal knight, and the Emperor is destined to pay the price for his arrogance. Now, take your places! For any contest stained with royal blood must end by the blade."
DD_NED_110a:"The day of defiance has come."
DD_NED_111_t:"Journey's End"
DD_NED_111_d:"[Root.Monarch.GetName] walked through the palace corridors, followed by only a few attendants. Servants, ladies-in-waiting, and guards alike bowed in fear, clearing the way for the Emperor. [Root.Monarch.GetName] moved unhurriedly toward the great hall, past galleries, past gardens, like a traveller in haste, walking through every corner of this imperial palace, never looking back.\n\nAt last, the great doors swung open before him; the nobles, who had been conversing, fell silent at once and parted like a tide, opening a path to the throne. He saw the assembled ministers bowing low, paying homage to the Emperor upon the imperial seat—'Your Majesty.' Amid the wave of voices, [Root.Monarch.GetName] stood unmoved. From the lowest step of the royal court to the summit of the imperial throne, for this Emperor from the Low Countries, he had come too far to turn back."
DD_NED_111a:"The long road has finally reached its end."
DD_NED_111a_tt:"Allows £hre£§Ycentralisation reforms§! of the §YHoly Roman Empire§!, even under any circumstances that would otherwise prohibit them.\n"
DD_NED_111a_modifier:"Emperor of the Low Countries"
desc_DD_NED_111a_modifier:"We shall prevail in the end!"
DD_NED_112_t:"Walter von Cronberg"
DD_NED_112_d:"Walter von Cronberg (c. 1479–1543) hailed from a distinguished Swabian knightly family and rose to prominence within the Swabian Knights' Order in his early years. In 1526, he was elected Deutschmeister, becoming the de facto leader of the knightly orders within the Empire. The following year, the Emperor formally appointed him as 'Administrator of the Grand Mastership in the Netherlands'; this legal status was confirmed by both the Emperor and the Pope in 1530, allowing him to establish a new headquarters in Limburg and transform the Order into a Catholic noble confraternity within the Empire.\n\nIn the Low Countries, Walter directly governed extensive estates. With the absolute trust of the Emperor and the Viceroy, he not only reorganised the discipline of the Order's chapters but also became deeply involved in Dutch governance, coordinating the interests between the Crown and local feudal lords. He functioned as the Emperor's military representative and administrative linchpin in Flanders and Brabant, effectively fulfilling the duties of a Dutch court steward. The administrative system he constructed ensured the Order's survival through the tides of the Reformation."
DD_NED_112a:"Employ him as Court Steward!"
DD_NED_112b:"Make him a general!"
DD_NED_113_t:"Scorched Earth"
DD_NED_113_d:"Our excessive exploitation of the Spice Islands has exhausted the fertility of the land and devastated its ecology. Without protection, there may be no clove harvest for a long time to come."
DD_NED_113a:"We can do nothing."
DD_NED_113a_modifier:"Clove Shortage"
desc_DD_NED_113a_modifier:"Years of continuous exploitation have left this land barren."
DD_NED_113b:"Allocate funds to save the cloves."
