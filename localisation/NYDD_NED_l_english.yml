cb_imperial_reclaim_emperor_DD_desc:"We are the rightful rulers of the Holy Roman Empire!"
cb_imperial_reclaim_emperor_DD_wg:"Reclaim the Imperial Throne"
cb_imperial_reclaim_emperor_DD_wg_desc:"War goal is to occupy the capital."
