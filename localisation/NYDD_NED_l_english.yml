DD_NED_revolt_disater:"§OThe Dutch Revolt§!"
DD_NED_revolt_disater_desc:"Can text truly be written here?"
DD_NED_revolt_disater_ttt:"No one knows what is about to happen"
DD_NED_revolt_disater_ttt2:"A horrifying assassination attempt has occurred"

DD_NED_1_t:"The Moderate Faction of the Imperial Circle"
DD_NED_1_d:"Willem van Nassau became Imperial Governor of the Low Countries not only because he was the hereditary Prince of Nassau, but also because of his calm, benevolent, and outstanding abilities, as well as his military talent, inherited from his father, in thwarting the French invasion during the Walloon War. He is a close confidant of the Emperor, the Imperial Steward of Swabia, a member of the Council of State, and a pillar of the Empire. Born a Prince of Nassau, he was raised in the Brabantine court under the Emperor's rule, and his tutor was the Emperor's godfather, the renowned Archbishop of Cologne.\n\nBut his homeland is, after all, the Netherlands, not Germany. The blood of the Low Countries flows through his veins, which prevents him from obeying orders from Swabia and imposing an iron fist upon his compatriots. Heavy taxation, like chains, has gradually crushed this once-prosperous land. Imperial garrisons, brutal repression, and unavoidable levies have enslaved the people of the Low Countries. Today, the Netherlands is not a territory of the Empire; it is merely livestock raised by the Empire.\n\nNow, the Hohenstaufen grip is steadily weakening. The disaffected lords of the Low Countries, the young and inexperienced Regent of the Low Countries—the iron cage seems to be faltering, emitting the heavy echo of rattling shackles. The Prince of Nassau will not squander this once-in-a-lifetime opportunity. He does not wish to betray the Emperor, but if it means securing a brighter future for his compatriots and his homeland—he is willing to sacrifice everything for it."
#An Imperial perspective version is needed. Alternatively, just make do and see what Lord Lu thinks.
DD_NED_1a:"May his cause and ideals be fulfilled."
DD_NED_1b:"May the Empire's rule endure for a thousand years."
#Effect: Gain modifier "Restless Imperial Circle," unrest +1, national tax modifier -15%. One month later, trigger event "Republican League."
DD_NED_1a_tt:"Except for @FRI§YFriesland§! and @EFR§YEast Frisia§!, all §YHoly Roman Empire§! countries with their capital in the §YLow Countries§! region gain:"
#Remember to write the taxation mechanism later; writing this here so I don't forget.

DD_NED_1a_ttHOL:"§MHelpful Tip§!: After winning the §ODutch Revolt§!, we will §Ggain independence§! and §Rleave§! the §YHoly Roman Empire§!.\n\n§YIf you wish to experience the story of serving the Emperor loyally and faithfully, we recommend playing @BRB[BRB.GetName]§!.\n"
DD_NED_1b_ttBRB:"§MHelpful Tip§!: After winning the §ODutch Revolt§!, if @SWA§Y[SWA.GetName]§! is still the §YHoly Roman Emperor§!, @BRB§Y[BRB.GetName]§! will become an §YImperial Kommissariat§! subject of @SWA§Y[SWA.GetName]§!. However, when the Emperor is in §Rcrisis§!, @BRB§Y[BRB.GetName]§! still has a chance to §Ggain independence§!.\n\n§YIf you wish to experience the story of saving the Low Countries and being reborn, we recommend playing @HOL[HOL.GetName]§!.\n"

DD_NED_1a_modifier:"Netherlands Reichskommissariat"
desc_DD_NED_1a_modifier:"The Netherlands Imperial Commissionerate was established as a tax-collecting district after the dynastic union between the Hohenstaufen and Wittelsbach families, which brought the Low Countries as a gift. The Emperor imposed heavy levies on the Low Countries under pretexts such as the French invasion, to sustain the vast expenditures of the Empire.\n\n§YEach state within the Reichskommissariat of the Netherlands provides a substantial tax revenue to the Emperor.§!\n"
DD_NED_2_t:"The Republican League"
DD_NED_2_d:"As an ancient fief of the Hohenstaufen, the Imperial Circle of the Low Countries possesses a complex yet fragile political structure. Local nobles serve as provincial governors, while the central government of the Circle answers to the Imperial Regent and the Imperial Governor. The Regent is typically a member of the imperial house; currently, it is the Emperor's third son, the young Prince Joachim.\n\nOpposing him is the Imperial Governor, the Prince of Nassau, who leads a vast and contradictory alliance of nobles, united by their respective interests, to counterbalance Hohenstaufen control. The charismatic Willem van Nassau has reorganized this alliance, left to him by his father, and together with his brother, Admiral Hendrik, has forged a more unified and powerful political body—the Republican League.\n\nThe newly appointed Prince Joachim is inexperienced and weak, while the Republican League, having reunited the once-fragmented nobles of the Low Countries, seeks to seize this opportunity to take control of the Low Country government and win freedom for the Netherlands. However, in the powerful southern provinces, the nobles largely support the Hohenstaufen Regency. The house of cards in the Netherlands stands tall above the Low Countries, with counterbalancing forces maintaining a stable equilibrium."
DD_NED_2a:"May the Netherlands endure in perpetual peace."
DD_NED_2a_modifier:"The Republican League"
desc_DD_NED_2a_modifier:"Balance is the only path to stability."
#Effect: Gain modifier "Republican League," nobility influence +10%, national manpower modifier +10%, advisor cost -10%

DD_NED_3_t:"The Famine of 1445"
DD_NED_3_d:"For the hapless people of the Low Countries, the famine of 1445 was a calamity from the heavens. A blight affecting multiple crops struck the Netherlands, leaving the farmers of the Low Countries with almost no harvest that year. At the same time, to sustain the Hohenstaufen's crumbling Iron Century, the Empire's taxation showed no sign of relief—instead, it intensified, backed by the German garrisons.\n\nThe Empire's unpopular rule sparked wave after wave of peasant uprisings. In the north, where Hohenstaufen control was lax, the Frisian peasants, who had never bowed to oppression, rose in large-scale rebellion, while the German merchants controlling the Low Countries took advantage of the situation to inflate prices, igniting fierce indignation among the Dutch cities. The devastation wrought by famine and rebellion has already significantly impacted the stability and economy of the Imperial Circle—and this may be but the tip of the iceberg…"
DD_NED_3a:"Summon the provincial governors—convene the Grand Assembly of the Netherlands at once!"
DD_NED_3a_modifier:"Aftermath of Famine"
desc_DD_NED_3a_modifier:"A terrible famine has swept across the Netherlands.\n\nThis famine is expected to end in §Y[1.ned_fame_time_var.GetValue]§! years.\n"

DD_NED_3a_tt:"§YThis famine is expected to end in §R25§! years.§!\n"
#Effect: Gain modifier "Aftermath of Famine," goods produced -1, unrest +3, national tax modifier -10%, stability cost -20%, and doubled peasant and exclusive revolts in the Low Countries region.
DD_NED_4_t:"The Moth to the Flame"
DD_NED_4_d:"In the ornate council chamber stood a long table of ancient red lacquered wood, behind each high-backed armchair hung a magnificent portrait of some illustrious figure, and before these portraits sat the richly clad nobles, arguing with flushed faces. The Prince of Nassau and his brother pushed open the doors of the chamber; as their gazes swept forward, the ancient long table resembled a longship on the verge of breaking apart, carrying a crew of blazing brigands.\n\n'Willem…' the taciturn admiral pulled out a chair for his brother and subtly stepped forward, but Willem merely pressed his shoulder gently and drew back the chair himself. The legs of the redwood chair scraped clearly across the floor, and all the governors ceased their bickering, turning their eyes upon him.\n\n'Gentlemen, thank you for attending this meeting under such circumstances.' The Prince swept his gaze across the long table, his walking stick standing upright against the floor like a sword thrust into solid rock. 'Our homeland is in peril; our compatriots live in division and suffering. A divided Low Countries will forever endure oppression and pain; a fractured people will forever be enslaved and driven. Gentlemen, what we need is not a sack of marks, not a bundle of bread—we need freedom and unity. A Netherlands torn by internal strife and mutual rivalry will remain nothing more than a servant in the mud; only by standing together can we secure a brighter future for the Netherlands.'\n\n'Gentlemen, look beneath our feet!' The Prince's silver-tipped cane struck the floor with a resonant clang, like a cathedral bell that made the governors' hearts tremble. 'Our homeland has served the Empire for centuries; we have earned respect and autonomy—a free government for the Low Countries. I know well that our cause is like a moth craving the flame, dancing with the banyan fire that consumes life itself—but if our ideals can be realized through the unity of the Netherlands, then I gladly accept this fate.'\n\nThe Prince's speech drew thunderous applause, as if shaking the very vault of the hall. But Willem merely gripped his walking stick tightly with both hands and swept his gaze once more across the chamber, as if reviewing his troops."
DD_NED_4a:"Even if we are consumed by fire, our souls are destined to burn for this cause."
DD_NED_4a_tt:"§YWe must immediately begin rallying support among the lords of the Low Countries; their stance toward us will greatly influence our cause.§!\n"
#Effect: Remove modifier "Imperial Circle"; Willem van Nassau (5 6 3, age 40) becomes ruler. Three days later, trigger event "Wrath." We must immediately begin rallying support among the lords of the Low Countries; their stance toward us will greatly influence our cause.
DD_NED_5_t:"Wrath"
DD_NED_5_d:"'How dare they, how dare they!' Prince Joachim slammed the report onto the table in a fury, his hand striking the solid wood with a dull, heavy thud. 'I am the Regent of the Netherlands, not that yokel from Nassau! That was an order—an order! Has he been in the Low Countries so long that he can no longer read German?' His handsome features contorted with rage, like a wild beast.\n\n'What about the army? Where in God's name is our army?' 'Your Highness, we had best… not do that,' the Prince's advisor said nervously. 'If we send troops under the current circumstances, it will surely provoke a full-scale rebellion across the Low Countries.' 'Then what? What do we do! Swabia will not tolerate these scoundrels!' Joachim roared in fury, then slumped back like a deflated bladder, tremblingly picked up his quill, and with helpless resignation signed his name on the document—his strokes pressing clear through the paper."
DD_NED_5a:"'Joachim von Hohenstaufen'"
DD_NED_5a_modifier:"Burning with Wrath"
desc_DD_NED_5a_modifier:"But what else could be done?"
DD_NED_5a_modifier2:"Reluctant Recognition"
desc_DD_NED_5a_modifier2:"A good beginning?"
#Effect: Gain modifier "Reluctant Recognition," monthly legitimacy +0.1, yearly prestige +1, gain 1 stability.

DD_NED_6_t:"Forging the Ark"
DD_NED_6_d:"The Bishop of Utrecht sat at the other side of the table, gazing at the man across from him—a man he could not fathom, a German who claimed to fight for the freedom of all the Netherlands, even Wallonia. 'So, Your Excellency the Governor,' said the Bishop, his silver knife glinting with a cold sheen, reflecting his furrowed brow, 'I do not understand—are you… rising in rebellion against the Empire?'\n\n'No, not at all.' Willem van Nassau chuckled softly, lifting his napkin from the tablecloth. 'Loyal Low Countries merely seek to secure their due interests for all Netherlanders, much like raising a curtain to shield us from the Empire's shadow.' 'All Netherlanders—even including us?' 'Yes, my Lord Bishop, of course. Especially the South. The ark we aim to build is a grand one, and for that we need the unity of the entire Low Countries, North and South, and we need your blessing and that of the Holy See.'"
DD_NED_6a:"May God bless you, Governor."
DD_NED_6a_tt:"@UTR§Y[UTR.GetName]§! has decided to aid us in the §ODutch Revolt§!.\n"
DD_NED_update_reforming_modifier_tt:"The national modifier '§YDutch Reform Progress§!' gains the following additional effects:\n[global_tax_modifier]: §G+5.0%§!\n[reform_progress_growth]: §G+5.0%§!\n"
DD_NED_7_t:"The Governor's Letter Home"
DD_NED_7_d:"To my dear brother:\n\nHow does it feel to be home? I hope the scenery of Nassau remains as gentle and lovely as when we left her as children. What a pity I cannot return with you—The Hague keeps me buried in a mountain of vexing work—but believe me, Hendrik, I miss our family just as much as you do. Please give my regards to Mother and Lady Marianna, and I hope they will like my little gifts.\n\nIn any case, our efforts in the Low Countries are bearing fruit. All throughout the Netherlands, North and South, are slowly but steadily uniting—Frisians, Hollanders, Walloons, and Flemings alike are now coming to see themselves as one people, rallying around our cause. Trust me, Henry, our cause will succeed one day. When we have truly accomplished something great, I sincerely hope to enjoy a leisurely retirement with you in Nassau. Perhaps in Limburg—I have not yet made up my mind."
DD_NED_7a:"Yours sincerely, Willem."
DD_NED_7a_modiifer:"Uniting the Walloons"
desc_DD_NED_7a_modiifer:"The Walloons are Netherlanders too."
#Effect: Gain 100 diplomatic power, +1 accepted culture, accept Walloon culture, enhance modifier "Dutch Reform Progress," national tax modifier +10%, advisor cost -20%, monthly autonomy change -0.1
DD_NED_8_t:"Letter from the Rhine"
DD_NED_8_d:"Dear Willem:\n\nI am delighted to learn that things are going well in the Netherlands, and I congratulate you on taking another step toward the freedom of the Low Countries. I know this may sound a little formal between brothers, but you know how I am—too stiff and poor with words, and even now, as I hold this pen, I am racking my brain for what to say.\n\nStill, Nassau is as beautiful as you described. Mother and Lady Marianna loved your gifts—especially Lady Marianna, who went on and on about you, saying that you must still love her sweet cakes as you did when you were little. Even Uncle Ludwig's son, Philipp, often speaks of you and admires your work. I think we are indeed marching steadily along the right path."
DD_NED_8a:"Your faithful, Henry."
#Effect: Enhance modifier "Dutch Reform Progress," national tax modifier +15%, advisor cost -30%, monthly autonomy -0.15

DD_NED_9_t:"The Command"
DD_NED_9_d:"Admiral Hendrik, my esteemed brother:\n\nI apologise for disturbing your leave, but I fear you must return to the Low Countries at once. The Imperial nobles and Prince Joachim's faction are hardly willing to watch our success in silence; I dread that dark clouds may yet gather over our heads. Though that outcome seems unlikely, we would do well to prepare for it before the storm breaks.\n\nTherefore, as Imperial Governor of the Circle, I request that you proceed to Friesland without delay, and authorise the formation of a united Low Country force, so that we may strengthen our armed might and unite our countrymen and soldiers. The Netherlands needs a strong army—a sharp blade to defend itself. General, I trust you will bring it to us."
DD_NED_9a:"'Willem van Nassau, Imperial Governor.'"
DD_NED_9a_modifier:"Emergency Mobilisation"
desc_DD_NED_9a_modifier:"Time is not on our side."
DD_NED_10_t:"The Response"
DD_NED_10_d:"To His Excellency the Imperial Governor:\n\nI have received your orders from The Hague, and I am now en route north. A well-drilled joint force will be organised shortly to meet any threat that may arise."
DD_NED_10a_tt:"When the §ODutch Revolt§! disaster occurs, we shall control §Y[4383.GetName]§! instead of @BRB§Y[BRB.GetName]§!.\n"
DD_NED_10a:"'Hendrik van Nassau.'"
DD_NED_10a_modifier:"Joint Training"
desc_DD_NED_10a_modifier:"A well-drilled army."
DD_NED_11_t:"The Constitution of Ghent"
DD_NED_11_d:"As the autonomy movement in the Netherlands surged forward, the Low Country provisional parliament controlled by the Republican League swiftly reorganised and convened a constitutional assembly in Ghent. The new Imperial Circle constitution reaffirmed the Low Countries' loyalty to the Empire and the inviolability of their autonomous rights, while declaring that all powers of taxation and corvée levying would henceforth be vested solely in the Low Country parliament.\n\nWhat enraged the Imperial representatives most, however, was the provision declaring that the Regent would serve only as a symbolic figure of the Empire's authority, while actual governance would be exercised by the Governor—reducing the Regent's power to little more than a cipher. The German noble delegates stormed out in fury, but their departure could not prevent the constitutional assembly from restoring to the Low Countries the freedom that was rightfully hers."
DD_NED_11a:"Long live the free Low Countries!"
DD_NED_11a_tt:"The §ODutch Revolt§! disaster gains an additional §R+2.0§! monthly progress.\n\nThe national modifier '§YDutch Reform Progress§!' is replaced by '§YThe Constitution of Ghent§!,' with its effects §Rhalved§!, but it will now persist until the end of the game.\n"
DD_NED_11a_modifier:"The Constitution of Ghent"
desc_DD_NED_11a_modifier:"A constitution for the people of the Low Countries!"
#Effect: Replace "Dutch Reform Progress" with "The Constitution of Ghent"; reform progress growth +10%, production efficiency +10%, national tax modifier +10%, prosperity growth +10%, development cost +10%, autonomy change -0.05, national manpower modifier +10%. The Hohenstaufen will be outraged by this.

DD_NED_12_t:"How Could the Moth Give Itself to the Flame"
DD_NED_12_d:"Tumult, carnage, and fire.\n\nWillem knew well what was unfolding in The Hague. He pushed open the wide window and cast his gaze upon the chaotic streets below. Surging crowds, brawling soldiers, bloody skirmishes. Torches painted the pitch-black night a fierce red, and he could already see the cold glint of pikes and swords among the throng, drawing ever closer to his residence—ever closer to his dream.\n\n'Has there been any reply to the letter sent north?' 'Not yet, sir.' His aide watched the Governor by the window with tense anxiety and forced out the words in a rush: 'Please, you must withdraw at once! Your guard can still—' 'No need, Mark.' The Governor did not turn around; he kept his eyes fixed on the crowd beyond the window, his hands gripping the sill.\n\n'Good evening, Governor.' A squad of soldiers roughly shoved open the doors, and the lavishly dressed Prince entered the office amid his escort. Willem still gazed out the window; he saw crimson flames already licking at the street corners, and the deafening roar of chaos rolled in from afar. Everything he had built, everything he had striven for, seemed to be collapsing swiftly, reduced to smouldering ashes in the wake of the blaze.\n\n'It is over. Dismiss your government now and hand over your authority; the Empire will still grant you a comfortable retirement.' 'Is that so? Perhaps.' At last the Governor turned to face the young Prince before him.\n\n'I knew my cause would one day be consumed by fire—I simply did not expect fate to arrive so swiftly.' He laughed lightly, standing before the window framed by the fiery crimson night, spreading his arms beneath the vast sweep of stars. The cold moonlight streamed down his arms toward the splendid city bathed in flames, like a river of silver light racing toward the distant fields.\n\n'Behold, Your Highness. This is my homeland, my native soil. Since fate gave me life here, I am destined to die for it as well.'"
DD_NED_12a:"With that, the Governor leaned gently backward and fell like a shooting star into the blazing inferno."
#Effect: Current ruler dies. Joachim von Hohenstaufen (3 3 2, age 17) becomes ruler. Government changes to Monarchy. All Low Countries nations supporting the Hohenstaufen become Dutch vassal states of the Netherlands (Friesland will never be swayed; Ghent, Hainaut, and Brabant are pre-set as already swayed). Independence desire -100%. Enact Tier 1 reform "Imperial Circle." Ruler is titled "Regent." Noble influence -10%, national manpower modifier +10%, unrest +1. Parliament enabled. Dynasty locked. No heir. Imperial governance abilities enabled: Levy Taxes (gain half-year income), Conscript Labour (gain 20% of manpower cap), Request Aid (recruit infantry equal to 15% of army cap in capital), each usable once per year, at the cost of paying Imperial tax to the Emperor each year—the higher the development, the more paid (transferred to the Emperor's treasury).
#Trigger conditions: Year 1450, or complete the mission "Enact an Autonomous Constitution."
DD_NED_13_t:"The Tide of Fury"
DD_NED_13_d:"Faster, faster still.\n\nHendrik led his army, sweeping through the riotous streets without difficulty. He saw the wild flames leaping and raging unchecked across The Hague, and felt an immense weight dragging his heart down into an unfathomable abyss. His troops thundered through the city's thoroughfares, leaping over ruins still licked by embers, cutting down anyone who dared stand in their way.\n\nBut he was too late. He saw a tide of soldiers encircling the building like an impenetrable wall. 'Get out of my way!' The frenzied general brandished his sabre, yet could not break through that iron rampart. 'No one is permitted to approach!' The opposing officer drew his blade as well. 'I told you, His Highness has ordered—'\n\nThe sharp crack of shattering glass drew the officer's attention. He turned and saw the idealistic moth plummeting into the fire…"
DD_NED_13a:"…crashing to the ground with a heavy thud."
#Effect: If the United Provinces path is chosen, the player nation switches to Friesland. Double Frisian separatists rise in revolt in The Hague. Hendrik van Nassau (3 2 5, age 42) becomes ruler of Friesland. Declare war on Holland with the "Netherlands Revolution" casus belli; allies cannot be called, and peace cannot be made. If the mission "Friendship Across the Strait" has been completed, London will join the war on our side. If the mission "Papal Blessing" has been completed, gain modifier "Blessed Cause" for 10 years: army morale +10%, reinforcement speed +10%, manpower recovery speed +10%. If "Enact an Autonomous Constitution" has not been completed, skip the missions "Stabilise the Nation," "Unite the People," "Integrate Provincial Rights," "Form the Government," "Reform the Combined Army," and "Enact an Autonomous Constitution," remove modifier "Dutch Reform Progress," and gain modifier "Chaotic Government" for 10 years: army morale -10%, morale damage taken +10%. If the Imperial path is chosen and the mission "Friendship Across the Strait" has been completed, gain modifier "English Aid" for 10 years: blockade impact on siege +1, war tax cost -50%. If the mission "Papal Blessing" has been completed, gain modifier "Blessed Cause" for 10 years: army morale +10%, reinforcement speed +10%, manpower recovery speed +10%. If "Enact an Autonomous Constitution" has not been completed, skip the missions "Stabilise the Nation," "Unite the People," "Integrate Provincial Rights," "Form the Government," "Reform the Combined Army," and "Enact an Autonomous Constitution," remove modifier "Dutch Reform Progress," and gain modifier "Contradictory Government" for 10 years: national manpower modifier -15%, discipline -5%. If completed, Friesland retains the modifier "The Constitution of Ghent," and Holland gains 5 infantry units in The Hague.

DD_NED_14_t:"The Relic"
DD_NED_14_d:"In the Governor's office at The Hague, one old drawer stood out from the rest. Its brass handle, worn to a dull amber sheen with flecks of dark gold, was stubbornly jammed in the desk, refusing to be pulled open.\n\nWith a hard yank, the drawer gave way with a groaning creak. A letter, whole and intact, drifted out as lightly as a butterfly across a spring meadow and settled quietly upon the desk of the late Governor.\n\n'To my dear successor:\n\nIf you are reading this letter, then I have likely already left The Hague. Perhaps I have passed away; perhaps I am enjoying a peaceful and happy retirement in the countryside of Limburg. Rest assured, I am certain that you will walk the right path—whether or not it is the same as mine, you will find for the Netherlands and her people a free and bright road to the future. May your cause prosper in every way.'"
DD_NED_14_d2:"Joachim sat in the Governor's office at The Hague, watching coldly as servants carried in one fine piece of furniture after another—among them, statues of Roman emperors brought all the way from the palaces of Sicily. At last, his gaze fell upon the old desk. In a room of such refined taste, this eccentric piece stood out as an eyesore. He waved his hand, and the servants scrambled forward, trying to haul the desk out, yet for some reason they could not budge it an inch. At the end of his patience, Joachim was seized by an inexplicable restlessness and fury; he snatched a greatsword from one of the guards and split the desk in two. A crumpled sheet of paper fluttered out from the splinters, like a white butterfly across a spring meadow, flitting toward the window and vanishing without a trace."
DD_NED_14a:"It was signed 'Willem van Nassau'."
DD_NED_14b:"It is finally over."
DD_NED_14b_tt:"Now that the §YHohenstaufen§! of @SWA§YSwabia§! have fallen, our time has come. Let us proclaim ourselves the rightful heirs of the @HRE§YHoly Roman Empire§! and win glory for our Prince!\n"
DD_NED_14b_tt2:"While this modifier is active, unlock the casus belli '§YReclaim the Imperial Throne§!,' allowing us to become §YHoly Roman Emperor§! through war.\n\nOnce we become §YEmperor§!, this modifier will be removed.\n"
DD_NED_14b_modifier:"Netherlands Reichskommissariat"
desc_DD_NED_14b_modifier:"The Netherlands Imperial Commissionerate was established as a tax-collecting district after the dynastic union between the Hohenstaufen and Wittelsbach families, which brought the Low Countries as a gift. The Emperor imposed heavy levies on the Low Countries under pretexts such as the French invasion, to sustain the vast expenditures of the Empire.\n\n§YEach state within the Reichskommissariat of the Netherlands provides a substantial tax revenue to the Emperor.§!\n\n§YIf we are no longer a Kommissariat, remove all related modifiers.§!\n"
DD_NED_14b_modifier3:"Just Cause"
desc_DD_NED_14b_modifier3:"Our rule shall be divine!"
