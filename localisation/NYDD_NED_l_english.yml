DD_NED_form_WIC_title:"@VO4Authorise the West India Company"
DD_NED_form_WIC_desc:"The West India Company manages and regulates trade across the Americas, with its headquarters in the Caribbean, diligently channelling every ounce of wealth to the Dutch fatherland."
DD_NED_form_new_ams_title:"@VO2Establish New Amsterdam"
DD_NED_form_new_ams_desc:"With wave after wave of colonists arriving in eastern America, New Amsterdam—once just a small fishing village—has quickly grown into our colonial hub in eastern America. It is time to establish an overseas colonial dominion."
DD_NED_form_afrika_title:"@VO1Establish the Afrikaner Bond"
DD_NED_form_afrika_desc:"The East African coast has attracted a large number of Dutch immigrants, who have gradually taken over local towns and petitioned us for autonomy."
DD_NED_form_north_com_title:"@VO3Authorise the Northern Shipping Company"
DD_NED_form_north_com_desc:"The Northern Shipping Company operates shipping across North America and even Northern Europe; they wish to invest in establishing a base in the northern New World."

