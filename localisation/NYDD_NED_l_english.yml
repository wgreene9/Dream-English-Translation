NYDD_NED_treathen_freedom_title:"Intimidate the Free Cities"
NYDD_NED_treathen_freedom_desc:"Freedom does not last—better to become part of the glorious Netherlands."
NYDD_NED_rise_up_eng_union_title:"The Channel Alliance" # Elevate the Channel Alliance
NYDD_NED_rise_up_eng_union_desc:"Our alliance with the English is growing ever more intricate—let us upgrade it. Simple enough: we become the overlord, do we not?"
NYDD_NED_united_kingdom_title:"This Shore Is That Shore"
NYDD_NED_united_kingdom_desc:"The land of England feels just as comfortable as the land of the Netherlands—no wonder so many have sought to invade it."

