NYDD_NED_develop_swamp_title:"Develop the Marshes"
NYDD_NED_develop_swamp_desc:"The marsh waters run deep—I can hardly keep my footing."
NYDD_NED_unite_netherland_title:"Unwavering Resolve"
NYDD_NED_unite_netherland_desc:"War is not performance art—if we fight, we fight to the end, until all the Low Countries are united."
NYDD_NED_normandy_title:"Chasing Waves and Sounds" # Riding the Waves, Chasing the Sound
NYDD_NED_normandy_desc:"Greetings to our friends in Normandy!"
NYDD_NED_france_title:"The Seat of the Iris"
NYDD_NED_france_desc:"Let us not forget that above the throne of Paris hangs the Sword of Damocles—we must handle our relations with care."

NYDD_NED_swamp_terrain_modifier:"Low Country Marshes"
desc_NYDD_NED_swamp_terrain_modifier:"This province is covered in extensive marshes and mud, unsuitable for development. However, with sufficient investment, the marshes could be reclaimed as farmland.\n\n§YWhen province development reaches at least §M10§!, after §M2§! development increases, this modifier will be removed.§!\n"
NYDD_NED_develop_swamp_tt:"Prevents the §YFrisian Rebellion§! event '§YThe Arumer Black Band Revolt§! from occurring.\n"
NYDD_NED_develop_swamp_tt2:"£yes£We have fulfilled our promise to the Frisians—they are delighted; the above reward duration is §Jextended§! to §Gpermanent§!.\n"
NYDD_NED_develop_swamp_modifier:"Overjoyed"
desc_NYDD_NED_develop_swamp_modifier:"The Frisians never imagined we would truly develop this land."
NYDD_NED_develop_swamp_tt3:"§RWe made a promise and never kept it…§!\n"
NYDD_NED_develop_swamp_modifier2:"Another Ruler"
desc_NYDD_NED_develop_swamp_modifier2:"Just another ruler, no different from the rest.\n"
NYDD_NED_normandy_modifier:"Master Diplomat"
desc_NYDD_NED_normandy_modifier:"Kind words forge kind bonds; harsh words wound the heart."
NYDD_NED_normandy_tt2:"The Normans came to pillage our lands centuries ago, and have since become an inseparable part of France. How shall we treat them—grant them the status of a §Yforeign Confederation member§!, or §Jabsorb§! their greeting?\n"
NYDD_NED_france_tt:"We must decide the course of our relationship with the French—shall we be §Jeternal friends§! or §Rallies of convenience§!?\n\nIf both missions '§YChasing Waves and Sounds§!' and '§YThe Walloon Fields§!' are completed §Mdiplomatically§! for the same nation, this event will unlock additional options.\n"
NYDD_NED_france_tt2:"The crimes France has committed against the Low Countries are beyond counting—it is time to §Rerase§! them from the map. But in what form?\n"

NYDD_NED_new_sun_arise_title:"A New Sun Rises"
NYDD_NED_new_sun_arise_desc:"At last, after the long Dutch Revolt, [Root.GetName] is reborn. The new Dutch government shall rule these lands, faithful to the cause."
NYDD_NED_clean_up_title:"Tidy Up the Remnants"
NYDD_NED_clean_up_desc:"Beyond the centre, a few minor states have yet to join—let us tidy up the remains."
NYDD_NED_wallonia_title:"The Walloon Fields"
NYDD_NED_wallonia_desc:"Beyond the Walloon fields lie the ever-watchful French. They have tried invasion once, and they will surely try again. We must prepare in advance—strike first."
NYDD_NED_king_of_channel_title:"Master of the Channel"
NYDD_NED_king_of_channel_desc:"Once we have unquestionably mastered the trade of the English Channel, it is time to give it a new name."
NYDD_NED_brittany_title:"Peninsular Push"
NYDD_NED_brittany_desc:"On the distant Breton peninsula, there is a people who refuse to bow to France. We could try to make contact and see if cooperation is possible."
NYDD_NED_between_two_sea_title:"Between Island and Wave" # Between Islands and Waves
NYDD_NED_between_two_sea_desc:"There are countless islands in the world, and the waves never cease. The days of the Dutch being beasts of burden are over. Now, on this great chessboard of the world, others are our pieces."

NYDD_NED_new_sun_arise_tt:"§Y[Root.GetName]§! gains §Gcores§! on all non-§YWalloon§! culture provinces in the §YLow Countries§! region.\n"
NYDD_NED_new_sun_arise_modifier:"Unity Enthusiasm"
desc_NYDD_NED_new_sun_arise_modifier:"Our people believe it is time to establish a unified state for the Low Countries."
NYDD_NED_clean_up_tt:"Aggressive expansion impact from all §YHoly Roman Empire§! states toward §Y[Root.GetName]§! is reduced by §G-25.0§!.\n"
NYDD_NED_clean_up_modifier:"Administrative Integration"
desc_NYDD_NED_clean_up_modifier:"As we consolidate our foothold across the Low Countries, the administrative system expands accordingly."
NYDD_NED_clean_up_modifier2:"Joyous Entry"
desc_NYDD_NED_clean_up_modifier2:"The people of all Low Country regions welcome our arrival."
NYDD_NED_king_of_channel_modifier:"Trade Expansion"
desc_NYDD_NED_king_of_channel_modifier:"A time of great trade."
NYDD_NED_king_of_channel_tt:"While this modifier is active, §Jupgrading§! a §YCentre of Trade§! grants §G1§! base production.\n"
NYDD_NED_wallonia_tt:"We may establish a @PIC§YPicard§! subject state, or §Mintegrate§! the Picardy region into the Low Country administration.\n"
NYDD_NED_wallonia_modifier:"Entry Permit"
desc_NYDD_NED_wallonia_modifier:"Under the banner of friendship, we shall conduct trade."
NYDD_NED_brittany_modifier:"Hard-Won Friendship"
desc_NYDD_NED_brittany_modifier:"In these difficult times, at least we still have each other."
NYDD_NED_brittany_tt:"We may choose to establish a @BRI§YBrittany§! subject state, or §Jembrace§! their culture.\n"

NYDD_NED_north_trader_title:"Hanseatic Merchants"
NYDD_NED_north_trader_desc:"The perfidious Hanseatic merchants have long monopolised Baltic trade and hold sway over our lifelines. Though many Dutch merchants trade with them, we must still strive to squeeze them out so as not to be beholden to others."
NYDD_NED_hansa_title:"Sunset Upon the Sea"
NYDD_NED_hansa_desc:"As the saying goes, sunset is but natural order."
NYDD_NED_baltic_trade_title:"Baltic Trade"
NYDD_NED_baltic_trade_desc:"Baltic trade—truly heartwarming."
NYDD_NED_north_company_title:"North Sea Shipping"
NYDD_NED_north_company_desc:"The North Sea Shipping Company is an emerging enterprise, primarily engaged in shipping between Northern Europe and North America, as well as military escort services."

NYDD_NED_north_trader_tt:"During the §YSecond North–South War§!, we will fight §Oside by side§! with §Y[north_fed_leader.GetName]§!.\n"
NYDD_NED_hansa_ttt:"Fight alongside §Y[north_fed_leader.GetName]§! and win the §YSecond North–South War§!"
NED_HANSA_ALLIANCES2:"Gratitude for War Contributions"
NYDD_NED_hansa_modifier:"Lübeck Monopoly"
desc_NYDD_NED_hansa_modifier:"We have succeeded in monopolising trade in Lübeck."
NYDD_NED_north_trader_tt2:"If the §YSecond North–South War§! has not yet §Obroken out§!, and we have §G125§! relations with §Y[north_fed_leader.GetName]§! or are §Mallied§! to them, we will fight §Oside by side§! with §Y[north_fed_leader.GetName]§!.\n"
NYDD_NED_north_trader_tt3:"This effect only applies if we are an §Yindependent nation§!.\n"
NYDD_NED_north_trader_modifier:"Challenging the Hanseatic League"
desc_NYDD_NED_north_trader_modifier:"The Hanseatic merchants have dominated Lübeck's trade for too long—time for a change."
NYDD_NED_north_company_KEY:"A New Alliance"
NYDD_NED_north_company_modifier:"Mutual Benefit"
desc_NYDD_NED_north_company_modifier:"How long will this alliance of convenience last?"
NYDD_NED_north_company_modifier2:"Mutual Benefit"
desc_NYDD_NED_north_company_modifier2:"By entrusting our domestic trade to the Low Countries, it seems we are making more money?"
NYDD_NED_north_company_KEY2:"Abolish the Hanseatic League"
NYDD_NED_north_company_modifier3:"Watching from Across the Shore"
desc_NYDD_NED_north_company_modifier3:"Our merchants, in the course of trade, occasionally 'accidentally' smuggle a few North German weapons."

NYDD_NED_control_danmark_title:"Grip the Throat"
NYDD_NED_control_danmark_desc:"The Øresund controls the only passage in and out of the Baltic—we must command it, or we shall be strangled."
NYDD_NED_conact_north_grain_title:"Secure the Granary"
NYDD_NED_conact_north_grain_desc:"For a long time, the Low Countries' grain supply has depended on Baltic exports. This is clearly precarious—we must find a more stable source of food."
NYDD_NED_trade_system_title:"Trading Post System"
NYDD_NED_trade_system_desc:"Drawing from the Hanseatic merchants' trading post system, we Dutch can develop our own trade network."
NYDD_NED_trade_empire_title:"Commercial Empire"
NYDD_NED_trade_empire_desc:"We Dutch have built a commercial empire that encircles Europe—just as the Spanish are born to burn heretics, the Dutch are born to trade."

NYDD_NED_control_danmark_modifier:"Sound Toll"
desc_NYDD_NED_control_danmark_modifier:"With a strait this large, not taxing it would be a missed opportunity."
NYDD_NED_trade_empire_modifier:"Trade Instinct"
desc_NYDD_NED_trade_empire_modifier:"Some say the Dutch are born traders—this is obviously false. We just happen to be good at it."
NYDD_NED_trade_empire_tt:"For each level of §YTrade Centre§! under our control, we gain §G+1§! mercantilism.\n"
NYDD_NED_conact_north_grain_modifier:"Full Granaries"
desc_NYDD_NED_conact_north_grain_modifier:"Never seen so much grain—this should last a while."
NYDD_NED_conact_north_grain_modifier2:"Imported Grain"
desc_NYDD_NED_conact_north_grain_modifier2:"Recent grain imports have cost us a pretty penny.\n\n§YWhen this modifier expires, the effect of 'Full Granaries' is §Gdoubled§!.§!\n"
NYDD_NED_conact_north_grain_tt:"When the modifier '§YImported Grain§!' expires, the effect of '§YFull Granaries§!' is §Gdoubled§!.\n"
NYDD_NED_conact_north_grain_modifier3:"Barns Overflowing"
desc_NYDD_NED_conact_north_grain_modifier3:"Now there is truly more than enough to eat."
NYDD_NED_conact_north_grain_tt2:"Our ample grain reserves will §Gprevent§! the '§YPeasant Revolt§!' disaster from occurring.\n"
NYDD_NED_conact_north_grain_ttt:"Any §Yally§! or §Ysubject§! meets at least one of the three conditions above."

NYDD_NED_dam_it_title:"Dam Works"
NYDD_NED_dam_it_desc:"Dams! Why is it always dams!"
NYDD_NED_make_sea_land_title:"Land Reclamation"
NYDD_NED_make_sea_land_desc:"Alas, our Low Countries are still too low. What to do? Naturally, reclaim land from the sea—borrow a little ground from the ocean."
NYDD_NED_amsterdam_port_title:"Port of Amsterdam"
NYDD_NED_amsterdam_port_desc:"Amsterdam—the greatest port in the world, the economic heart of Western Europe…"
NYDD_NED_great_city_title:"Dutch Metropolis"
NYDD_NED_great_city_desc:"The Netherlands is far too urbanised—every city is packed to the brim. What splendid economic growth!"
NYDD_NED_black_devil_title:"The Black Devils"
NYDD_NED_black_devil_desc:"We strive for excellence in maritime affairs; therefore, we must instil pride and discipline in the marines aboard our most legendary vessels."

ned_zuiderzee_works_modifier:"Dam Works"
desc_ned_zuiderzee_works_modifier:"These newly established dam works will allow the Low Countries to flourish."
ned_dike_any_level:"Has at least §Y1§! level of §YDikes§!"
ned_enacted_amsterdam_decision_tt: "Has enacted the decision '§YReclaim Land in Amsterdam§!'"
NYDD_NED_make_sea_land_tt:"Unlock the great project '§YZuiderzee Works§!' in §Y[97.GetName]§!.\n"
NYDD_NED_make_sea_land_tt2:"The great project '§YDutch Polders§!' at §MLevel 3§! additionally grants:\nGoods produced modifier: §G+5.00%§!\nProvincial trade power modifier: §G+20.0%§!"
NYDD_NED_amsterdam_port_tt:"The great project '§YAmsterdam Stock Exchange§!' at §MLevel 3§! additionally grants:\nTrade steering: §G+25.00%§!\nYearly inflation reduction: §G-1.00§!\n"
NYDD_NED_great_city_tt:"All current and future §YLow Country§! provinces that reach §Y30§! development will gain:"
NYDD_NED_great_city_modifier:"Dutch Metropolis"
desc_NYDD_NED_great_city_modifier:"This province is home to a great city—truly magnificent."
NYDD_NED_great_city_tt2:"When a §Mbuilding§! is completed in a §YLow Country§! province, it gains §G+20.0%§! prosperity and §G1§! random development point.\n§g(Can trigger once every five years per province)§!\n"
NYDD_NED_great_city_tt3:"Provinces with this modifier have a §G+20.0%§! chance of gaining an additional §G1§! development point when §Mdeveloping§!.\n"
NED_unified_confession_modifier_DD:"Religious Unity"
desc_NED_unified_confession_modifier_DD:"Maintaining religious unity is of vital importance to our state."

NYDD_NED_water_power_title:"Waterworks Engineering"
NYDD_NED_water_power_desc:"We have always been a people living by and from the sea. Water transport is cheaper than horses or railways—it is wise to use our extensive waterways to connect cities with canals for passenger and freight transport. Canals also facilitate the movement of heavy cargo, helping accelerate our urban construction projects."
NYDD_NED_cloth_title:"Cloth Trade"
NYDD_NED_cloth_desc:"The workshops spread across our provinces are renowned for the quality of their cloth and thread. A combination of techniques and the expertise of local artisans has created the finest garments known across all of Europe."
NYDD_NED_navy_title:"Dutch Admiralty"
NYDD_NED_navy_desc:"Since the days of our struggle for independence, we have repelled countless enemies and vied for mastery of the vast oceans. The time has come to have an enlightened council of admirals enact radical naval reforms, driving the expansion and modernisation of our fleet so that we may never again be forced to beg our neighbours for aid!"
NYDD_NED_navy2_title:"Life at Sea"
NYDD_NED_navy2_desc:""

NYDD_NED_water_power_modifier:"Waterworks Engineering"
desc_NYDD_NED_water_power_modifier:"This province is actively engaged in waterworks construction."
ned_three_canals_plan_tt:"If, before this modifier expires, the relevant province has §Y3§! levels of §MDikes§!, this modifier will become a §Gpermanent modifier§!.\n"
ned_city_planner_tt: "\nThis advisor grants us an additional:\nDevelopment cost: §G-2.0%§! per level.\n\nUnlock the £adm£ advisor type '§YPlanner§!' (§YDevelopment cost: §G-10.0%§!§!).\n"
NYDD_NED_cloth_tt:"§Y5§! random eligible provinces under our control will receive an §Gupgrade§! to their §Yproduction§! building.\n"
NYDD_NED_navy2_modifier:"Life at Sea"
desc_NYDD_NED_navy2_modifier:"We came from the sea, and in the sea we shall spend our days."
NED_organizing_the_church_modifier_DD:"Church Reorganisation"
desc_NED_organizing_the_church_modifier_DD:"The once-chaotic Low Country church will be reorganised."

NYDD_NED_pubulic_land_title:"Public Lands"
NYDD_NED_pubulic_land_desc:"Though most of our territory is under central government rule, many lands remain under the direct control of local nobles. Should the provinces rebel, we must rely on these public lands to ensure the central government's strength. Only by establishing a robust power base for the crown can we maintain the unity of this nation of diverse customs."
NYDD_NED_diamond_title:"Sparkling Diamonds"
NYDD_NED_diamond_desc:"Diamonds are truly beautiful—enough to drive one mad."
NYDD_NED_city_graud_title:"City Guard"
NYDD_NED_city_graud_desc:"The threat of invasion looms ever present. The best way to avoid invasion is to raise the cost of aggression. By building fortresses across the land and manning them with capable hands, we shall become a hedgehog poised to strike any invader. Guild militias are the ideal choice—these musketeers have long served as city guards and can form the core of our national army."
NYDD_NED_sea_trader_title:"Sea Beggars"
NYDD_NED_sea_trader_desc:"Over the years, we have faced and defeated many powerful enemies. Now, no one can stand against us—the sea lions who roam the oceans at will."
ned_athenaeum_illustre_title:"Athenaeum Illustre"
ned_athenaeum_illustre_desc:"Innovation is the wellspring of power and wealth, and universities have become hubs of innovation. Yet not all of the finest minds have the opportunity to attend traditional universities. Some cities have begun funding new institutions known as Athenaeum Illustre, where gifted students can earn degrees more quickly. We should expand this system, for educating the people will benefit us all."

NYDD_NED_pubulic_land_tt:"When using the estate interaction '§YConfiscate Estate Lands§!', an additional §Y-1.00%§! of estate land is confiscated.\n"
NYDD_NED_pubulic_land_modifier:"Land Reform"
desc_NYDD_NED_pubulic_land_modifier:"Through land reform, we bring land under royal ownership."
