desc_DD_NED_com_merc_button_modifier:"Mercenaries who fight for coin are gathered here, awaiting their next commission."
DD_NED_com_shipyard_button_modifier:"Company Shipyard"
desc_DD_NED_com_shipyard_button_modifier:"A shipyard established by the shipping company—efficient, cost-effective, and productive."
DD_NED_com_corrution_button_modifier:"Secret Understanding"
