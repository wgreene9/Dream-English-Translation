DD_NED_51_t:"The Peace of the Iris"
DD_NED_51_d:"The peace between France and the Netherlands has now surpassed any era before it. People cannot help but wonder: is lasting peace truly possible between these two rivals, whose interests so often conflict? The answer speaks for itself. Now that this peace seems to have blossomed, how shall we treat its fruit?"
DD_NED_51a:"Propose further cooperation."
DD_NED_51b:"Let this peace endure."
DD_NED_51c:"It is time to reap the harvest."
DD_NED_51c_modifier:"Preparations for Invasion"
desc_DD_NED_51c_modifier:"Friendship is merely a prelude to further expansion—after all, only then can lasting peace exist between the two nations."
DD_NED_51b_modifier:"The Peace of the Iris"
desc_DD_NED_51b_modifier:"We shall maintain our friendship with one of Europe's most powerful nations."
DD_NED_51a_modifier:"French Military Studies"
desc_DD_NED_51a_modifier:"Through officers studying in France, we shall form units modelled after the French musketeers."
DD_NED_51a_tt_yes:"£yes£If §Y[193.Owner.GetName]§! §Gagrees§!:"
DD_NED_52_t:"Peace in Our Time"
DD_NED_52_d:"The Dutch have proposed a vision: the possibility of peaceful coexistence between the French and the Dutch. Through a series of military cooperation agreements and treaties, peace between us may be achieved."
DD_NED_52a:"Agree to sign the treaty."
DD_NED_52b:"This does not serve our interests."
DD_NED_52a_modifier:"Dutch Merchant Ships"
desc_DD_NED_52a_modifier:"By studying at the shipyards of The Hague, our craftsmen quickly built better and faster merchant vessels."
DD_NED_FRA_ally_flag:"Netherlands–France Alliance"
DD_NED_52a_tt:"This will also change the §Mconditions§! and §Mrewards§! of the missions '§YAn Eye for an Eye§!' and '§YDevelop the Netherlands§!.\n"
DD_NED_53_t:"Conquest of Normandy"
DD_NED_53_d:"Ever since 'Longsword' Willem and his father formally received their Frankish fiefs, the Normans began their integration into the feudal system of Western Europe. The Duchy of Normandy lies adjacent to the Walloon region and possesses a culture distinct from that of metropolitan France; the Norman dialect belongs, like Walloon, to the Oïl language family—different branches of Old French. The Normans of France and our Walloon people share the same Old French cultural sphere; they are natural brothers.\n\nNow, all of Normandy and the Channel Islands are under our control. It is time to liberate the Normans from the rule of the House of Anjou and welcome them into our wider family. Two voices are heard within our government: one argues for full integration of the Normans into our realm; the other advocates a more measured approach, making Normandy a vassal state."
DD_NED_53a:"Normandy is an indivisible part of our nation."
DD_NED_53b:"Welcome the Normans into our alliance!"
DD_NED_54_t:"Overtures to Little Britain"
DD_NED_54_d:"As a Celtic region long distinct from metropolitan France, Brittany has always been an independent-minded outlier apart from Parisian politics. The people of Little Britain can no longer tolerate the imperious princes of Paris—it is time to embrace our Celtic friends and liberate Brittany from French tyranny.\n\nNow, the entire territory of the Duchy of Brittany lies under our control. It is time for the Bretons to welcome a new life of their own. A fresh Breton government, free from French interference, shall be re-established. Shall we incorporate Little Britain directly into our lands, or establish a new vassal state here?"
DD_NED_54a:"Make Brittany a vassal state."
DD_NED_54b:"Welcome Brittany into our fold."

DD_NED_55_t:"Annexing Picardy"
DD_NED_55_d:"The Picardy region of the Kingdom of France is home to a large Flemish population. The Picard dialect they speak is very similar to the Dutch and French dialects used by our Flemish people, so the resistance to incorporating them into our country would likely be far less than in other regions. The status of Flanders has also been a key point of contention in previous Walloon Wars between us and France.\n\nNow that Picardy is under our control, it is time to decide its fate. Shall we establish a new Dutch vassal state and bring Picardy into our alliance? Or shall we fully annex the region and integrate the Picards into our Low Country people? The choice is ours."
DD_NED_55a:"Establish a subject state."
DD_NED_55b:"Grant them autonomy."
DD_NED_55c:"Incorporate into the Flemish region."
DD_NED_55d:"Incorporate into the Walloon region."
DD_NED_55e:"Let us establish a Great Norman Kingdom."
GREAT_NRM_NAME:"Great Normandy"
GREAT_NRM_NAME_ADJ:"Norman"
DD_NED_56_t:"Looming Shadows"
DD_NED_56_d:"In the bustling market of Leuven, the Imperial Knights arrested a merchant who had attempted to plant explosives along the route of the Regent's procession. After interrogation by the Knights—despite the assassin's conspicuous and strange foreign accent—the would-be killer confessed to being acting on orders from the Republican League, intending to assassinate the Regent and liberate the Netherlands from the Empire's tyranny.\n\nThis news landed like a thunderbolt, setting the Governor's Circle ablaze. The Republican League vehemently denied any connection to the assassin, calling it a 'base slander and frame-up.' Meanwhile, pro-Empire councillors openly accused the League of treacherous ambition, demanding that the Empire make these nobles pay. The Governor's Circle council chamber was filled with mutual recriminations and accusations; the Governor himself appealed for restraint on all sides, while the Regent remained noncommittal."
DD_NED_56a:"Disturbing."
DD_NED_56a_tt:"The §ODutch Revolt§! disaster gains an additional §R+2.0§! monthly progress.\n"
DD_NED_57_t:"Overseas Trading Posts"
DD_NED_57_d:"As Dutch merchants conduct business across the globe, numerous trading posts, large and small, have been established worldwide. Managing these vast overseas territories has brought persistent chaos to our administrative system. Some advisors have recalled the Hanseatic League's medieval trading post system and proposed adopting a similar design to unify the administration of these posts. Meanwhile, some merchants have proposed granting them autonomy to bring greater profits to the state."
DD_NED_57a:"Establish the Trading Post system."
DD_NED_57b:"Allow merchant autonomy."
DD_NED_57a_tt:"Provinces in §Ynon-Low Country§! regions that are §YCentres of Trade§! gain:"
DD_NED_57a_tt2:"The above modifiers are §Gdoubled§! in §YTrade Company§! provinces.\n"
DD_NED_57a_modifier:"Dutch Trading Post"
desc_DD_NED_57a_modifier:"This province is part of the Dutch Trading Post system and enjoys higher priority."
DD_NED_57a_modifier2:"Dutch Trading Post (Overseas)"
desc_DD_NED_57a_modifier2:"This province is part of the Dutch Overseas Trading Post system, with higher priority and greater resources allocated to it."
DD_NED_57b_modifier:"Overseas Merchants"
desc_DD_NED_57b_modifier:"Merchants with greater autonomy will pursue wealth with even greater zeal."
DD_NED_58_t:"The Antwerp Diamond Industry"
DD_NED_58_d:"Antwerp's diamond industry began in the 15th century, leveraging its geographical advantages and technological innovations to gradually become the global centre of diamond trading and processing. With its position on the North Sea, Antwerp became the hub for raw Indian diamonds destined for Europe. In 1447, local decrees prohibited the trade of imitation gems, laying the foundation for market integrity. In 1456, Flemish craftsmen invented advanced polishing techniques, achieving symmetrical cuts that greatly enhanced the brilliance and value of diamonds. The 16th century was the golden age of Antwerp's diamond industry, when 40% of Europe's trade flowed through the city, its diamond-cutting craftsmanship renowned across the continent—even the King of France ordered jewellery here."
DD_NED_58a:"Diamonds—such a curious thing."
DD_NED_58b:"Let us invest in glass instead."
DD_NED_58a_modifier:"Antwerp Diamond Industry"
desc_DD_NED_58a_modifier:"Antwerp diamonds are renowned across Europe for their beauty."
DD_NED_58b_modifier:"Antwerp Glass District"
desc_DD_NED_58b_modifier:"Both are shiny things—they all look the same."

DD_NED_59_t:"Calvin's Reformation"
DD_NED_59_d:"John Calvin was born into a lawyer's family in Picardy, France. In his youth, deeply troubled by Europe's religious conflicts and ecclesiastical corruption, he fervently embraced Martin Luther's Reformation. Owing to the French government's policies toward Protestants, Calvin was forced to flee to Basel in Switzerland, where he became the de facto leader of the Geneva city council and the Swiss Reformation.\n\nDuring his time in Switzerland, he compelled citizens to abandon the Catholic faith and follow Luther's church, exiling those who refused. He was himself driven out by a liberal faction composed of lower-class citizens and moved to Strasbourg to serve as a pastor. Though no longer openly advocating reform, he continued to meet privately with various reformers such as Martin Luther, until he was once again expelled by the authorities.\n\nFinally, Calvin arrived in the Low Countries, where the Empire's religious tolerance was greater, and entered the Dutch parliament. During this period, he published his major theological work, Institutes of the Christian Religion, and compiled the Ecclesiastical Ordinances. His doctrine of armed defence of the Gospel was accepted by the Dutch government, leading to a formal break with Luther's church. The Reformed Church established by Calvin in the Netherlands firmly secured its dominant position in the Low Countries' faith. In his view, both church and state were under God's jurisdiction—and when secular authority fell into injustice, it must be replaced by the righteousness of God."
DD_NED_59_d2:"John Calvin was born into a lawyer's family in Picardy, France. In his youth, deeply troubled by Europe's religious conflicts and ecclesiastical corruption, he fervently embraced Martin Luther's Reformation. Owing to the French government's policies toward Protestants, Calvin was forced to flee to Basel in Switzerland, where he became the de facto leader of the Geneva city council and the Swiss Reformation.\n\nDuring his time in Switzerland, he compelled citizens to abandon the Catholic faith and follow Luther's church, exiling those who refused. He was himself driven out by a liberal faction composed of lower-class citizens and moved to Strasbourg to serve as a pastor. Though no longer openly advocating reform, he continued to meet privately with various reformers such as Martin Luther, until he was once again expelled by the authorities.\n\nFinally, Calvin arrived in the Imperial Circle of the Low Countries, far from the Empire's centre of power, and—with some tacit approval from the authorities—obtained a clerical post. During this period, he published his major theological work, Institutes of the Christian Religion, and compiled the Ecclesiastical Ordinances. Unlike the pacifist Luther, Calvin's religious doctrines aligned to some extent with the ambitions of [Root.Monarch.GetTitle], allowing his movement to spread rapidly in the Low Countries—even securing Calvin himself a seat in the Circle's parliament. In Calvin's view, both church and state were under God's jurisdiction—and when secular authority fell into injustice, it must be replaced by the righteousness of God."
DD_NED_59a:"In the name of the Lord!"
DD_NED_59b:"The birth of a new heresy."
DD_NED_59a_tt:"\n§RAs a subject state, this action is outright treason.§!\n"

