DD_NED_49_t:"Across the Channel"
DD_NED_49_d:"Ever since the fall of the Kingdom of England, the whole of southern England has maintained close economic, political, and cultural ties with us, deeply influenced by the cities of the Low Countries. The commercial league of the Low Countries not only graciously granted these English survivors refuge, but also helped them prosper through commercial cooperation.\n\nNow, these English cities have finally been unified under our banner. The cities of the London League, which have long received our military and material aid, have been profoundly shaped by Low Country culture and can naturally accept our rule. The choice now lies before us: shall we incorporate England—once the realm of the Five Boroughs—into our domains, or shall we continue to graciously grant the English their autonomy?"
DD_NED_49a:"Re-establish an English state."
DD_NED_49b:"The English have always been our friends."
DD_NED_49c:"Potatoes, my potatoes, where are you…"
DD_NED_49d:"Let the English merchants serve us."
DD_NED_49b_tt:"As long as @ENG§Y[ENG.GetName]§! is our §Msubject§!, we gain:"
DD_NED_49b_modifier:"Integrated English Merchants"
desc_DD_NED_49b_modifier:"The English merchants willingly help us grow wealthier—after all, we saved their homeland."
DD_NED_49d_modifier:"Integrated English Merchants"
desc_DD_NED_49d_modifier:"The English merchants reluctantly divert trade to us—after all, they have no other choice."
DD_NED_49c_modifier:"Potato Chronicles"
desc_DD_NED_49c_modifier:"If you think of it often enough, it will surely come to pass."

DD_NED_50_t:"The Walloon Victor"
DD_NED_50_d:"The south of the Netherlands has long shared complex historical ties with France, coveted time and again by our southern neighbour. Unlike the Flemings, who speak Low German, the Walloons—who speak French—possess a distinct culture and dwell in the lands of the French kingdom to the south. During the Walloon War instigated by France, we once thwarted the southern invasion with the aid of the Empire—yet this never fully resolved the Walloon question.\n\nNow, the French lands to the south have come under our control; we have become the sole victor of the Second Walloon War. The time has come to decide the fate of the vanquished. We shall compel the new French government to recognise our rightful claim over all Walloon-populated territories and submit to our rule—or else, there shall be no new France at all."
DD_NED_50a:"France must be dismembered, to ensure she can never rise again."
DD_NED_50b:"Let us assist the unification of our new friends."
DD_NED_50c:"Establish a new Governor's Palace in Paris."
DD_NED_50a_tt:"Unlock the Diplomatic-§YInfluence§! action '§YEstablish French Protectorate§!', allowing us to convert §Yvassals§! with their capital in the §YFrance§! region into §YForeign Confederation Members§!.\n\nEach §YForeign Confederation Member§! subject with its capital in the §YFrance§! region grants us:\nNational manpower modifier: §G+2.5%§!\nLand fire damage: §G+1.0%§!\nSubjects with §Y100§! development §Gdouble§! the above effects.\n"
DD_NED_50a_tt_BRB:"Unlock the Diplomatic-§YInfluence§! action '§YEstablish French Protectorate§!', allowing us to convert §Yvassals§! with their capital in the §YFrance§! region into §YCommissionerates§!.\n\nEach §YCommissionerate§! subject with its capital in the §YFrance§! region grants us:\nNational manpower modifier: §G+2.5%§!\nLand fire damage: §G+1.0%§!\nSubjects with §Y100§! development §Gdouble§! the above effects.\n"
