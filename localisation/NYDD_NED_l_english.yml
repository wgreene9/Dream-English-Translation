flavor_hol.EVTDESC1_DD:"In [GetYear], [Root.Monarch.GetName] decided to establish the first university in the Netherlands at Leiden, to educate citizens for religious purposes and to provide the state and government with educated talent in other fields. With the advent of the Scientific Revolution, academic research grew increasingly important, and the city of Leiden, thanks to its flourishing trade, was fortunate enough to become the home of the new university. The name of the Holy Roman Emperor also appeared on the official founding charter, for he remained the de jure lord of the Low Countries—though he forbade any of his subjects from studying at Leiden University."

DD_NED_grant_independence_title:"@NE9Break the Chains"
DD_NED_grant_independence_desc:"With the Emperor defeated on the battlefield, we have the chance to break our chains and contend for our birthright—the throne of the Holy Roman Empire."

