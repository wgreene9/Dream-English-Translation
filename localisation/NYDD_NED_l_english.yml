NYDD_NED_diamond_modifier:"Expanded Diamond District"
desc_NYDD_NED_diamond_modifier:"Through further investment, we have successfully expanded the diamond industry."
ned_innovativeness_per_uni_tt:"Each §YUniversity§! building under our control grants §G0.5§! innovativeness.\n"
ned_20_random_pp_per_uni_tt:"Each §YUniversity§! under our control grants §G20§! random monarch power.\n"
NYDD_NED_city_graud_tt:"Provinces with §YBarracks§! and §YCamp§! buildings §Gdouble§! the above effects.\n"
NYDD_NED_city_graud_modifier:"City Defenders"
desc_NYDD_NED_city_graud_modifier:"The citizens of this city have taken it upon themselves to defend their home."
NYDD_NED_city_graud_modifier2:"City Champions"
desc_NYDD_NED_city_graud_modifier2:"The citizens of this city have voluntarily taken up the defence of their home."

NYDD_NED_centralize_title:"Centralisation Reforms"
NYDD_NED_centralize_desc:"We live in an age of change. The old feudal structures are ill-suited to the needs of a modern state. Many nobles and guilds care more for their own privileges than for the stability of the nation—this must end. We shall centralise the state and create new administrative institutions."
NYDD_NED_deal_with_stanholder_title:"Deal with the Governors"
NYDD_NED_deal_with_stanholder_desc:"The first obstacle to centralisation is the provincial governors—once agents of the great nobles, they have gradually become hereditary petty lords. We must uproot them and redraw the divisions."
NYDD_NED_free_debate_title:"Free Debate"
NYDD_NED_free_debate_desc:"The cornerstone of Dutch law is a court-led system that guarantees freedom for all citizens. To perfect the rule of law nationwide and promote fairness, we must ensure that both the bureaucracy and the legal system operate soundly and stably."
NYDD_NED_mil_reform_title:"Military Reform"
NYDD_NED_mil_reform_desc:"Let us not deceive ourselves. Though we are friendly toward our neighbours, they would gladly see our downfall. To protect our people and defend our homeland, we must study Europe's finest armies, learn from them, and build a force that would give any bold conqueror pause."
NYDD_NED_defense_title:"Low Country Defence Line"
NYDD_NED_defense_desc:"As the saying goes, the best offence is a good defence. Let us draw upon our Low Country traditions and turn these marshlands into an impregnable fortress, one that will strike fear into the hearts of our enemies."

NYDD_NED_deal_with_stanholder_tt:"§GHalves§! the effects of the '§YLegacy of the Republican League§!' modifier.\n"
NYDD_NED_deal_with_stanholder_ttBRB:"Unlock the §M2nd§! tier government reform '§YGerman Military Merit§!' with the following effects:"
NYDD_NED_deal_with_stanholder_ttHOL:"Unlock the §M2nd§! tier government reform '§YLegacy of the Grand Alliance§!' with the following effects:"
NYDD_NED_free_debate_tt2:"Remove the §Rnational unrest penalties§! from the '§YBalance of Power§!' government mechanic.\n"
NYDD_NED_defense_modifier:"Defensive Plans"
desc_NYDD_NED_defense_modifier:"Thorough defensive plans can effectively repel enemy attacks."
NED_dutch_engineering_modifier:"Dutch Engineering"
desc_NED_dutch_engineering_modifier:"After years of defensive warfare, we have developed a feel for it."

NYDD_NED_centralize_modifier:"Gathering Power"
desc_NYDD_NED_centralize_modifier:"By concentrating power at the centre, we shall create a centralised state."

NYDD_NED_gov_power_title:"Stadtholder & Pensionary" # Stadtholder and Grand Pensionary
NYDD_NED_gov_power_desc:"The conflict between the Stadtholder and the Grand Pensionary has grown ever fiercer, with factions coming to blows. We struggle to maintain this alliance and search for possible solutions."
NYDD_NED_united_amry_title:"United Provinces" # United Provincial Army
NYDD_NED_united_amry_desc:"We must reconcile the armies of the various provinces and reorganise them into a disciplined standing force."
NYDD_NED_natianal_amry_title:"National Army"
NYDD_NED_natianal_amry_desc:"The army should be loyal not to provinces, nor to individuals, but to the nation. Its sacred duty is to defend the country from foreign invaders and mobs. To protect itself, we must forge it into a first-rate military power in Europe."

NYDD_NED_gov_power_tt:"In the '§YBalance of Power§!' government mechanic, the thresholds for §OStadtholder§! and §GGrand Pensionary§! bonuses are both reduced by §G20§!—meaning only §G+20§! is needed to gain the effect previously requiring §G+40§!.\n\nThe §Rnational unrest penalties§! from the '§YBalance of Power§!' mechanic are §Rhalved§!.\n"
NYDD_NED_united_amry_modifier:"United Provincial Army"
desc_NYDD_NED_united_amry_modifier:"Assembled from the various Low Country states, centrally administered by the United Provinces government."
NYDD_NED_natianal_amry_modifier:"National Army"
desc_NYDD_NED_natianal_amry_modifier:"A standing army established by the state—its combat prowess is beyond question."

NYDD_BRB_law_title:"Constitution of Brussels" # The Constitution of Brussels
NYDD_BRB_law_desc:"Many complain that the Imperial Circle of the Low Countries lacks a proper constitution. How could this be? We shall promulgate one immediately—to improve tax collection."
NYDD_BRB_order_title:"Imperial Knights"
NYDD_BRB_order_desc:"The Imperial Knights have served us well in the past; now it is time to reward them. By donating Alden Biesen Castle in Limburg to them, they will serve us even better."
NYDD_BRB_control_knight_title:"Mastering the Knights"
NYDD_BRB_control_knight_desc:"The arrogant and overbearing behaviour of the Imperial Knights in the Low Countries can no longer be tolerated. We must tighten the reins and bring them back under control. Let them know who rules!"

NYDD_BRB_control_knight_ttyes1:"£yes£If we have the §YKnights§! estate and complete the mission by granting them §Yestate privileges§!:"
NYDD_BRB_control_knight_ttno1:"£no£If we have the §YKnights§! estate and complete the mission by granting them §Yestate privileges§!:"
NYDD_BRB_control_knight_modifier:"Dutch Knights"
desc_NYDD_BRB_control_knight_modifier:"Though latecomers, our knights still strike fear into enemy hearts. Even a windmill—they will challenge it!"
NYDD_BRB_control_knight_modifier2:"Knightly Bureaucrats"
desc_NYDD_BRB_control_knight_modifier2:"This suits me better."

ned_settle_gold_coast_title: "Settle the Gold Coast"
ned_settle_gold_coast_desc: "During our voyages along the African coast, our merchants frequently stop in West Africa. The region holds gold and other resources, yet is also rife with warring states. Merchants have long called for the establishment of a network of safe ports along the coast, where trade with the natives can be conducted under our protection and in accordance with our laws. Establishing these outposts would also allow us to challenge the Iberian powers' control over Atlantic trade."
ned_slave_trade_title:"Triangular Trade"
ned_slave_trade_desc:"The African slaves yearn to see a new world—let us help them with this small favour."
ned_expand_slave_trade_title: "Expand the Slave Trade"
ned_expand_slave_trade_desc: "The colonies of the New World have an insatiable hunger for slaves to labour on plantations of cash crops such as sugar and tobacco. Those who control the slave trade will amass unimaginable wealth. We must secure the supply of slaves and channel the remaining labour into our own projects—otherwise, our enemies may seize this opportunity."
ned_new_amsterdam_title: "New Amsterdam"
ned_new_amsterdam_desc: "The northern half of the New World is a wild land, yet fertile and abundant in timber and wildlife. Explorers have already found suitable land for colonisation on an island between two great rivers. We should establish a colony there and claim the opportunities of this land for ourselves."

NYAB_NED_settle_gold_coast_modifier:"Settle the Gold Coast"
desc_NYAB_NED_settle_gold_coast_modifier:"The Gold Coast is an indispensable port in West Africa—we must control it."
ned_slave_trade_modifier:"Slave Trade"
desc_ned_slave_trade_modifier:"The slave trade is a vital source of income for our nation."
ned_major_demand_for_labor_modifier:"Labour Demand"
desc_ned_major_demand_for_labor_modifier:"More slaves, better business."
ned_slave_labor_booming_modifier:"Slave Trade Booming"
desc_ned_slave_labor_booming_modifier:"So many slaves. Excellent."

ned_dutch_expedition_title: "Dutch Expedition"
ned_dutch_expedition_desc: "Rumours have reached our court that immeasurable wealth lies beyond the Pillars of Hercules in foreign lands. To maintain our power and expand our influence, we must sail across the boundless ocean and uncover the truth of those distant lands!"
NYAB_NED_discover_new_world_title:"Sail Beyond the Horizon"
NYAB_NED_discover_new_world_desc:"'I would give all I have for but a glimpse of the New World.'"
ned_tame_western_seas_title: "Conquer the Western Seas"
ned_tame_western_seas_desc: "Wealth, fame, power—all that the New World offers is within our grasp. By order of the Low Country [Root.Monarch.GetTitle], countersigned with the state seal, all able-bodied men shall be called to serve at sea."
ned_charter_wic_title: "Charter the West Indies" # Charter the West India Company
ned_charter_wic_desc: "Exploration and colonisation are no easy feats. To regulate the sea lanes and maintain control over overseas markets, we must grant charters to trading companies responsible for security and monopoly."
ned_wilde_kuust_title: "Wild Coast"
ned_wilde_kuust_desc: "In the sunset lands of the West, along the coast of South America, lies a virgin territory. Brave Dutch explorers and their daring men must be the first to set foot on this so-called 'Wild Coast', adding glory to our crown!"
ned_unite_americas_title: "Unite the Americas"
ned_unite_americas_desc: "Unruly colonial territories? Waning European overlords? Mere relics of the past. For we shall establish supreme rule over the New World with an iron fist and efficient administration."

ned_dutch_expedition_tt:"Unlock the government reform '§YGrant Company Monopoly Privileges§!' with the following effects:"
ned_dutch_expedition_tt2:"When §Mexploring coasts§!, there is a §G+50.0%§! chance of gaining a §Yclaim§! on the corresponding province.\n"
ned_dutch_expedition_modifier:"Stellar Expedition"
desc_ned_dutch_expedition_modifier:"Toward the stars and the seas!"
ned_tame_western_seas_modifier:"Taming the Western Seas"
desc_ned_tame_western_seas_modifier:"How strange—these continents appear to have no people at all."
ned_unite_americas_tt:"§GSimplifies§! the trigger conditions for the event '§YColonial Modernisation§!'.\n"
ned_hegemon_of_the_americas_modifier:"Hegemon of the Americas"
desc_ned_hegemon_of_the_americas_modifier:"Hegemony in the Americas is truly splendid."

NYAB_NED_india1_title:"Land of Wealth"
NYAB_NED_india1_desc:"India is a land of such immense wealth—we have long heard tales of spices flowing like gold and empires teeming with people. Though somewhat exaggerated, it still proves worthy of our attention and action."
ned_governate_ceylon_title: "Governorate of Ceylon"
ned_governate_ceylon_desc: "This small island off the southeastern coast of the Indian subcontinent is not only an ideal port for import and export, but also a vital transit point for ambitious Dutch explorers and settlers venturing into the Far East!"
ned_grand_design_title: "Grand Design"
ned_grand_design_desc: "Though we possess a natural talent for navigation and trade, other great powers on the New World's frontiers hold an unfair advantage over our colonists. We must therefore bring territories beyond the seas under our control—whether through diplomacy or by force."

ned_dutch_trade_in_india_key:"Indian Trade"
NYAB_NED_india1_modifier:"Indian Campaign"
desc_NYAB_NED_india1_modifier:"All your wealth shall be ours!"
NYAB_NED_india1_tt:"While this modifier is active, provinces occupied in the §YIndia§! subcontinent will gain:"
NYAB_NED_india1_modifier2:"Private Defence"
desc_NYAB_NED_india1_modifier2:"This province has been garrisoned by a mercenary force."
ned_every_cot_in_brazil_owned_by_us_or_subject_tt:"All §YCentre of Trade§! provinces in the §YBrazil§! region under our control gain:"

ned_beyond_cape_title: "Beyond the Cape"
ned_beyond_cape_desc: "What lies beyond the chartered coast? Tales of treasure, gold, and wealth are for now merely rumours from the far side of the Cape of Good Hope. Let us send forth brave men versed in coin and navigation to uncover the secrets beyond the sea…"
ned_stadthuys_title: "The Stadthuys of Malacca"
ned_stadthuys_desc: "Managing overseas assets is no easy task. To consolidate relations with neighbouring Chinese kingdoms, we must project security and efficiency. The Dutch Stadthuys, standing at the heart of Malacca, will serve as the administrative capital of the Malacca state, dedicated to the service of our merchants."
ned_formosa_title: "Establish Fort Zeelandia"
ned_formosa_desc: "To gain a foothold in the Chinese market, we must secure the island of Formosa. Given our relentless efforts to open new overseas markets, growing freight demands have kept our architects working day and night to expand the island's ports."
ned_silver_empire_title: "Silver Empire"
ned_silver_empire_desc: "We have heard a legend of a distant shore—a land inhabited by a quiet and peculiar people. This has kindled our curiosity, prompting settlers to sail deeper into the Asian continent in search of new frontiers."
ned_pax_hollandica_title: "Pax Hollandica"
ned_pax_hollandica_desc: "The Netherlands is ushering in an era—an era of the Netherlands, an era bridging East Asia and Europe. East Indiamen laden with cargo sail from all corners of the world toward Amsterdam—this is what people call 'Pax Hollandica'."
 

ned_stadthuys_ttt:"Complete the event chain '§YFirst Contact§!' triggered by the previous mission."
ned_stadthuys_tt:"§Y[596.GetName]§! unlocks the great project '§YDutch Stadthuys§!'.\n"
ned_stadthuys_tt2:"We may spend §R2000§!£icon_gold£ to attempt to lease §Y[596.GetName]§!, or maintain the status quo."
ned_formosa_tt:"§Y[738.GetName]§! unlocks the great project '§YFort Zeelandia§!'.\n"
ned_formosa_tt_war:"§OThe wealth of the East has driven the directorate to make its most audacious decision yet—the 'Conquer All of China' plan.§!\n"
ned_formosa_tt_dip:"The local Formosan pirate Zheng Chenggong has petitioned the §Y[Root.GetName]§! government for a '§YLetter of Marque§!'…\n"
ned_pax_hollandica_tt:"Allows establishment of §YProtectorate§! subjects.\n\n§GStrengthens§! all basic §YTrade Policies§!.\nAllows use of §YTrade Mission§!—§YTrade Mission§! now requires only §Y40%§! trade power.\n"
