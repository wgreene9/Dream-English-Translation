DD_NED_64_t:"Tax Day"
DD_NED_64_d:"As the most loyal Kommissariat (one of them) of the Holy Roman Emperor, we are required to pay an annual tax as a token of our loyalty."
DD_NED_64a:"Very well."
DD_NED_64a_tt:"As our total development is §Y[Root.ned_dev_total.GetValue]§!, the tax due is §Y+10.0%§! of that (§Y[Root.ned_tax_total.GetValue]§!£icon_gold£).\n"
DD_NED_65_t:"Biding Our Time"
DD_NED_65a:"The future is here!"
DD_NED_65b:"We cannot afford the Emperor's wrath."
DD_NED_66_t:"The Second North–South War"
DD_NED_66_d:"War has broken out—at first just border skirmishes, but it has since escalated into a full-scale German war. Given our close ties with [north_fed_leader.GetName], it seems that intervention in the war has become inevitable."
DD_NED_66_d2:"[Root.Monarch.GetName] toyed with an old Imperial mark in his hand, watching it flip between his fingers before tossing it into the air. It landed on the table with a crisp clink. The worn coin spun in circles like a weary dancer, each rotation slower than the last, until it veered off-centre and fell flat. In its place, a new silver coin, already prepared, bore the portrait and coat of arms of [Root.Monarch.GetName]. The whole Low Countries had waited too long for this day. [Root.Monarch.GetName] took the fresh coin into his hand—under the sun, she shone brilliantly, gleaming with metallic lustre. The Empire's fools, to the very end, awaited the arrival of [Root.GetName]'s relief forces—unfortunately for them, they would never arrive."
DD_NED_66a:"The future is here."
DD_NED_66a_tt:"§YThanks to the Second North–South War diverting the Emperor's attention, we have been freed from the burden of heavy taxation.§!\n\n§RBut beware—trouble always follows close behind.§!\n"
DD_NED_66a_tt2:"§YThanks to the Second Great Christian Schism diverting the Emperor's attention, we have been freed from the burden of heavy taxation.§!\n\n§RBut beware—trouble always follows close behind.§!"
DD_NED_66b:"It is time to put an end to the Holy Roman Empire!"
DD_NED_66c:"Let us pretend nothing happened."
DD_NED_67_t:"Grain Tariff Expires"
DD_NED_67_d:"We previously lowered tariffs to encourage grain cultivation. Now that grain production has risen steadily, tariff incentives are no longer needed."
DD_NED_67a:"Good news."
DD_NED_68_t:"Sailing Beyond the Horizon"
DD_NED_68_d:"News has arrived from across the distant sea—Christopher Columbus has discovered a mysterious new continent. With Vasco da Gama's voyage, the theory of a spherical earth appears to have been confirmed. Due to the invasion of the mysterious Eastern Empire, an Iron Curtain has descended from the Urals to the Zagros, and Europe's access to spices has been wholly monopolised by Mediterranean merchants. Spice-loving monarchs are forced to pay exorbitant prices to these cunning merchants. In Amsterdam, several bankrupt merchants have decided on a desperate gamble—they have pooled every last coin they could muster, intending to follow Da Gama's route to the legendary Indies and trade for spices. Though maritime conditions remain harsh, and most ships never return, even a single successful voyage would more than compensate for all the losses of these speculators with nothing left to lose."
DD_NED_68a:"May you have fair winds!"
DD_NED_68a_modifier:"Indian Adventure"
desc_DD_NED_68a_modifier:"Even if we never return~"
DD_NED_69_t:"A Foothold in the East Indies"
DD_NED_69_d:"Now that we have gained a foothold in the East Indies, it is finally time to make use of the powers and privileges granted by our charter. A mercenary force belonging to the Company has boarded the fleet bound for the East Indies, alongside other employees, to rapidly establish our Eastern branch. The Company's government will then be organised in the East Indies, and local troops will be recruited to manage our Eastern enterprises.\n\nAmong the many colonies in the East Indies, the port of Batavia stands out from all settlements. The directorate has set its sights on this promising trade hub, hoping to use it as a base of operations and establish the Company's East Indian headquarters there, overseeing colonial and commercial affairs in the East. If the government approves special privileges for the Company in Batavia, it would yield unimaginable benefits for both the Netherlands and the Company."
DD_NED_69a:"This land and its people are entrusted to the East India Company!"
DD_NED_69b:"Decline their offer."
DD_NED_69a_tt:"Provinces in the §YMalaya§! and §YIndonesia§! regions will be ceded to @VOC§Y[VOC.GetName]§!, along with cores.\n"
DD_NED_69a_modifier:"East India Company Charter"
desc_DD_NED_69a_modifier:"The government has granted the East India Company privileged rights in the East Indies—sacred and inviolable."
DD_NED_69b_modifier:"East Indian Administration"
desc_DD_NED_69b_modifier:"Though this province is under the Company's influence to some extent, it remains subject to the national government."
DD_NED_69b_modifier2:"East Indian Wealth"
desc_DD_NED_69b_modifier2:"We need more hands in the East Indies to bring back the riches."
DD_NED_69c:"You are quite the greedy one."

DD_NED_70_t:"The West India Company"
DD_NED_70_d:"After the East India Company explored the North American coast on behalf of the Netherlands, twelve enterprising merchants, eager to seize commercial opportunities in the region, submitted a petition to the Dutch parliament. Their newly established trading company—the New Netherland Company—secured a monopoly on trade and navigation rights in North America. The company primarily engaged in the trade of slaves, precious metals, sugar, and other commodities, as well as colonial activities. It became one of the largest transatlantic slave-trading enterprises and pioneered the triangular trade model linking European manufacturing, the African slave trade, and American plantations.\n\nInitially, the company focused on North American fur trading and colonial settlement. But after being reorganised into the Dutch West India Company, modelled after its Eastern counterpart, the new West India Company shifted its emphasis to the gold trade of the entire Western hemisphere and the African slave trade, establishing numerous trading posts and colonies across the Americas and West Africa, with New Amsterdam as its hub. The company was the principal employer and instrument of colonisation in regions such as New Holland; those directly enslaved by it were put to work maintaining fortifications, farming, animal husbandry, timber clearing, and various other labours."
DD_NED_70a:"Slaves must flow."
DD_NED_70a_tt:"Unlock the §Ycompany§! type '§YWest India Company§!', grantable via the button below the §Yprovince building interface§! in §Yoverseas§! provinces. §g(If not visible, please check mod compatibility.)§!\n"
DD_NED_71_t:"Northern Shipping Company"
DD_NED_71_d:"Unlike other large trading companies, the Dutch Northern Shipping Company (Noordsche Compagnie) was something of an outlier. Founded by a group of merchant captains, bankers, retired naval officers, and royal privateers, it originally operated as a maritime transport company in the North Sea. After the reorganisation of the New Netherland Company, the Northern Shipping Company was able to take over the fur trade, commerce, and colonial affairs in the northern part of North America.\n\nWith parliamentary approval, the Northern Shipping Company collaborated with the Dutch navy and was authorised to operate as a legitimate armed commercial maritime enterprise. Its business expanded beyond passenger and cargo shipping to include convoy escort, mercenary services, trade, colonisation, and military reconnaissance—even participating in multiple naval operations. The company now covers nearly the entire trade network of Northern and Eastern Europe, exerting a profound influence on Northern intelligence networks."
DD_NED_71a:"The open sea is wealth."
DD_NED_71a_tt:"Unlock the §Ycompany§! type '§YNorthern Shipping Company§!', grantable via the button below the §Yprovince building interface§!. §g(If not visible, please check mod compatibility.)§!\n"
DD_NED_72_t:"National Trading Company"
DD_NED_72_d:"The Dutch National Trading Company—originally known as the Republican Era—was an overseas trade and colonial enterprise established by the government of the United Provinces of the Netherlands. It was founded to promote trade, shipping, shipbuilding, industry, and agriculture. After government capital injection and the merger of several multi-sector companies, it was renamed the Dutch National Trading Company. The company aspired to become a global import–export enterprise, expanding its trade networks and Dutch political and economic influence worldwide.\n\nIn practice, due to its close relationship with the government, the company effectively became a lever for state economic regulation. After acquiring several banks, the National Trading Company gradually turned toward the financial sector, expanding its commercial, shipping, and financial operations through intelligence gathering and the pursuit of new markets. It ultimately became the national bank of the Netherlands, intimately tied to the state."
DD_NED_72a:"For the Dutch fatherland!"
DD_NED_72a_tt:"Unlock the §Ycompany§! type '§YNational Trading Company§!', grantable via the button below the §Yprovince building interface§!. §g(If not visible, please check mod compatibility.)§!\n"

DD_NED_73_t:"Royal Trading Company"
DD_NED_73_d:"The Dutch Royal Trading Company was an overseas trade and colonial enterprise established by the Crown. It was founded to promote trade, shipping, shipbuilding, industry, and agriculture. The company was largely held by the Crown and possessed multiple charters granted by both the royal household and parliament, formed through the merger of several medium-sized trading firms. The Dutch Royal Trading Company aspired to become a global import–export enterprise, expanding its trade networks and Dutch political and economic influence worldwide.\n\nIn practice, due to its close relationship with the Crown, the company effectively became a lever for royal economic regulation. After acquiring several banks, the Royal Trading Company gradually turned toward the financial sector, expanding its commercial, shipping, and financial operations through intelligence gathering and the pursuit of new markets. It ultimately became the national bank of the Netherlands, closely tied to the state."
DD_NED_73a:"For the Dutch fatherland!"
DD_NED_73a_tt:"Unlock the §Ycompany§! type '§YRoyal Trading Company§!', grantable via the button below the §Yprovince building interface§!. §g(If not visible, please check mod compatibility.)§!\n"
DD_NED_74_t:"East India Company"
DD_NED_74_d:"With the opening of new sea routes to the East, more and more Dutch merchants turned their gaze toward the trade of the East Indies. With our permission, maritime adventurers threw themselves enthusiastically into colonial ventures and overseas commerce. Within a decade of the discovery of the East Indies route, the Netherlands had founded fourteen separate trading companies dedicated to East Indian colonial commerce. They eventually merged to form the world's first multinational corporation—the Dutch East India Company.\n\nThe East India Company was composed of six chambers located in Amsterdam, Middelburg in Zeeland, Enkhuizen, Delft, Hoorn, and Rotterdam, with its headquarters established at Batavia in the East Indies. Its board of directors comprised over seventy members, but real power was wielded by just seventeen—known as the Heeren XVII. The East India Company was authorised to raise its own mercenary forces, mint currency, conclude formal treaties with other states, and exercise colonial and governing authority over the territories it controlled."
DD_NED_74a:"The world is like a ship in a bottle."
DD_NED_74a_tt:"Unlock the §Ycompany§! type '§YEast India Company§!', grantable via the button below the §Yprovince building interface§! in §Yoverseas§! provinces. §g(If not visible, please check mod compatibility.)§!\n"

DD_NED_76_t:"Déjà Vu"
DD_NED_76_d:"After a long voyage, the fleet that had braved the storms finally reached the long-dreamed-of East Indies. Yet contrary to their expectations, they encountered strangely familiar faces. Even after rounding the southernmost tip of the dark continent, the same persistent Eastern countenances appeared before them. Fortunately, these peculiar Eastern masters merely resembled the others in appearance, rather than being the very same people—they simply found these newly arrived Westerners somewhat odd. Still, there was good news: as the Dutch merchants had imagined, purchasing raw spices at their source was indeed cheaper than the exorbitant prices demanded by the Anatolian profiteers—though the profits fell far short of what they had anticipated.\n\nThe locals called this land 'Nantian' (Southern Heaven), the island and sea parts 'Nanyang' (Southern Ocean), and the continental part 'Nanzhou' (Southern Continent). The Dutch merchants, in turn, named it the 'East Indies'—meaning the East of India, in contrast to the West Indies. Through some difficult and clumsy exchanges, they learned that the East Indies and the 'Iron Curtain' state of Persia appeared to be ruled by the same Emperor—a revelation that cast an ominous shadow over their future East Indian trade ventures, leaving them deeply unsettled."
DD_NED_76a:"At least the journey was not in vain."

DD_NED_77_t:"An Unexpected Boon"
DD_NED_77_d:"In the year [GetYear], sailors of the East India Company chanced upon a fist-sized yellow gemstone lying on the beach—it was golden throughout, gleaming with a waxy lustre in the sunlight, as if liquid fire flowed within. The discovery sent the Company's headquarters into a frenzy. At the time, the European jewellery market was thirsting for rare gemstones, and yellow sapphires were regarded as symbols of power and wealth.\n\nThe following spring, the East India Company assembled an expedition of geologists, surveyors, and armed guards, pushing northward along the Cape Colony. They traversed thorny scrublands, crossed dry riverbeds, and marched for months under the scorching sun and blowing dust. The local Khoisan people warned of a 'golden demon that devours men' in the north, but the expedition pressed on undeterred. Then, one evening, the guide suddenly pointed at a distant cliff in astonishment—the setting sun had painted the entire rock face gold, and countless crystals sparkled within the crevices, like fallen stars.\n\nAfter three years of exploration, the expedition determined that the region—spanning what is now South Africa's Northern Cape Province to the Namibian border—held the densest concentration of yellow sapphire deposits in the world. The ore was of exceptional purity, needing no elaborate cutting to dazzle the eye. The Company swiftly erected forts and mining camps, forced local tribes to dig the pits, and shipped the gems back to Amsterdam in lead-lined chests. These Cape gems soon became treasures avidly sought after by the royal courts of Europe."
DD_NED_77a:"Excellent—most excellent."
DD_NED_77a_modifier:"Cape Gem Fields"
desc_DD_NED_77a_modifier:"The gems of the Cape will herald a new era."
DD_NED_78_t:"Zheng Chenggong and the Pirate Syndicate"
DD_NED_78_d:"With the establishment of Fort Zeelandia, the Dutch East India Company's hold on Formosa grew ever more secure. This imposing fortress, perched along the inland coast of Taijiang Bay, served not only as the Company's military bridgehead in the East but also as a vital hub linking Japanese silver, Chinese raw silk, and Southeast Asian spices. Each month, Company fleets laden with fine porcelain, silk, and tea set sail from here, carrying the treasures of the East westward.\n\nYet great wealth, like a lighthouse in the night, inevitably attracted the greedy gazes of countless predators in the surrounding seas. Armed groups—part traders, part pirates—long active along the coasts of Fujian and Guangdong, frequently harassed the Company's trade routes. Though the Company possessed advanced galleons and cannon, the intricate inshore waters made surprise attacks difficult to defend against, resulting in heavy losses. Reports of attacked merchant ships poured into Batavia, much to the Governor-General's chagrin.\n\nIt was at this juncture that an unusual visitor broke the impasse. The young Zheng Chenggong—scion of both Chinese and Japanese blood, clad in Confucian robes yet bearing a Japanese blade at his waist—arrived at the island at the head of his own delegation. In a meeting charged with subtle tensions, Zheng did not demand ransom like a traditional pirate; instead, he put forward a bold political proposal. He presented himself before Governor Frederik Coyett with a 'letters of marque' proposition: he requested that the Dutch authorities formally recognise and fund his 'licensed privateering' operations.\n\nIn essence, this was an agreement that exchanged official endorsement for a monopoly at sea. For the Dutch, mired in a quagmire of counter-insurgency warfare, this was both a dangerous bargain and a shortcut out of their predicament. The candlelight in the council chamber flickered, casting shadows across the knowing faces of both parties."
DD_NED_78a:"He shall be our invincible conqueror."
DD_NED_78b:"He shall serve our navy."
DD_NED_78c:"Does he truly believe we have no way to deal with them? Dispatch forces at once to root out these pirates!"
NED_FRM_NAME:"Formosa"
NED_FRM_NAME_ADJ:"Formosan"

DD_NED_79_t:"Rangaku (Dutch Learning)"
DD_NED_79_d:"During the period when Chinese merchants operated freely in Japan, the Celestial Empire's interference in Japanese policy eventually aroused the ire of [1020.Owner.GetName]. This was followed by the peasant uprising known as the Shimabara Rebellion, which ultimately compelled the [1020.Owner.GetName] government, in its exasperation, to exile most of the rebellious Han Chinese and Mongols. [1020.Owner.GetName] then declared a policy of national seclusion, prohibiting all foreign powers from further meddling in Japanese politics.\n\nOwing to the Dutch government's demonstrated good faith—having generously provided aid to the [1020.Owner.GetName] government during the Shimabara Rebellion—and further bolstered by the Netherlands' unassailable influence and political standing in Japan, in the year $YEAR$, the two nations concluded the Treaty of Amity between Japan and the Netherlands (the Treaty of Kanagawa). This treaty permitted Dutch merchants to establish a trading post at Dejima in Nagasaki, engaging in commerce without excessive interference in Japanese governance. Through Dutch merchants, Western learning, culture, and technology were transmitted to Japan, collectively known as Rangaku (Dutch Learning), which laid the foundations for Japan's early scientific development."
DD_NED_79a:"Dutch merchants at Dejima spread Western knowledge throughout Japan."
ned_trade_japan_modifier:"Trade with Japan"
desc_ned_trade_japan_modifier:"Trade with Japan has shown us a glimpse of another corner of the world."
ned_trade_japan_modifier2:"Trade with the West"
desc_ned_trade_japan_modifier2:"Western technology has broadened our horizons."

DD_NED_80_t:"First Contact"
DD_NED_80_d:"A ship of the East India Company, sailing with the tacit approval of the Dutch authorities, set out from the Cape. Her destination was the region now known as the 'East Indies'—the Southern Seas—with the primary objective of gathering intelligence on the Celestial Empire. The Dutch knew very little of this Eastern empire. Fortunately, they knew equally little of the Dutch. Both long-term cooperation and the forceful seizure of spice-producing territories remained viable options, but the parliament preferred to make some initial contacts before reaching a decision."
DD_NED_80a:"Set sail."
DD_NED_81_t:"Indian Ocean Supply Posts"
DD_NED_81_d:"In the first chapter of their voyage, the islands of East Africa and the Indian Ocean were found to be dotted with outposts established by mysterious Easterners. According to the Nubian interpreter they had specially hired in East Africa, these outposts had existed for centuries—originally merely temporary moorings for the 'treasure fleet,' but over time, with increasing trade, they had gradually developed into small colonies where merchant convoys could stop for supplies. Fortunately, their interpreter frequently plied this route; with his introductions, the Dutch merchant ships were able to dock at these ports for provisions. Yet if the Netherlands ever wished to expand—or even monopolise—this trade route, these islands might well become contested ground."
DD_NED_81a:"Marked a location."
DD_NED_82_t:"First Arrival at Malacca"
DD_NED_82_d:"After departing the islands of the Indian Ocean, the convoy sailed directly for the city of Malacca. It was said that she commanded the strategic strait, and that vessels bound for India would make their final replenishment here. For this reason, it was also one of the busiest ports in the Southern Seas. The locals called this strait 'Selat Longya'—the 'Dragon's Teeth Strait.' Upon setting foot ashore, the convoy members were astonished by the diverse array of peoples they encountered—some resembled Easterners, others looked like Persians or the like, and many appeared to be simply natives. The market streets were a dazzling display of spices, porcelains, silk, and countless other goods. Curiously, however, the locals did not use gold—common in the West—as a medium of exchange, but rather silver. No matter—fortunately, the Dutch had done their homework and brought ample silver with them."
DD_NED_82a:"Load onto the ships every kind of commodity we can buy!"

