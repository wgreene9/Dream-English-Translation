DD_NED_trader_in_power:"Dutch Merchants"
DD_NED_trader_in_power_desc:"The self-proclaimed merchants of the Netherlands thrive here as fish in water."
DD_ned_stadthuys_modifier:"Trading Post"
desc_DD_ned_stadthuys_modifier:"Our fine merchants have established a trading post in this location."
ned_silver_empire_tt:"After conquering most of China, governing this populous region is clearly a complex affair. To that end, the East India Company has submitted a proposal to establish a @VO0 branch in the China subcontinent.\n"
ned_pax_hollandica_modifier:"Pax Hollandica"
desc_ned_pax_hollandica_modifier:"Future generations shall call this era 'the Peace of the Netherlands'."
ned_pax_hollandica_pp:"East Indian Hegemony"

ned_global_trade_hegemon_title: "Global Trade Hegemony"
ned_global_trade_hegemon_desc: "All other nations—no matter how vast their territories or how renowned their prestige—dare not claim superiority over us in maritime enterprise. Neither the detestable British nor the arrogant Spaniards can doubt our expertise and dominance in trade across the seven seas!"

ned_found_batavia_title: "Found Batavia"
ned_found_batavia_desc: "After establishing the mighty Dutch East India Company to manage our Asian navigation and trade affairs, the vast distance between our plantations and their markets raised the question of establishing a base of operations."
ned_spice_trade_title: "Control the Spice Trade"
ned_spice_trade_desc: "Global trade brings immense wealth, and the exotic treasures carried by Dutch merchants from the Far East—cloves and spices—will take the European market by storm!"
ned_seize_malacca_title: "Seize Dragon's Tooth"
ned_seize_malacca_desc: "The trade routes east of the Dragon's Tooth Strait are of immeasurable significance to our nation's wealth. Securing a safe passage will undoubtedly have a positive impact on the treasury."

 

ned_dutch_west_indies_company_modifier:"West Indies Route"
desc_ned_dutch_west_indies_company_modifier:"Our rule in the West Indies will soon bring us vast wealth."
ned_orinoco_flow_delta_modifier:"Delta Node"
desc_ned_orinoco_flow_delta_modifier:"This delta is the only usable port in the region."
ned_colonial_outpost_modifier:"Colonial Outpost"
desc_ned_colonial_outpost_modifier:"This province is a colonial outpost."
ned_east_indies_company_administration_modifier:"Ceylon Base"
desc_ned_east_indies_company_administration_modifier:"This province is a base of operations."
ned_voyage_to_brazil_modifier:"Voyage to Brazil"
desc_ned_voyage_to_brazil_modifier:"These redwoods are perfect for building fine houses."
ned_sun_never_sets_modifier:"Empire on Which the Sun Never Sets"
desc_ned_sun_never_sets_modifier:"Our sun-never-sets has begun."
ned_beyond_cape_modifier:"Beyond the Cape"
desc_ned_beyond_cape_modifier:"Beyond the Cape lies a boundless new world."
ned_trading_malay_kingdoms_modifier:"Trade with the Malay Kingdoms"
desc_ned_trading_malay_kingdoms_modifier:"Through negotiation with the kingdoms of the Southern Seas, we have successfully opened a trade route here."
ned_fort_zeelandia_modifier:"Fort Zeelandia"
desc_ned_fort_zeelandia_modifier:"This impregnable fortress shall serve as our key stronghold in China."
DD_ned_found_batavia_modifier:"East India Company Headquarters"
desc_DD_ned_found_batavia_modifier:"This province is home to the illustrious headquarters of the East India Company."
ned_found_batavia_tt:"As our expansion in the East Indies continues, @VOC§Ythe East India Company§! considers §Y[630.GetName]§! an ideal base, and wishes to establish its headquarters here to better administer all lands in the East Indies.\n"

ned_spice_must_flow_modifier: "Spice Must Flow"
desc_ned_spice_must_flow_modifier:"Flow, my spices, flow."
ned_spice_trade_modifier_prov:"Overexploitation"
desc_ned_spice_trade_modifier_prov:"It won't cause any harm, right?"
ned_secured_flow_malacca_modifier: "Secured Shipping Lanes"
desc_ned_secured_flow_malacca_modifier:"The sea route from the East Indies to Europe is now under our control—profits increase by the day."
ned_seize_malacca_modifier:"Export Extraction"
desc_ned_seize_malacca_modifier:"The East India Company will relentlessly exploit the East Indies for profit."
ned_seize_malacca_modifier2:"Key Node"
desc_ned_seize_malacca_modifier2:"We shall not let a single node along this route slip through our grasp."
voc_stable_administration_modifier: "Stable VOC Administration"
desc_voc_stable_administration_modifier:"Steady progress toward prosperity."
voc_newfound_voc_modifier: "Newly Founded VOC"
desc_voc_newfound_voc_modifier:"Truly a land of vibrant life."

DD_NED_VOC_company_button_tooltip:"§YAuthorise the East India Company§!\nThe East India Company focuses on colonial commerce in the East Indies, with powers to raise mercenary forces, mint currency, conclude formal treaties with other states, and exercise colonial and governing authority in the East Indies."
DD_NED_WIC_company_button_tooltip:"§YAuthorise the West India Company§!\nThe West India Company focuses on the gold trade of the entire Western hemisphere and the African slave trade, establishing numerous trading posts and colonies across the Americas and West Africa with New Amsterdam as its hub. The company is a staunch advocate of colonisation and the slave trade in regions such as New Netherland."
DD_NED_north_company_button_tooltip:"§YAuthorise the Northern Shipping Company§!\nThe Northern Shipping Company is composed primarily of merchant captains, bankers, retired naval officers, and royal privateers. Its main activities include fur trading, commerce, and colonial affairs in North America; it is also a legal armed maritime company, having participated in multiple naval operations.\n"
DD_NED_royal_company_button_tooltip:"§YAuthorise the Royal Trading Company§!\nThe Dutch Royal Trading Company is an overseas trade and colonial enterprise established by the Crown. The company is largely held by the Crown and holds multiple charters granted by both the royal household and parliament, aspiring to become a global import–export enterprise that expands its trade network and Dutch political and economic influence worldwide."
DD_NED_republic_company_button_tooltip:"§YAuthorise the National Trading Company§!\nThe Dutch National Trading Company—originally known as the Republican Era—was established by the government of the United Provinces of the Netherlands as an overseas trade and colonial enterprise. It aspires to become a global import–export enterprise, expanding its trade network and Dutch political and economic influence worldwide."

